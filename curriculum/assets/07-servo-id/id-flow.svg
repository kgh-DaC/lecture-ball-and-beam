<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 212" width="770" height="212" role="img" aria-labelledby="t d">
<title id="t">시스템 식별의 순서</title>
<desc id="d">① 포텐쇼미터 보정(raw를 각도로) → ② 입력 신호 고르기(스텝, PRBS, 처프) → ③ 공 없이 5 ms 간격으로 기록 → ④ 모델 맞춤(K, T_d, τ) → ⑤ 다른 기록으로 검증 → ⑥ result.json 저장. 검증 적합도가 낮으면 ④로 돌아가 모델 구조를 바꾼다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="769" height="211" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="14" y="30" class="b" text-anchor="start">시스템 식별의 순서</text><rect x="14" y="56" width="108" height="62" rx="6" class="bx-pur"/><text x="68" y="84" class="b" text-anchor="middle">① 보정</text><text x="68" y="102" class="s" text-anchor="middle">raw → 각도</text><text x="68" y="136" class="xs f-m" text-anchor="middle">2절</text><rect x="140" y="56" width="108" height="62" rx="6" class="bx-blue"/><text x="194" y="84" class="b" text-anchor="middle">② 입력 고르기</text><text x="194" y="102" class="s" text-anchor="middle">스텝·PRBS·처프</text><line x1="124" y1="87" x2="132" y2="87" class="ln c-k "/><polygon points="138,87 129.7,90.5 129.7,83.5" class="f-k"/><text x="194" y="136" class="xs f-m" text-anchor="middle">3절</text><rect x="266" y="56" width="108" height="62" rx="6" class="bx-org"/><text x="320" y="84" class="b" text-anchor="middle">③ 기록</text><text x="320" y="102" class="s" text-anchor="middle">5 ms, 공 없이</text><line x1="250" y1="87" x2="258" y2="87" class="ln c-k "/><polygon points="264,87 255.7,90.5 255.7,83.5" class="f-k"/><text x="320" y="136" class="xs f-m" text-anchor="middle">4.2절</text><rect x="392" y="56" width="108" height="62" rx="6" class="bx-grn"/><text x="446" y="84" class="b" text-anchor="middle">④ 모델 맞춤</text><text x="446" y="102" class="s" text-anchor="middle">K, T<tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em">, τ</tspan></text><line x1="376" y1="87" x2="384" y2="87" class="ln c-k "/><polygon points="390,87 381.7,90.5 381.7,83.5" class="f-k"/><text x="446" y="136" class="xs f-m" text-anchor="middle">4절</text><rect x="518" y="56" width="108" height="62" rx="6" class="bx-grn"/><text x="572" y="84" class="b" text-anchor="middle">⑤ 검증</text><text x="572" y="102" class="s" text-anchor="middle">다른 기록으로</text><line x1="502" y1="87" x2="510" y2="87" class="ln c-k "/><polygon points="516,87 507.7,90.5 507.7,83.5" class="f-k"/><text x="572" y="136" class="xs f-m" text-anchor="middle">6절</text><rect x="644" y="56" width="108" height="62" rx="6" class="bx-blue"/><text x="698" y="84" class="b" text-anchor="middle">⑥ 저장</text><text x="698" y="102" class="s" text-anchor="middle">result.json</text><line x1="628" y1="87" x2="636" y2="87" class="ln c-k "/><polygon points="642,87 633.7,90.5 633.7,83.5" class="f-k"/><text x="698" y="136" class="xs f-m" text-anchor="middle">7절</text><path d="M572 146L572 168L446 168L446 152" class="ln c-red dash"/><polygon points="446,146 449.5,154.3 442.5,154.3" class="f-red"/><text x="518" y="188" class="s b f-red" text-anchor="middle">검증 적합도가 낮으면 모델 구조를 바꾼다</text>
</svg>
