<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 340" width="810" height="340" role="img" aria-labelledby="t d">
<title id="t">진폭에 따라 달라지는 서보 응답</title>
<desc id="d">스텝 크기로 나눈 서보 응답 시뮬레이션. 가정 서보(최대 속도 400°/s)는 5° 스텝과 30° 스텝의 모양이 거의 같다(63% 도달 80 ms와 82 ms). 최대 속도가 150°/s인 느린 서보 예는 30° 스텝에서 처음에 직선으로 움직여 63% 도달이 146 ms로 늦고, 1차 모델로 맞춘 τ가 104 ms로 커진다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="809" height="339" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="70" y="28" class="b" text-anchor="start">진폭을 키우면: 속도 한계가 드러나는 서보는 τ가 커 보인다 [시뮬레이션]</text><line x1="70" y1="288" x2="520" y2="288" class="ln c-m thin dot"/><line x1="70" y1="155.9" x2="520" y2="155.9" class="ln c-m thin dot"/><line x1="70" y1="78.9" x2="520" y2="78.9" class="ln c-m thin dot"/><line x1="70" y1="288" x2="528" y2="288" class="ln c-k "/><polygon points="534,288 525.7,291.5 525.7,284.5" class="f-k"/><line x1="70" y1="288" x2="70" y2="52" class="ln c-k "/><polygon points="70,46 73.5,54.3 66.5,54.3" class="f-k"/><line x1="70" y1="288" x2="70" y2="293" class="ln c-k "/><text x="70" y="307" class="s" text-anchor="middle">0</text><line x1="220" y1="288" x2="220" y2="293" class="ln c-k "/><text x="220" y="307" class="s" text-anchor="middle">0.1</text><line x1="370" y1="288" x2="370" y2="293" class="ln c-k "/><text x="370" y="307" class="s" text-anchor="middle">0.2</text><line x1="520" y1="288" x2="520" y2="293" class="ln c-k "/><text x="520" y="307" class="s" text-anchor="middle">0.3</text><line x1="65" y1="288" x2="70" y2="288" class="ln c-k "/><text x="62" y="292" class="s" text-anchor="end">0</text><line x1="65" y1="155.9" x2="70" y2="155.9" class="ln c-k "/><text x="62" y="159.9" class="s" text-anchor="end">0.632</text><line x1="65" y1="78.9" x2="70" y2="78.9" class="ln c-k "/><text x="62" y="82.9" class="s" text-anchor="end">1</text><text x="524" y="324" class="s" text-anchor="end">명령 뒤 시간 (s)</text><text x="76" y="42" class="s" text-anchor="start">각도 ÷ 스텝 크기</text><path d="M70 288L77.5 288L85 288L92.5 288L100 288L107.5 282.8L115 277.5L122.5 272.3L130 267.1L137.5 261.9L145 256.6L152.5 251.4L160 246.2L167.5 241L175 235.7L182.5 230.5L190 225.3L197.5 220L205 214.8L212.5 209.6L220 204.4L227.5 199.1L235 193.9L242.5 188.7L250 183.5L257.5 178.2L265 173L272.5 167.8L280 162.5L287.5 157.3L295 152.1L302.5 146.9L310 141.6L317.5 136.6L325 132L332.5 127.8L340 123.9L347.5 120.3L355 117L362.5 113.9L370 111.1L377.5 108.5L385 106.2L392.5 104L400 102L407.5 100.1L415 98.4L422.5 96.9L430 95.4L437.5 94.1L445 92.9L452.5 91.8L460 90.8L467.5 89.8L475 88.9L482.5 88.1L490 87.4L497.5 86.7L505 86.1L512.5 85.5" class="ln c-red thick"/><path d="M70 288L77.5 288L85 288L92.5 288L100 288L107.5 271.3L115 255.9L122.5 241.7L130 228.7L137.5 216.8L145 205.7L152.5 195.6L160 186.3L167.5 177.7L175 169.8L182.5 162.5L190 155.8L197.5 149.7L205 144L212.5 138.8L220 134L227.5 129.6L235 125.6L242.5 121.8L250 118.4L257.5 115.2L265 112.3L272.5 109.7L280 107.2L287.5 104.9L295 102.9L302.5 100.9L310 99.2L317.5 97.6L325 96.1L332.5 94.7L340 93.4L347.5 92.3L355 91.2L362.5 90.2L370 89.3L377.5 88.5L385 87.7L392.5 87L400 86.4L407.5 85.8L415 85.2L422.5 84.7L430 84.3L437.5 83.8L445 83.4L452.5 83.1L460 82.7L467.5 82.4L475 82.2L482.5 81.9L490 81.7L497.5 81.4L505 81.2L512.5 81" class="ln c-blue thick"/><path d="M70 288L77.5 288L85 288L92.5 288L100 288L107.5 274.1L115 260.1L122.5 246.2L130 232.8L137.5 220.5L145 209.2L152.5 198.8L160 189.2L167.5 180.4L175 172.3L182.5 164.8L190 157.9L197.5 151.6L205 145.8L212.5 140.4L220 135.5L227.5 131L235 126.8L242.5 123L250 119.5L257.5 116.2L265 113.2L272.5 110.5L280 108L287.5 105.7L295 103.5L302.5 101.5L310 99.7L317.5 98.1L325 96.5L332.5 95.1L340 93.8L347.5 92.6L355 91.5L362.5 90.5L370 89.6L377.5 88.7L385 88L392.5 87.2L400 86.6L407.5 86L415 85.4L422.5 84.9L430 84.4L437.5 84L445 83.6L452.5 83.2L460 82.8L467.5 82.5L475 82.2L482.5 82L490 81.7L497.5 81.5L505 81.3L512.5 81.1" class="ln c-org thick dash"/><circle cx="189.9" cy="155.9" r="5" class="f-blue"/><circle cx="289.3" cy="155.9" r="5" class="f-red"/><line x1="548" y1="78" x2="568" y2="78" class="ln c-blue thick"/><text x="576" y="75" class="s b f-blue" text-anchor="start">가정 서보, 5° 스텝</text><text x="576" y="91" class="xs" text-anchor="start">63% 도달 80 ms, 맞춘 τ 60 ms</text><line x1="548" y1="128" x2="568" y2="128" class="ln c-org thick dash"/><text x="576" y="125" class="s b f-org" text-anchor="start">가정 서보, 30° 스텝</text><text x="576" y="141" class="xs" text-anchor="start">63% 도달 82 ms, 맞춘 τ 60 ms</text><line x1="548" y1="178" x2="568" y2="178" class="ln c-red thick"/><text x="576" y="175" class="s b f-red" text-anchor="start">느린 서보 예, 30° 스텝</text><text x="576" y="191" class="xs" text-anchor="start">63% 도달 146 ms, 맞춘 τ 104 ms</text><rect x="542" y="212" width="246" height="66" rx="8" class="bx-red"/><text x="552" y="234" class="s" text-anchor="start">처음에 직선(램프)으로 움직이면</text><text x="552" y="252" class="s" text-anchor="start">속도 한계에 걸린 것이다.</text><text x="552" y="270" class="xs b" text-anchor="start">경계: 스텝 크기 &gt; v<tspan dy="0.35em" font-size="72%">max</tspan><tspan dy="-0.35em">·τ</tspan></text><text x="548" y="304" class="xs f-m" text-anchor="start">가정 서보 v<tspan dy="0.35em" font-size="72%">max</tspan><tspan dy="-0.35em"> 400°/s (경계 24°),</tspan></text><text x="548" y="318" class="xs f-m" text-anchor="start">느린 서보 예 150°/s (경계 9°) [가정]</text>
</svg>
