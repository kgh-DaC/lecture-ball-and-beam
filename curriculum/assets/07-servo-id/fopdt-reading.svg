<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 346" width="810" height="346" role="img" aria-labelledby="t d">
<title id="t">1차+지연 서보 모델 그래프로 읽기</title>
<desc id="d">명령각 0° → 10° 스텝에 대한 가정 서보의 응답. 최종 변화를 명령 변화로 나눈 K = 1.00. 응답이 최종 변화의 10%(1°)에 도달한 시각 t10 = 26 ms와 63.2%(6.32°)에 도달한 시각 t63 = 80 ms를 읽고, 2점법 τ = (t63 − t10)/0.895 = 60 ms, T_d = t63 − τ = 20 ms를 구한다.</desc>
