<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d">
<title id="t">포텐쇼미터 캘리브레이션 직선</title>
<desc id="d">가로축은 A0에서 읽은 raw 값, 세로축은 명령각. −20°, −10°, 0°, +10°, +20°에서 잰 다섯 점에 최소제곱 직선(각도 = a·raw + b, a ≈ 0.342 °/LSB)을 맞추고, 각 점과 직선의 세로 거리(잔차)를 본다. 잔차가 1°를 넘으면 포텐쇼미터가 비선형이거나 접촉이 불안정하다는 경고다. 예시 그림이며 점의 어긋남은 보이도록 크게 그렸다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="799" height="359" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="80" y="28" class="b" text-anchor="start">캘리브레이션: 다섯 점에 직선을 맞춘다 (예시)</text><line x1="80" y1="276.9" x2="520" y2="276.9" class="ln c-m thin dot"/><line x1="80" y1="232.4" x2="520" y2="232.4" class="ln c-m thin dot"/><line x1="80" y1="188" x2="520" y2="188" class="ln c-m thin dot"/><line x1="80" y1="143.6" x2="520" y2="143.6" class="ln c-m thin dot"/><line x1="80" y1="99.1" x2="520" y2="99.1" class="ln c-m thin dot"/><line x1="80" y1="308" x2="528" y2="308" class="ln c-k "/><polygon points="534,308 525.7,311.5 525.7,304.5" class="f-k"/><line x1="80" y1="308" x2="80" y2="62" class="ln c-k "/><polygon points="80,56 83.5,64.3 76.5,64.3" class="f-k"/><line x1="94.7" y1="308" x2="94.7" y2="313" class="ln c-k "/><text x="94.7" y="327" class="s" text-anchor="middle">260</text><line x1="212" y1="308" x2="212" y2="313" class="ln c-k "/><text x="212" y="327" class="s" text-anchor="middle">300</text><line x1="329.3" y1="308" x2="329.3" y2="313" class="ln c-k "/><text x="329.3" y="327" class="s" text-anchor="middle">340</text><line x1="446.7" y1="308" x2="446.7" y2="313" class="ln c-k "/><text x="446.7" y="327" class="s" text-anchor="middle">380</text><line x1="75" y1="276.9" x2="80" y2="276.9" class="ln c-k "/><text x="72" y="280.9" class="s" text-anchor="end">−20</text><line x1="75" y1="232.4" x2="80" y2="232.4" class="ln c-k "/><text x="72" y="236.4" class="s" text-anchor="end">−10</text><line x1="75" y1="188" x2="80" y2="188" class="ln c-k "/><text x="72" y="192" class="s" text-anchor="end">0</text><line x1="75" y1="143.6" x2="80" y2="143.6" class="ln c-k "/><text x="72" y="147.6" class="s" text-anchor="end">+10</text><line x1="75" y1="99.1" x2="80" y2="99.1" class="ln c-k "/><text x="72" y="103.1" class="s" text-anchor="end">+20</text><text x="524" y="344" class="s" text-anchor="end">A0 값 raw (0~1023)</text><text x="86" y="52" class="s" text-anchor="start">명령각 (°)</text><line x1="88.8" y1="295.9" x2="511.2" y2="76.9" class="ln c-blue thick"/><line x1="150.8" y1="276.9" x2="150.8" y2="263.8" class="ln c-red thick"/><circle cx="150.8" cy="276.9" r="4.5" class="f-org"/><line x1="187.6" y1="232.4" x2="187.6" y2="244.7" class="ln c-red thick"/><circle cx="187.6" cy="232.4" r="4.5" class="f-org"/><line x1="282.3" y1="188" x2="282.3" y2="195.6" class="ln c-red thick"/><circle cx="282.3" cy="188" r="4.5" class="f-org"/><line x1="412" y1="143.6" x2="412" y2="128.4" class="ln c-red thick"/><circle cx="412" cy="143.6" r="4.5" class="f-org"/><line x1="452.4" y1="99.1" x2="452.4" y2="107.4" class="ln c-red thick"/><circle cx="452.4" cy="99.1" r="4.5" class="f-org"/><circle cx="562" cy="78" r="5.5" class="f-org"/><text x="580" y="75" class="s b f-org" text-anchor="start">측정한 점</text><text x="580" y="91" class="xs" text-anchor="start">명령각에서 2 s 기다린 뒤 20개 평균</text><line x1="552" y1="128" x2="572" y2="128" class="ln c-blue thick"/><text x="580" y="125" class="s b f-blue" text-anchor="start">맞춘 직선</text><text x="580" y="141" class="xs" text-anchor="start">각도 = a·raw + b</text><text x="580" y="155" class="xs" text-anchor="start">a ≈ 0.342 °/LSB, b ≈ −112.6°</text><line x1="562" y1="184" x2="562" y2="204" class="ln c-red thick"/><text x="580" y="191" class="s b f-red" text-anchor="start">잔차</text><text x="580" y="207" class="xs" text-anchor="start">점과 직선의 세로 거리</text><text x="580" y="221" class="xs" text-anchor="start">최댓값이 1°를 넘으면 경고</text><text x="552" y="270" class="xs f-m" text-anchor="start">직선은 HS-5645MG 기본 보정 근처,</text><text x="552" y="284" class="xs f-m" text-anchor="start">점의 어긋남은 보이도록 일부러</text><text x="552" y="298" class="xs f-m" text-anchor="start">크게 그렸다(실제로는 1° 미만이어야)</text>
</svg>
