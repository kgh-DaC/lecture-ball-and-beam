<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 356" width="780" height="356" role="img" aria-labelledby="t d">
<title id="t">하드웨어 설정 순서</title>
<desc id="d">조립 전(혼만 단 서보): ① 서보 전원 5.0 V 확인으로 전원 전압을 세우고, ② 포텐쇼미터 매핑으로 A0와 각도의 직선을 세우고, ③ 서보 90° 고정으로 서보가 90°에 있음을 확인한다. 다음에 서보를 90°로 고정한 채 혼을 수평 방향으로 끼워 기구부를 조립한다. 조립 후: ④ 센서 기본 확인(초음파 값이 들어옴), ⑤ 수평 찾기(공이 제자리에 멈춤), ⑥ 거리 검증(평균적으로 맞게 잼), ⑦ 한 위치 안정성(잡음·튄 값 수준), ⑧ 각도 제한(안전한 각도 한계) 순서로 한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="355" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="12" y="14" width="432" height="136" rx="10" class="panel"/><rect x="25" y="24" width="62" height="20" rx="10" class="pill-blue"/><text x="56" y="38" class="xs b w" text-anchor="middle">조립 전</text><text x="96" y="39" class="s f-m" text-anchor="start">혼만 단 서보</text><rect x="26" y="54" width="124" height="50" rx="8" class="bx-blue"/><text x="88" y="76" class="s b" text-anchor="middle">① 서보 전원 5.0 V</text><text x="88" y="93" class="xs f-m" text-anchor="middle">멀티미터</text><text x="88" y="122" class="xs b f-blue" text-anchor="middle">전원 전압</text><line x1="151" y1="79" x2="159" y2="79" class="ln c-m "/><polygon points="165,79 156.7,82.5 156.7,75.5" class="f-m"/><rect x="166" y="54" width="124" height="50" rx="8" class="bx-blue"/><text x="228" y="76" class="s b" text-anchor="middle">② 포텐쇼미터 매핑</text><text x="228" y="93" class="xs f-m" text-anchor="middle">pot-mapping-test</text><text x="228" y="122" class="xs b f-blue" text-anchor="middle">A0 ↔ 각도 직선</text><line x1="291" y1="79" x2="299" y2="79" class="ln c-m "/><polygon points="305,79 296.7,82.5 296.7,75.5" class="f-m"/><rect x="306" y="54" width="124" height="50" rx="8" class="bx-blue"/><text x="368" y="76" class="s b" text-anchor="middle">③ 서보 90° 고정</text><text x="368" y="93" class="xs f-m" text-anchor="middle">servo-center-assist</text><text x="368" y="122" class="xs b f-blue" text-anchor="middle">서보가 90°에 있음</text><rect x="474" y="14" width="294" height="136" rx="10" class="panel"/><rect x="487" y="24" width="50" height="20" rx="10" class="pill-org"/><text x="512" y="38" class="xs b w" text-anchor="middle">조립</text><rect x="494" y="54" width="254" height="50" rx="8" class="bx-org"/><text x="621" y="76" class="s b" text-anchor="middle">기구부 조립</text><text x="621" y="93" class="xs f-m" text-anchor="middle">90°로 고정한 채 혼을 수평 방향으로</text><text x="621" y="122" class="xs b f-org" text-anchor="middle">남는 기울기가 작다</text><line x1="432" y1="79" x2="486" y2="79" class="ln c-m "/><polygon points="492,79 483.7,82.5 483.7,75.5" class="f-m"/><rect x="12" y="176" width="756" height="140" rx="10" class="panel"/><rect x="25" y="186" width="62" height="20" rx="10" class="pill-grn"/><text x="56" y="200" class="xs b w" text-anchor="middle">조립 후</text><text x="112" y="201" class="s f-m" text-anchor="start">빔·링크를 단 장치</text><rect x="26" y="216" width="134" height="50" rx="8" class="bx-grn"/><text x="93" y="238" class="s b" text-anchor="middle">④ 센서 기본 확인</text><text x="93" y="255" class="xs f-m" text-anchor="middle">signal-monitor</text><text x="93" y="284" class="xs b f-grn" text-anchor="middle">초음파 값이 들어옴</text><line x1="161" y1="241" x2="167" y2="241" class="ln c-m "/><polygon points="173,241 164.7,244.5 164.7,237.5" class="f-m"/><rect x="174" y="216" width="134" height="50" rx="8" class="bx-grn"/><text x="241" y="238" class="s b" text-anchor="middle">⑤ 수평 찾기(trim)</text><text x="241" y="255" class="xs f-m" text-anchor="middle">level-trim</text><text x="241" y="284" class="xs b f-grn" text-anchor="middle">공이 제자리에 멈춤</text><line x1="309" y1="241" x2="315" y2="241" class="ln c-m "/><polygon points="321,241 312.7,244.5 312.7,237.5" class="f-m"/><rect x="322" y="216" width="134" height="50" rx="8" class="bx-grn"/><text x="389" y="238" class="s b" text-anchor="middle">⑥ 거리 검증</text><text x="389" y="255" class="xs f-m" text-anchor="middle">sensor-position-test</text><text x="389" y="284" class="xs b f-grn" text-anchor="middle">평균적으로 맞게 잼</text><line x1="457" y1="241" x2="463" y2="241" class="ln c-m "/><polygon points="469,241 460.7,244.5 460.7,237.5" class="f-m"/><rect x="470" y="216" width="134" height="50" rx="8" class="bx-grn"/><text x="537" y="238" class="s b" text-anchor="middle">⑦ 한 위치 안정성</text><text x="537" y="255" class="xs f-m" text-anchor="middle">signal-monitor</text><text x="537" y="284" class="xs b f-grn" text-anchor="middle">잡음·튄 값 수준</text><line x1="605" y1="241" x2="611" y2="241" class="ln c-m "/><polygon points="617,241 608.7,244.5 608.7,237.5" class="f-m"/><rect x="618" y="216" width="134" height="50" rx="8" class="bx-grn"/><text x="685" y="238" class="s b" text-anchor="middle">⑧ 각도 제한</text><text x="685" y="255" class="xs f-m" text-anchor="middle">angle-limit-finder</text><text x="685" y="284" class="xs b f-grn" text-anchor="middle">안전한 각도 한계</text><path d="M621 150L621 164L93 164L93 172" class="ln c-m thin"/><line x1="93" y1="166" x2="93" y2="208" class="ln c-m "/><polygon points="93,214 89.5,205.7 96.5,205.7" class="f-m"/><text x="390" y="340" class="s" text-anchor="middle">굵은 글씨 = 그 단계가 세우는 기준. 다음 단계는 그 기준을 믿고 잰다.</text>
</svg>
