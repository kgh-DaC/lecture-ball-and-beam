<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d">
<title id="t">볼앤빔 기구부 구조</title>
<desc id="d">빔 왼쪽 끝에 초음파 센서 HC-SR04가 있고, 공은 빔 위에 있으며, 센서 면에서 공까지 거리가 y이다. 빔은 가운데 회전축으로 돌고 각도는 α이다. 오른쪽 아래 서보의 혼(길이 d = 0.052 m)이 θ만큼 돌면 링크가 빔 끝을 움직인다. 빔 길이 L = 0.34 m, 작은 각도에서 Lα ≈ dθ.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="719" height="429" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<g transform="rotate(5 360 200)"><rect x="110" y="196" width="500" height="9" rx="2" class="solid"/><rect x="110" y="196" width="500" height="9" rx="2" class="box"/><rect x="112" y="160" width="34" height="36" rx="3" class="box"/><circle cx="122" cy="172" r="6" class="box"/><circle cx="136" cy="172" r="6" class="box"/><circle cx="330" cy="177" r="18" class="box"/><circle cx="330" cy="177" r="18" class="solid"/><line x1="152" y1="132" x2="324" y2="132" class="ln c-blue "/><polygon points="330,132 321.7,135.5 321.7,128.5" class="f-blue"/><polygon points="146,132 154.3,128.5 154.3,135.5" class="f-blue"/><text x="238" y="124" class="b s" text-anchor="middle">y (센서 면 → 공)</text><line x1="146" y1="140" x2="146" y2="160" class="ln c-blue thin"/><line x1="330" y1="140" x2="330" y2="158" class="ln c-blue thin"/><line x1="352" y1="165" x2="394" y2="165" class="ln c-org "/><polygon points="400,165 391.7,168.5 391.7,161.5" class="f-org"/><text x="404" y="160" class="s" text-anchor="start">공이 굴러감</text><line x1="116" y1="225" x2="604" y2="225" class="ln c-m thin"/><polygon points="610,225 601.7,228.5 601.7,221.5" class="f-m"/><polygon points="110,225 118.3,221.5 118.3,228.5" class="f-m"/><text x="250" y="241" class="s" text-anchor="middle">빔 L = 0.34 m</text></g><polygon points="360,206 342,260 378,260" class="box"/><circle cx="360" cy="200" r="4" class="f-k"/><text x="360" y="278" class="s" text-anchor="middle">회전축</text><line x1="250" y1="200" x2="640" y2="200" class="ln c-m thin dash"/><path d="M 450 200 A 90 90 0 0 1 449.7 207.8" class="ln c-red "/><text x="458" y="214" class="b it" text-anchor="start">α</text><rect x="560" y="300" width="80" height="56" rx="4" class="box"/><text x="600" y="372" class="s" text-anchor="middle">서보 (HS-5645MG / SG90)</text><text x="600" y="388" class="s" text-anchor="middle">포텐쇼미터 → A0</text><line x1="600" y1="320" x2="638.1" y2="302.3" class="ln c-k thick"/><circle cx="600" cy="320" r="4" class="f-k"/><line x1="638.1" y1="302.3" x2="598.7" y2="225.9" class="ln c-k "/><text x="626.4" y="264.1" class="s" text-anchor="start">링크</text><line x1="600" y1="320" x2="670" y2="320" class="ln c-m thin dash"/><path d="M 630 320 A 30 30 0 0 0 627.2 307.3" class="ln c-red "/><text x="634" y="314" class="b it" text-anchor="start">θ</text><text x="644.1" y="296.3" class="s" text-anchor="start">d = 0.052 m</text><text x="118" y="120" class="b s" text-anchor="start">HC-SR04</text><text x="40" y="40" class="b" text-anchor="start">작은 각도에서  L·α ≈ d·θ  [슬라이드 39]</text><text x="40" y="62" class="s" text-anchor="start">θ &gt; 0: 공이 센서에서 멀어지는 방향(y 증가) — dir 설정으로 맞춘다</text><text x="700" y="420" class="xs f-m" text-anchor="end">각도는 보기 쉽게 과장함</text>
</svg>
