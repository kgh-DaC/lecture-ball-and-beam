<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d">
<title id="t">튄 값과 이상값 제거</title>
<desc id="d">공을 182 mm에 세워 둔 합성 측정 100개. 약 15%가 304 mm로 튄다. despike를 끈 α = 0.2 재귀 필터 출력은 튈 때마다 끌려 올라가 평균적으로 약 18 mm(= 0.15 × 122 mm) 위에 머문다. 게이트(직전 값과 60 mm 넘게 다르면 버림)를 켠 필터 출력은 182 mm 근처에 평평하게 머문다.</desc>
