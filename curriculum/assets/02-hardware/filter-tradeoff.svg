<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d">
<title id="t">거리 필터의 잡음-지연 상충</title>
<desc id="d">공이 1초에 150 mm에서 200 mm로 옮겨졌을 때의 합성 신호. 잡음이 섞인 원측정, α = 0.2 재귀 필터 출력, α = 0.1 재귀 필터 출력을 겹쳐 그렸다. 필터 출력이 변화의 63.2%에 닿는 시간은 α = 0.2에서 약 0.24초, α = 0.1에서 약 0.54초이다. α가 작을수록 매끄럽지만 늦게 따라간다.</desc>
