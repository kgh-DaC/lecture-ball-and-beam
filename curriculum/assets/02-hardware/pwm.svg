<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" width="700" height="315" role="img" aria-labelledby="t d">
<title id="t">서보 PWM 펄스폭과 각도</title>
<desc id="d">20 ms마다 오는 펄스의 폭으로 서보 각도를 정한다. 544 µs는 0°, 1472 µs는 90°(빔 수평, 명령각 0°), 2400 µs는 180°에 해당한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="699" height="314" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="64" class="s b" text-anchor="start">0° (544 µs)</text><path d="M200 80L220 80L220 45L226 45L226 80L440 80L440 80L440 45L446 45L446 80L660 80" class="ln c-m thick"/><text x="232" y="58" class="xs" text-anchor="start">544 µs</text><text x="20" y="134" class="s b" text-anchor="start">90° = 수평 cmd 0° (1472 µs)</text><path d="M200 150L220 150L220 115L236.2 115L236.2 150L440 150L440 150L440 115L456.2 115L456.2 150L660 150" class="ln c-blue thick"/><text x="242.2" y="128" class="xs" text-anchor="start">1472 µs</text><text x="20" y="204" class="s b" text-anchor="start">180° (2400 µs)</text><path d="M200 220L220 220L220 185L246.4 185L246.4 220L440 220L440 220L440 185L466.4 185L466.4 220L660 220" class="ln c-org thick"/><text x="252.4" y="198" class="xs" text-anchor="start">2400 µs</text><line x1="226" y1="255" x2="434" y2="255" class="ln c-m thin"/><polygon points="440,255 431.7,258.5 431.7,251.5" class="f-m"/><polygon points="220,255 228.3,251.5 228.3,258.5" class="f-m"/><text x="330" y="272" class="s" text-anchor="middle">주기 20 ms</text><text x="20" y="300" class="s b" text-anchor="start">us = 544 + (deg<tspan dy="0.35em" font-size="72%">servo</tspan><tspan dy="-0.35em">/180)·(2400 − 544),   deg</tspan><tspan dy="0.35em" font-size="72%">servo</tspan><tspan dy="-0.35em"> = 90 + trim + dir·cmd</tspan></text><text x="680" y="300" class="xs f-m" text-anchor="end">가로축은 실제 시간 비율</text>
</svg>
