<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" role="img" aria-labelledby="t d">
<title id="t">아두이노 Nano와 확장 실드 배선도</title>
<desc id="d">Arduino Nano V3.0 호환 보드를 Nano I/O 확장 실드(가정: 핀마다 S-V-G 3핀 헤더)에 꽂고 USB로 PC에 연결해 전원과 통신을 받는다. 실드 DC 잭은 비워 둔다. HC-SR04는 D6 헤더의 S(Trig), V(VCC 5 V), G(GND)와 D7 헤더의 S(Echo)에 잇는다. 서보 HS-5645MG는 신호선(주황/노랑)만 D9 헤더의 S에 꽂고, 빨강 V+는 외부 5.0 V 전원 +에, 갈색 GND는 외부 전원 −에 잇는다. D9 헤더의 V는 비워 둔다. 외부 전원 −와 실드 G(Nano GND)를 공통 GND로 잇는다. 개조한 포텐쇼미터 와이퍼는 A0 헤더의 S로 간다. 9 V 사각 건전지로 서보를 구동하지 않는다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="899" height="604" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="40" y="70" width="300" height="400" rx="10" class="box"/><text x="190" y="492" class="b" text-anchor="middle">Nano I/O 확장 실드 [가정]</text><rect x="70" y="110" width="140" height="290" rx="6" class="box"/><text x="140" y="200" class="b" text-anchor="middle">Arduino Nano</text><text x="140" y="222" class="s" text-anchor="middle">V3.0 호환</text><text x="140" y="242" class="s" text-anchor="middle">CH340 USB</text><text x="140" y="262" class="s" text-anchor="middle">ATmega328P</text><text x="140" y="300" class="xs f-m" text-anchor="middle">(Uno도 핀 이름이</text><text x="140" y="316" class="xs f-m" text-anchor="middle">같아 같은 배선)</text><rect x="115" y="98" width="50" height="18" rx="2" class="solid"/><line x1="140" y1="98" x2="140" y2="46" class="ln c-m thick"/><text x="150" y="40" class="s b" text-anchor="start">USB 케이블 ← PC: Nano 전원 + 통신 (CH340 드라이버)</text><rect x="55" y="425" width="44" height="28" rx="3" class="solid"/><text x="77" y="444" class="xs b" text-anchor="middle">DC</text><line x1="68" y1="430" x2="86" y2="448" class="ln c-red thick"/><line x1="68" y1="448" x2="86" y2="430" class="ln c-red thick"/><text x="108" y="438" class="xs b" text-anchor="start">DC 잭: 꽂지 않음</text><text x="108" y="452" class="xs" text-anchor="start">(USB 전원 사용)</text><rect x="296" y="116" width="18" height="62" rx="3" class="box"/><text x="252" y="152" class="b" text-anchor="middle">D6</text><circle cx="305" cy="125" r="4.5" class="f-k"/><text x="289" y="129" class="xs b" text-anchor="end">S</text><circle cx="305" cy="147" r="4.5" class="f-k"/><text x="289" y="151" class="xs b" text-anchor="end">V</text><circle cx="305" cy="169" r="4.5" class="f-k"/><text x="289" y="173" class="xs b" text-anchor="end">G</text><rect x="296" y="201" width="18" height="62" rx="3" class="box"/><text x="252" y="237" class="b" text-anchor="middle">D7</text><circle cx="305" cy="210" r="4.5" class="f-k"/><text x="289" y="214" class="xs b" text-anchor="end">S</text><circle cx="305" cy="232" r="4.5" class="f-k"/><text x="289" y="236" class="xs b" text-anchor="end">V</text><circle cx="305" cy="254" r="4.5" class="f-k"/><text x="289" y="258" class="xs b" text-anchor="end">G</text><rect x="296" y="291" width="18" height="62" rx="3" class="box"/><text x="252" y="327" class="b" text-anchor="middle">D9</text><circle cx="305" cy="300" r="4.5" class="f-k"/><text x="289" y="304" class="xs b" text-anchor="end">S</text><circle cx="305" cy="322" r="4.5" class="f-k"/><text x="289" y="326" class="xs b" text-anchor="end">V</text><circle cx="305" cy="344" r="4.5" class="f-k"/><text x="289" y="348" class="xs b" text-anchor="end">G</text><rect x="296" y="381" width="18" height="62" rx="3" class="box"/><text x="252" y="417" class="b" text-anchor="middle">A0</text><circle cx="305" cy="390" r="4.5" class="f-k"/><text x="289" y="394" class="xs b" text-anchor="end">S</text><circle cx="305" cy="412" r="4.5" class="f-k"/><text x="289" y="416" class="xs b" text-anchor="end">V</text><circle cx="305" cy="434" r="4.5" class="f-k"/><text x="289" y="438" class="xs b" text-anchor="end">G</text><rect x="520" y="100" width="170" height="125" rx="8" class="box"/><text x="605" y="90" class="b" text-anchor="middle">HC-SR04 초음파 센서</text><circle cx="520" cy="125" r="4.5" class="f-k"/><text x="532" y="129" class="s b" text-anchor="start">Trig</text><circle cx="520" cy="147" r="4.5" class="f-k"/><text x="532" y="151" class="s b" text-anchor="start">VCC</text><circle cx="520" cy="169" r="4.5" class="f-k"/><text x="532" y="173" class="s b" text-anchor="start">GND</text><circle cx="520" cy="210" r="4.5" class="f-k"/><text x="532" y="214" class="s b" text-anchor="start">Echo</text><line x1="310" y1="125" x2="515" y2="125" class="ln c-blue "/><text x="412" y="120" class="xs" text-anchor="middle">Trig ← D6 S</text><line x1="310" y1="147" x2="515" y2="147" class="ln c-red "/><text x="412" y="142" class="xs" text-anchor="middle">VCC ← D6 V (실드 5 V)</text><line x1="310" y1="169" x2="515" y2="169" class="ln c-k thick"/><text x="412" y="164" class="xs" text-anchor="middle">GND ← D6 G</text><line x1="310" y1="210" x2="515" y2="210" class="ln c-grn dash"/><text x="412" y="205" class="xs" text-anchor="middle">Echo → D7 S</text><rect x="520" y="280" width="170" height="150" rx="8" class="box"/><text x="605" y="272" class="b" text-anchor="middle">서보 HS-5645MG (개조)</text><circle cx="520" cy="300" r="4.5" class="f-k"/><text x="532" y="304" class="xs b" text-anchor="start">신호 (주황/노랑)</text><circle cx="520" cy="390" r="4.5" class="f-k"/><text x="532" y="394" class="xs b" text-anchor="start">와이퍼 (개조선)</text><circle cx="690" cy="320" r="4.5" class="f-k"/><text x="678" y="324" class="xs b" text-anchor="end">빨강 V+</text><circle cx="690" cy="350" r="4.5" class="f-k"/><text x="678" y="354" class="xs b" text-anchor="end">갈색 GND</text><line x1="310" y1="300" x2="515" y2="300" class="ln c-org "/><text x="412" y="295" class="xs" text-anchor="middle">서보 신호 ← D9 S</text><line x1="299" y1="316" x2="311" y2="328" class="ln c-red thick"/><line x1="299" y1="328" x2="311" y2="316" class="ln c-red thick"/><text x="318" y="335" class="xs f-red b" text-anchor="start">D9 V: 비워 둠</text><text x="318" y="349" class="xs f-red" text-anchor="start">(빨강선 꽂지 않음)</text><line x1="310" y1="390" x2="515" y2="390" class="ln c-pur dash"/><text x="412" y="385" class="xs" text-anchor="middle">와이퍼 → A0 S (5 V 이하)</text><rect x="760" y="290" width="125" height="110" rx="6" class="box"/><text x="830" y="310" class="b s" text-anchor="middle">외부 5.0 V</text><text x="830" y="328" class="xs" text-anchor="middle">서보 전용 전원</text><text x="830" y="346" class="xs" text-anchor="middle">2 A 이상 어댑터 /</text><text x="830" y="362" class="xs" text-anchor="middle">보조 배터리 팩 /</text><text x="830" y="378" class="xs" text-anchor="middle">5 V 강압 모듈</text><circle cx="760" cy="320" r="4.5" class="f-k"/><text x="756" y="314" class="b" text-anchor="end">+</text><circle cx="760" cy="350" r="4.5" class="f-k"/><text x="756" y="366" class="b" text-anchor="end">−</text><line x1="695" y1="320" x2="755" y2="320" class="ln c-red "/><line x1="695" y1="350" x2="755" y2="350" class="ln c-k thick"/><text x="822" y="266" class="xs b f-red" text-anchor="middle">연결 전 멀티미터로</text><text x="822" y="281" class="xs b f-red" text-anchor="middle">5.0 V 이하 확인</text><circle cx="822" cy="400" r="4.5" class="f-k"/><path d="M822 400L822 440L822 470L360 470L360 434L310 434" class="ln c-k thick"/><text x="590" y="464" class="xs b" text-anchor="middle">공통 GND: 외부 전원 − ↔ 실드 G (= Nano GND, 어느 G 핀이든 같음)</text><rect x="752" y="110" width="46" height="66" rx="4" class="box"/><rect x="760" y="102" width="10" height="8" rx="1" class="solid"/><rect x="780" y="102" width="10" height="8" rx="1" class="solid"/><text x="775" y="150" class="b" text-anchor="middle">9V</text><circle cx="775" cy="142" r="44" class="ln c-red thick"/><line x1="744" y1="111" x2="806" y2="173" class="ln c-red thick"/><text x="775" y="206" class="s b f-red" text-anchor="middle">9 V 사각 건전지로</text><text x="775" y="222" class="s b f-red" text-anchor="middle">서보 구동 금지</text><text x="775" y="238" class="xs" text-anchor="middle">(전류 부족·전압 처짐)</text><text x="40" y="525" class="xs" text-anchor="start">[가정] 일반 Nano I/O 확장 실드(핀마다 S-V-G 3핀 헤더). 쓰는 실드 모델은 확인 필요 [미검증]. 서보 전원 단자·점퍼가 있으면 그 설명서를 따른다.</text><text x="40" y="545" class="xs b" text-anchor="start">서보 전원 +5 V를 Nano 5V 핀이나 실드 V 레일에 잇지 않는다(USB 전원과 충돌). 외부 전원은 GND만 Nano와 공통으로 잇는다.</text><text x="40" y="565" class="xs" text-anchor="start">주의: A0에 연결하기 전에 와이퍼 전압이 5 V 이하인지 멀티미터로 확인한다.</text><text x="40" y="585" class="xs f-m" text-anchor="start">선 구분: 굵은 실선 = GND, 실선 = 전원·출력 신호, 점선 = 입력(측정) 신호. 빨간 × = 연결하지 않음</text>
</svg>
