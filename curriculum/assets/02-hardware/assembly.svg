<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t d">
<title id="t">서보 90° 고정과 기구부 조립</title>
<desc id="d">왼쪽: 조립 전. 링크와 빔을 떼고 혼만 단 서보를 서보각 0°, 90°, 180°로 돌리며 A0 값을 잰다(기준값 60, 330, 598, 교수자 장치 실측 10회 평균). raw는 서보각과 함께 커진다. 벤치 모드는 이 상태에서만 쓴다. 오른쪽: 서보를 90°로 고정하고 전원을 켠 채, 혼을 수평 방향으로 출력축 스플라인에 곧게 끼운 뒤 링크로 빔 끝과 잇는다. 빔은 수평이 되고 남는 작은 기울기는 수평 찾기(trim)로 맞춘다. 전원이 켜진 혼을 손으로 억지로 돌리지 않는다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="399" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="24" y="34" class="b l" text-anchor="start">조립 전: 혼만 단 서보 (② 매핑 시험)</text><text x="24" y="54" class="s" text-anchor="start">링크·빔은 떼어 낸다 → 혼이 0~180° 돌아도 닿는 것이 없다</text><rect x="120" y="175" width="140" height="120" rx="8" class="box"/><text x="126" y="193" class="b s" text-anchor="start">서보(개조)</text><rect x="98" y="215" width="22" height="14" rx="2" class="solid"/><rect x="260" y="215" width="22" height="14" rx="2" class="solid"/><line x1="190" y1="205" x2="268" y2="205" class="ln c-blue thick"/><circle cx="268" cy="205" r="6" class="f-blue"/><line x1="190" y1="205" x2="190" y2="127" class="ln c-m dash"/><circle cx="190" cy="127" r="6" class="f-m"/><line x1="190" y1="205" x2="190" y2="283" class="ln c-m dash"/><circle cx="190" cy="283" r="6" class="f-m"/><circle cx="190" cy="205" r="10" class="box"/><circle cx="190" cy="205" r="3" class="f-k"/><text x="278" y="210" class="s b f-blue" text-anchor="start">서보각 90°</text><text x="278" y="227" class="s f-blue" text-anchor="start">A0 ≈ 330</text><text x="204" y="119" class="s" text-anchor="start">서보각 180° → A0 ≈ 598</text><text x="204" y="315" class="s" text-anchor="start">서보각 0° → A0 ≈ 60</text><text x="24" y="352" class="xs" text-anchor="start">기준값 60 / 330 / 598: 교수자 장치 실측(각 10회 평균) [실측]</text><text x="24" y="368" class="xs f-m" text-anchor="start">0°·180° 혼 방향은 개념도(서보마다 다름). raw는 서보각과 함께 커진다</text><text x="24" y="384" class="xs b f-red" text-anchor="start">벤치 모드(펌웨어 1.2.0)는 이 상태에서만 쓴다</text><line x1="400" y1="24" x2="400" y2="380" class="ln c-m thin dash"/><line x1="372" y1="120" x2="422" y2="120" class="ln c-org thick"/><polygon points="428,120 419.7,123.5 419.7,116.5" class="f-org"/><text x="400" y="104" class="b" text-anchor="middle">③</text><text x="424" y="34" class="b l" text-anchor="start">③ 서보 90° 고정 → 조립</text><text x="424" y="54" class="s" text-anchor="start">서보 전원을 켠 채(90°를 붙잡고 있음) 혼을 수평 방향으로 끼운다</text><line x1="440" y1="130" x2="700" y2="130" class="ln c-k thick"/><path d="M560 134L544 170L576 170L560 134" class="ln c-k "/><line x1="530" y1="170" x2="590" y2="170" class="ln c-k thick"/><rect x="436" y="104" width="26" height="22" rx="3" class="solid"/><text x="449" y="98" class="xs" text-anchor="middle">센서</text><line x1="480" y1="112" x2="660" y2="112" class="ln c-m thin dot"/><text x="560" y="106" class="xs f-m" text-anchor="start">빔 수평 (남는 기울기는 ⑤ trim)</text><rect x="530" y="242" width="120" height="96" rx="8" class="box"/><text x="590" y="324" class="b" text-anchor="middle">서보 90°</text><line x1="590" y1="268" x2="660" y2="268" class="ln c-blue thick"/><circle cx="660" cy="268" r="6" class="f-blue"/><circle cx="590" cy="268" r="10" class="box"/><circle cx="590" cy="268" r="3" class="f-k"/><line x1="660" y1="268" x2="660" y2="130" class="ln c-org thick"/><circle cx="660" cy="130" r="5" class="f-org"/><text x="668" y="199" class="s b f-org" text-anchor="start">링크</text><text x="668" y="286" class="xs b f-blue" text-anchor="start">혼: 수평 방향</text><line x1="578" y1="210" x2="586.7" y2="248.1" class="ln c-blue "/><polygon points="588,254 582.7,246.7 589.6,245.1" class="f-blue"/><text x="574" y="206" class="xs" text-anchor="end">스플라인에 곧게 끼움</text><text x="424" y="352" class="xs" text-anchor="start">혼 톱니 한 칸이 안 맞으면 가장 수평에 가까운 칸을 고른다.</text><text x="424" y="368" class="xs b f-red" text-anchor="start">전원이 켜진 혼을 손으로 억지로 돌리지 않는다(기어 손상·리셋).</text><text x="424" y="384" class="xs" text-anchor="start">조립 중 전원을 껐거나 혼이 밀렸으면 ③ 버튼으로 다시 90°.</text><text x="766" y="92" class="xs f-m" text-anchor="end">개념도</text>
</svg>
