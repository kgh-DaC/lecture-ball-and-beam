<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t d">
<title id="t">학습 곡선으로 과적합 진단</title>
<desc id="d">가로축은 에포크, 세로축은 손실. 학습 손실(파란 실선)은 계속 내려가지만 검증 손실(주황 점선)은 함께 내려가다가 어느 에포크부터 다시 올라간다. 검증 손실이 가장 낮은 지점이 조기 종료 시점이고, 그 뒤가 과적합 구간이다.</desc>
