<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" width="800" height="402" role="img" aria-labelledby="t d">
<title id="t">학습 곡선으로 과적합 진단</title>
<desc id="d">번들 학습 기록 두 개의 학습 손실(파랑)과 검증 손실(주황 점선), 로그 눈금. 왼쪽 기본 조건(3000개, 잡음 0, 은닉 32·32)은 두 곡선이 처음 50 에포크쯤 크게 내려가고 평평해지며, 검증 손실이 학습 손실보다 낮다. 오른쪽 과적합 시연(150개, 잡음 3 mm, 은닉 64·64)은 학습 손실이 0.72에서 0.064로 계속 줄지만 검증 손실은 8 에포크에 최저(0.65)를 찍고 끝에 약 2배(1.35)로 올라간다.</desc>
