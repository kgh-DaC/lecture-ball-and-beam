<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 445" width="720" height="445" role="img" aria-labelledby="t d">
<title id="t">학습률에 따른 경사하강법</title>
<desc id="d">두 파라미터 평면 위 손실 등고선(타원). 같은 출발점에서 학습률이 작으면 조금씩만 내려가고, 적당하면 바닥에 도착하며, 가장 가파르게 휜 방향의 휘어짐 c와 학습률의 곱이 2를 넘으면 골짜기 양쪽 벽을 넘나들며 점점 멀리 튀어 발산한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="719" height="444" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<ellipse cx="380" cy="195" rx="58.4" ry="15.8" class="grid" fill="none"/><ellipse cx="380" cy="195" rx="116.8" ry="31.5" class="grid" fill="none"/><ellipse cx="380" cy="195" rx="178.5" ry="48.1" class="grid" fill="none"/><ellipse cx="380" cy="195" rx="243.2" ry="65.6" class="grid" fill="none"/><ellipse cx="380" cy="195" rx="309.1" ry="83.4" class="grid" fill="none"/><ellipse cx="380" cy="195" rx="375.6" ry="101.3" class="grid" fill="none"/><line x1="60" y1="195" x2="700" y2="195" class="ln c-m thin dot"/><line x1="380" y1="350" x2="380" y2="40" class="ln c-m thin dot"/><text x="694.7" y="189" class="s" text-anchor="end">w<tspan dy="0.35em" font-size="72%">1</tspan></text><text x="386" y="47" class="s" text-anchor="start">w<tspan dy="0.35em" font-size="72%">2</tspan><tspan dy="-0.35em"> (가파르게 휜 방향)</tspan></text><path d="M102.7 131.6L111 143L119.1 152.4L126.9 160L134.5 166.3L141.8 171.5L149 175.7L155.9 179.2L162.6 182L169.2 184.4L175.5 186.3L181.6 187.9L187.6 189.1" class="ln c-m thick"/><circle cx="102.7" cy="131.6" r="3.5" class="f-m"/><circle cx="111" cy="143" r="3.5" class="f-m"/><circle cx="119.1" cy="152.4" r="3.5" class="f-m"/><circle cx="126.9" cy="160" r="3.5" class="f-m"/><circle cx="134.5" cy="166.3" r="3.5" class="f-m"/><circle cx="141.8" cy="171.5" r="3.5" class="f-m"/><circle cx="149" cy="175.7" r="3.5" class="f-m"/><circle cx="155.9" cy="179.2" r="3.5" class="f-m"/><circle cx="162.6" cy="182" r="3.5" class="f-m"/><circle cx="169.2" cy="184.4" r="3.5" class="f-m"/><circle cx="175.5" cy="186.3" r="3.5" class="f-m"/><circle cx="181.6" cy="187.9" r="3.5" class="f-m"/><circle cx="187.6" cy="189.1" r="3.5" class="f-m"/><path d="M102.7 131.6L172 226.7L224 179.1L263 202.9L292.3 191L314.2 197L330.6 194L343 195.5L352.2 194.8L359.2 195.1L364.4 194.9L368.3 195L371.2 195" class="ln c-grn thick"/><circle cx="102.7" cy="131.6" r="3.5" class="f-grn"/><circle cx="172" cy="226.7" r="3.5" class="f-grn"/><circle cx="224" cy="179.1" r="3.5" class="f-grn"/><circle cx="263" cy="202.9" r="3.5" class="f-grn"/><circle cx="292.3" cy="191" r="3.5" class="f-grn"/><circle cx="314.2" cy="197" r="3.5" class="f-grn"/><circle cx="330.6" cy="194" r="3.5" class="f-grn"/><circle cx="343" cy="195.5" r="3.5" class="f-grn"/><circle cx="352.2" cy="194.8" r="3.5" class="f-grn"/><circle cx="359.2" cy="195.1" r="3.5" class="f-grn"/><circle cx="364.4" cy="194.9" r="3.5" class="f-grn"/><circle cx="368.3" cy="195" r="3.5" class="f-grn"/><circle cx="371.2" cy="195" r="3.5" class="f-grn"/><path d="M102.7 131.6L199.7 264.8L262.8 118.3L303.8 279.4L330.5 102.2L347.8 297.1L359.1 82.7L366.4 318.6L371.2 59.1L374.3 344.5" class="ln c-red thick"/><circle cx="102.7" cy="131.6" r="3.5" class="f-red"/><circle cx="199.7" cy="264.8" r="3.5" class="f-red"/><circle cx="262.8" cy="118.3" r="3.5" class="f-red"/><circle cx="303.8" cy="279.4" r="3.5" class="f-red"/><circle cx="330.5" cy="102.2" r="3.5" class="f-red"/><circle cx="347.8" cy="297.1" r="3.5" class="f-red"/><circle cx="359.1" cy="82.7" r="3.5" class="f-red"/><circle cx="366.4" cy="318.6" r="3.5" class="f-red"/><circle cx="371.2" cy="59.1" r="3.5" class="f-red"/><circle cx="374.3" cy="344.5" r="3.5" class="f-red"/><circle cx="102.7" cy="131.6" r="5" class="f-k"/><text x="94.7" y="121.6" class="s b" text-anchor="end">출발점</text><circle cx="380" cy="195" r="5" class="f-grn"/><text x="388" y="213" class="s b" text-anchor="start">손실 최소</text><line x1="70" y1="371" x2="100" y2="371" class="ln c-m thick"/><text x="108" y="375" class="s" text-anchor="start">η 작음 (ηc = 0.18): 조금씩 내려감</text><line x1="70" y1="391" x2="100" y2="391" class="ln c-grn thick"/><text x="108" y="395" class="s" text-anchor="start">η 적당 (ηc = 1.5): 바닥 도착</text><line x1="70" y1="411" x2="100" y2="411" class="ln c-red thick"/><text x="108" y="415" class="s" text-anchor="start">η 큼 (ηc = 2.1 &gt; 2): w<tspan dy="0.35em" font-size="72%">2</tspan><tspan dy="-0.35em"> 방향으로 양쪽 벽을 넘나들며 발산</tspan></text><text x="700" y="437" class="xs f-m" text-anchor="end">손실 L = ½(w<tspan dy="0.35em" font-size="72%">1</tspan><tspan dy="-0.35em">² + 6w</tspan><tspan dy="0.35em" font-size="72%">2</tspan><tspan dy="-0.35em">²)에서 같은 출발점으로 경사하강법을 실제로 반복한 궤적. 등고선은 손실이 같은 점</tspan></text>
</svg>
