<title id="t">볼앤빔 식별용 다층 퍼셉트론(5-32-32-3)</title>
<desc id="d">입력 다섯 개(공 위치 y, 공 속도, 서보 각 θ, 이번 명령 u_k, 직전 명령 u_k−1)가 은닉층 두 개(각 32 뉴런, 일부만 그림)를 거쳐 출력 세 개(60 ms 동안의 위치·속도·각도 변화)로 이어진다. 층 사이 가중치·편향 개수는 192, 1056, 99로 합계 1347개다.</desc>
