<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 328" width="780" height="328" role="img" aria-labelledby="t d">
<title id="t">에이전트-환경 루프</title>
<desc id="d">위에 에이전트(정책), 아래에 환경(서보, 빔과 공, 초음파 센서) 상자가 있다. 에이전트가 행동(서보 명령)을 환경에 보내면 환경은 다음 상태(오차, 속도)와 보상을 돌려준다. 오른쪽 표는 01장 피드백 루프 용어와의 대응이다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="327" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="200" y="40" width="240" height="70" rx="6" class="box"/><text x="320" y="72" class="b" text-anchor="middle">에이전트</text><text x="320" y="90" class="s" text-anchor="middle">정책 π: 상태 → 행동</text><rect x="200" y="210" width="240" height="70" rx="6" class="box"/><text x="320" y="242" class="b" text-anchor="middle">환경</text><text x="320" y="260" class="s" text-anchor="middle">서보 + 빔·공 + 초음파 (가상)</text><path d="M440 75L520 75L520 245L452 245" class="ln c-org "/><polygon points="446,245 454.3,241.5 454.3,248.5" class="f-org"/><text x="530" y="150" class="b" text-anchor="start">행동 a<tspan dy="0.35em" font-size="72%">k</tspan></text><text x="530" y="168" class="s" text-anchor="start">서보 명령 u</text><path d="M200 235L150 235L150 85L188 85" class="ln c-blue "/><polygon points="194,85 185.7,88.5 185.7,81.5" class="f-blue"/><text x="120" y="140" class="b f-blue" text-anchor="end">상태 s<tspan dy="0.35em" font-size="72%">k+1</tspan></text><text x="120" y="158" class="s" text-anchor="end">[e, v] (+ u<tspan dy="0.35em" font-size="72%">prev</tspan><tspan dy="-0.35em">)</tspan></text><path d="M200 260L130 260L130 60L188 60" class="ln c-grn dash"/><polygon points="194,60 185.7,63.5 185.7,56.5" class="f-grn"/><text x="120" y="210" class="b f-grn" text-anchor="end">보상 r<tspan dy="0.35em" font-size="72%">k</tspan></text><text x="600" y="52" class="s b" text-anchor="start">01장 피드백 루프와 대응</text><text x="600" y="78" class="s b" text-anchor="start">에이전트</text><text x="670" y="78" class="s f-m" text-anchor="start">↔</text><text x="692" y="78" class="s" text-anchor="start">제어기</text><text x="600" y="104" class="s b" text-anchor="start">환경</text><text x="670" y="104" class="s f-m" text-anchor="start">↔</text><text x="692" y="104" class="s" text-anchor="start">플랜트 + 센서</text><text x="600" y="130" class="s b" text-anchor="start">상태</text><text x="670" y="130" class="s f-m" text-anchor="start">↔</text><text x="692" y="130" class="s" text-anchor="start">피드백 신호</text><text x="600" y="156" class="s b" text-anchor="start">행동</text><text x="670" y="156" class="s f-m" text-anchor="start">↔</text><text x="692" y="156" class="s" text-anchor="start">제어 입력</text><text x="600" y="182" class="s b" text-anchor="start">보상</text><text x="670" y="182" class="s f-m" text-anchor="start">↔</text><text x="692" y="182" class="s" text-anchor="start">−(비용)</text><text x="600" y="208" class="s b" text-anchor="start">정책</text><text x="670" y="208" class="s f-m" text-anchor="start">↔</text><text x="692" y="208" class="s" text-anchor="start">제어 법칙</text><text x="600" y="250" class="s b" text-anchor="start">다른 점은 하나:</text><text x="600" y="268" class="s" text-anchor="start">제어 법칙을 보상과</text><text x="600" y="286" class="s" text-anchor="start">시행착오로 찾는다</text><text x="760" y="318" class="xs f-m" text-anchor="end">개념도: 모양을 설명하기 위한 그림이며 측정·학습 결과가 아니다</text>
</svg>
