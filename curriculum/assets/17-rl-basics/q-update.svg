<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 272" width="860" height="272" role="img" aria-labelledby="t d">
<title id="t">Q-표 한 칸의 갱신</title>
<desc id="d">왼쪽은 행이 상태 칸, 열이 행동인 Q-표이고 지금 상태-행동 칸(값 −2)이 주황으로, 다음 상태 행이 파랑으로 강조되어 있다. 오른쪽 계산: 보상 −1, 감마 0.9, 다음 상태 최댓값 −3, 알파 0.5이면 목표값 −3.7, TD 오차 −1.7, 새 Q 값은 −2.85다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="859" height="271" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="205" y="36" class="b" text-anchor="middle">Q-표 (행: 상태 칸, 열: 행동)</text><text x="89" y="60" class="s b" text-anchor="middle">a1</text><text x="147" y="60" class="s b" text-anchor="middle">a2</text><text x="205" y="60" class="s b" text-anchor="middle">a3</text><text x="263" y="60" class="s b" text-anchor="middle">a4</text><text x="321" y="60" class="s b" text-anchor="middle">a5</text><text x="50" y="90" class="s b" text-anchor="end">s1</text><rect x="60" y="70" width="58" height="30" class="grid"/><text x="89" y="90" class="s" text-anchor="middle">-4.1</text><rect x="118" y="70" width="58" height="30" class="grid"/><text x="147" y="90" class="s" text-anchor="middle">-3.6</text><rect x="176" y="70" width="58" height="30" class="grid"/><text x="205" y="90" class="s" text-anchor="middle">-3.2</text><rect x="234" y="70" width="58" height="30" class="grid"/><text x="263" y="90" class="s" text-anchor="middle">-3.9</text><rect x="292" y="70" width="58" height="30" class="grid"/><text x="321" y="90" class="s" text-anchor="middle">-4.4</text><text x="50" y="120" class="s b" text-anchor="end">s2</text><rect x="60" y="100" width="58" height="30" class="grid"/><text x="89" y="120" class="s" text-anchor="middle">-2.9</text><rect x="118" y="100" width="58" height="30" class="grid"/><text x="147" y="120" class="s" text-anchor="middle">-2.4</text><rect x="176" y="100" width="58" height="30" class="grid"/><text x="205" y="120" class="s" text-anchor="middle">-2.0</text><rect x="234" y="100" width="58" height="30" class="grid"/><text x="263" y="120" class="s" text-anchor="middle">-2.6</text><rect x="292" y="100" width="58" height="30" class="grid"/><text x="321" y="120" class="s" text-anchor="middle">-3.1</text><text x="50" y="150" class="s b" text-anchor="end">s3</text><rect x="60" y="130" width="58" height="30" class="grid"/><text x="89" y="150" class="s" text-anchor="middle">-2.5</text><rect x="118" y="130" width="58" height="30" class="grid"/><text x="147" y="150" class="s" text-anchor="middle">-2.2</text><rect x="176" y="130" width="58" height="30" rx="0" class="f-org" fill-opacity="0.35"/><rect x="176" y="130" width="58" height="30" class="grid"/><text x="205" y="150" class="s" text-anchor="middle">-2.0</text><rect x="234" y="130" width="58" height="30" class="grid"/><text x="263" y="150" class="s" text-anchor="middle">-2.3</text><rect x="292" y="130" width="58" height="30" class="grid"/><text x="321" y="150" class="s" text-anchor="middle">-2.8</text><text x="50" y="180" class="s b" text-anchor="end">s4</text><rect x="60" y="160" width="58" height="30" rx="0" class="f-blue" fill-opacity="0.12"/><rect x="60" y="160" width="58" height="30" class="grid"/><text x="89" y="180" class="s" text-anchor="middle">-3.8</text><rect x="118" y="160" width="58" height="30" rx="0" class="f-blue" fill-opacity="0.12"/><rect x="118" y="160" width="58" height="30" class="grid"/><text x="147" y="180" class="s" text-anchor="middle">-3.0</text><rect x="176" y="160" width="58" height="30" rx="0" class="f-blue" fill-opacity="0.12"/><rect x="176" y="160" width="58" height="30" class="grid"/><text x="205" y="180" class="s" text-anchor="middle">-3.3</text><rect x="234" y="160" width="58" height="30" rx="0" class="f-blue" fill-opacity="0.12"/><rect x="234" y="160" width="58" height="30" class="grid"/><text x="263" y="180" class="s" text-anchor="middle">-3.4</text><rect x="292" y="160" width="58" height="30" rx="0" class="f-blue" fill-opacity="0.12"/><rect x="292" y="160" width="58" height="30" class="grid"/><text x="321" y="180" class="s" text-anchor="middle">-4.0</text><text x="50" y="210" class="s b" text-anchor="end">s5</text><rect x="60" y="190" width="58" height="30" class="grid"/><text x="89" y="210" class="s" text-anchor="middle">-4.6</text><rect x="118" y="190" width="58" height="30" class="grid"/><text x="147" y="210" class="s" text-anchor="middle">-4.2</text><rect x="176" y="190" width="58" height="30" class="grid"/><text x="205" y="210" class="s" text-anchor="middle">-3.9</text><rect x="234" y="190" width="58" height="30" class="grid"/><text x="263" y="210" class="s" text-anchor="middle">-4.1</text><rect x="292" y="190" width="58" height="30" class="grid"/><text x="321" y="210" class="s" text-anchor="middle">-4.8</text><text x="358" y="180" class="s f-blue b" text-anchor="start">← 다음 상태 s′: 최댓값 -3.0</text><text x="358" y="150" class="s f-org b" text-anchor="start">← 지금 (s, a): −2.0</text><text x="560" y="80" class="b" text-anchor="start">한 칸 갱신 (설명용 숫자)</text><text x="560" y="110" class="s" text-anchor="start">받은 보상 r = −1,  γ = 0.9,  α = 0.5</text><text x="560" y="138" class="s" text-anchor="start">목표값 = r + γ · max Q(s′, ·)</text><text x="578" y="160" class="s b" text-anchor="start">= −1 + 0.9 × (−3.0) = −3.7</text><text x="560" y="188" class="s" text-anchor="start">TD 오차 = −3.7 − (−2.0) = −1.7</text><text x="560" y="216" class="s b f-org" text-anchor="start">새 Q = −2.0 + 0.5 × (−1.7) = −2.85</text><text x="560" y="244" class="s f-m" text-anchor="start">"생각보다 나빴다" → 값을 내림</text><text x="840" y="262" class="xs f-m" text-anchor="end">개념도: 숫자는 본문 5.2절 손 계산과 같은 설명용 예</text>
</svg>
