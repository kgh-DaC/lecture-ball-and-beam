<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 410" width="810" height="410" role="img" aria-labelledby="t d">
<title id="t">Q 정책과 PD의 표준 스텝 응답</title>
<desc id="d">번들 샘플 sim-ai-q(Q 정책)와 sim-pid-p1(PD 1.0, 1.5)의 표준 스텝 응답과 서보 명령. PD는 오버슈트 10%로 5.6 s에 정착한다. Q 정책은 150 mm와 212 mm 사이를 오가며 8 s 안에 정착하지 못하고, 명령은 가장 큰 행동 ±8.6° 사이를 오간다. 폴백은 한 번도 일어나지 않았다.</desc>
