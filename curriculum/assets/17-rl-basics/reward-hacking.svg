<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-labelledby="t d">
<title id="t">보상 해킹</title>
<desc id="d">왼쪽에 보상 식의 항(오차, 속도, 명령 크기, 명령 변화, 충돌 벌점)이 있고 그 합을 에이전트가 최대화한다. 오른쪽 위는 우리가 원한 행동(목표에 정지), 오른쪽 아래는 보상 식에 허점이 있을 때 에이전트가 찾는 꼼수(일부러 빔 끝 충돌, 뱅뱅 제어, 끝 멈춤판에 기대기)다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="339" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="20" y="50" width="230" height="210" rx="6" class="box"/><text x="135" y="76" class="b" text-anchor="middle">보상으로 쓴 것</text><text x="36" y="108" class="s" text-anchor="start">−w<tspan dy="0.35em" font-size="72%">e</tspan><tspan dy="-0.35em">(e/0.05)²</tspan></text><text x="236" y="108" class="xs f-m" text-anchor="end">오차</text><text x="36" y="138" class="s" text-anchor="start">−w<tspan dy="0.35em" font-size="72%">v</tspan><tspan dy="-0.35em">(v/0.2)²</tspan></text><text x="236" y="138" class="xs f-m" text-anchor="end">속도</text><text x="36" y="168" class="s" text-anchor="start">−w<tspan dy="0.35em" font-size="72%">u</tspan><tspan dy="-0.35em">(u/u</tspan><tspan dy="0.35em" font-size="72%">lim</tspan><tspan dy="-0.35em">)²</tspan></text><text x="236" y="168" class="xs f-m" text-anchor="end">명령 크기</text><text x="36" y="198" class="s" text-anchor="start">−w<tspan dy="0.35em" font-size="72%">Δu</tspan><tspan dy="-0.35em">(Δu/u</tspan><tspan dy="0.35em" font-size="72%">lim</tspan><tspan dy="-0.35em">)²</tspan></text><text x="236" y="198" class="xs f-m" text-anchor="end">명령 변화</text><text x="36" y="228" class="s" text-anchor="start">−3 (끝에 닿은 스텝마다)</text><text x="236" y="228" class="xs f-m" text-anchor="end">충돌</text><line x1="250" y1="155" x2="294" y2="155" class="ln c-k "/><polygon points="300,155 291.7,158.5 291.7,151.5" class="f-k"/><rect x="300" y="120" width="120" height="70" rx="6" class="box"/><text x="360" y="152" class="b" text-anchor="middle">에이전트</text><text x="360" y="170" class="s" text-anchor="middle">합계를 최대화</text><line x1="420" y1="135" x2="465.3" y2="98.7" class="ln c-grn "/><polygon points="470,95 465.7,102.9 461.3,97.4" class="f-grn"/><line x1="420" y1="175" x2="465.3" y2="211.3" class="ln c-red "/><polygon points="470,215 461.3,212.6 465.7,207.1" class="f-red"/><rect x="470" y="50" width="290" height="80" rx="6" class="box"/><rect x="470" y="50" width="290" height="80" rx="6" class="f-grn" fill-opacity="0.12"/><text x="615" y="76" class="b" text-anchor="middle">우리가 원한 것</text><text x="615" y="100" class="s" text-anchor="middle">공을 목표에 부드럽게 세운다</text><text x="615" y="118" class="xs f-m" text-anchor="middle">(보상 식이 잘 맞을 때)</text><rect x="470" y="160" width="290" height="140" rx="6" class="box"/><rect x="470" y="160" width="290" height="140" rx="6" class="f-red" fill-opacity="0.1"/><text x="615" y="186" class="b" text-anchor="middle">보상 식에 허점이 있으면 찾는 꼼수</text><text x="484" y="214" class="s" text-anchor="start">• 충돌하면 종료 + 작은 벌점 → 일부러 빔 끝 충돌</text><text x="484" y="242" class="s" text-anchor="start">• 명령 비용 없음 → ±최대로 흔드는 뱅뱅 제어</text><text x="484" y="270" class="s" text-anchor="start">• 빔 위에 있으면 +1 → 끝 멈춤판에 기대 버티기</text><text x="760" y="330" class="xs f-m" text-anchor="end">개념도. 이 앱의 기본 보상은 충돌해도 에피소드를 끝내지 않는다(17장 3.2절)</text>
</svg>
