<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 350" width="790" height="350" role="img" aria-labelledby="t d">
<title id="t">미분 킥</title>
<desc id="d">같은 PD 게인에서 미분 위치만 바꾼 시뮬레이션. 왼쪽은 서보 명령: 미분을 오차에 걸면 스텝 뒤 첫 샘플에 명령이 각도 한계 20°까지 튀고, 측정값에 걸면 최대 2.9°로 매끄럽다. 오른쪽은 공 위치: 오차 미분은 오버슈트 62%, 측정값 미분은 3.8%.</desc>
