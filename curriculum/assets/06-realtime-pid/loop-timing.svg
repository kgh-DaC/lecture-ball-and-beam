<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" width="760" height="365" role="img" aria-labelledby="t d">
<title id="t">한 제어 주기의 흐름</title>
<desc id="d">아두이노가 60 ms마다 초음파로 공 위치를 재고 필터한 뒤 D 줄을 보내면, 브라우저가 제어기를 계산해 S 줄로 서보 명령을 돌려보내고, 아두이노가 서보에 적용한다. 측정에서 명령까지 약 5~10 ms가 걸린다. 500 ms 동안 명령이 없으면 빔을 수평으로 돌린다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="364" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="85" class="b" text-anchor="start">아두이노</text><text x="20" y="205" class="b" text-anchor="start">브라우저</text><line x1="110" y1="80" x2="720" y2="80" class="ln c-m thin dot"/><line x1="110" y1="200" x2="720" y2="200" class="ln c-m thin dot"/><rect x="130" y="62" width="82.8" height="36" class="f-blue" fill-opacity="0.25"/><text x="171.4" y="85" class="xs b" text-anchor="middle">측정·필터</text><line x1="212.8" y1="98" x2="225.6" y2="177.1" class="ln c-blue "/><polygon points="226.6,183 221.8,175.4 228.7,174.3" class="f-blue"/><rect x="226.6" y="184" width="23" height="32" class="f-org" fill-opacity="0.35"/><line x1="249.6" y1="183" x2="262.4" y2="103.9" class="ln c-org "/><polygon points="263.4,98 265.5,106.7 258.6,105.6" class="f-org"/><rect x="263.4" y="62" width="10" height="36" class="f-grn" fill-opacity="0.4"/><line x1="130" y1="255" x2="130" y2="262" class="ln c-k "/><text x="130" y="278" class="s" text-anchor="middle">0 ms</text><rect x="406" y="62" width="82.8" height="36" class="f-blue" fill-opacity="0.25"/><text x="447.4" y="85" class="xs b" text-anchor="middle">측정·필터</text><line x1="488.8" y1="98" x2="501.6" y2="177.1" class="ln c-blue "/><polygon points="502.6,183 497.8,175.4 504.7,174.3" class="f-blue"/><rect x="502.6" y="184" width="23" height="32" class="f-org" fill-opacity="0.35"/><line x1="525.6" y1="183" x2="538.4" y2="103.9" class="ln c-org "/><polygon points="539.4,98 541.5,106.7 534.6,105.6" class="f-org"/><rect x="539.4" y="62" width="10" height="36" class="f-grn" fill-opacity="0.4"/><line x1="406" y1="255" x2="406" y2="262" class="ln c-k "/><text x="406" y="278" class="s" text-anchor="middle">60 ms</text><line x1="682" y1="255" x2="682" y2="262" class="ln c-k "/><text x="682" y="278" class="s" text-anchor="middle">120 ms</text><line x1="110" y1="258" x2="714" y2="258" class="ln c-k "/><polygon points="720,258 711.7,261.5 711.7,254.5" class="f-k"/><text x="213.4" y="140" class="s b" text-anchor="end">D 줄</text><text x="213.4" y="156" class="xs" text-anchor="end">(y, y<tspan dy="0.35em" font-size="72%">filt</tspan><tspan dy="-0.35em">, u, pot)</tspan></text><text x="264.8" y="140" class="s b" text-anchor="start">S 줄</text><text x="264.8" y="156" class="xs" text-anchor="start">(명령각, 0.01°)</text><text x="238.1" y="236" class="xs b" text-anchor="middle">제어기 계산</text><text x="286.6" y="70" class="xs" text-anchor="start">← 서보 적용</text><text x="20" y="312" class="s" text-anchor="start">측정 → 계산 → 명령: 약 5~10 ms [가정]. 다음 측정까지 공 위치는 모른다 (60 ms 주기)</text><text x="20" y="332" class="s" text-anchor="start">안전 장치: 펌웨어 각도 제한, 500 ms 동안 S 줄이 없으면 빔을 수평으로, 화면의 비상 정지</text><text x="20" y="352" class="xs f-m" text-anchor="start">그림의 시간 간격은 설명용으로 늘려 그렸다</text>
</svg>
