<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">제어 루프의 구조</title>
<desc id="d">아두이노는 60 ms마다 초음파 센서로 공 위치를 재고 필터한 뒤 D 줄(y, 필터 출력, 직전 명령, 포텐쇼미터)을 시리얼로 보낸다. 브라우저는 D 줄을 받을 때마다 제어기를 계산하고 rad을 0.01° 정수로 바꿔 S 줄로 돌려보낸다. 아두이노는 각도 한계로 자른 뒤 서보에 적용하고, 빔과 공이 움직여 다시 센서로 돌아온다. 안전 장치: 펌웨어 각도 한계, 500 ms 하트비트, 비상 정지.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="329" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="28" class="b" text-anchor="start">제어 루프는 두 장치에 걸쳐 있다</text><rect x="20" y="48" width="330" height="200" rx="10" class="panel"/><text x="34" y="70" class="s b f-m" text-anchor="start">아두이노 (60 ms마다)</text><rect x="420" y="48" width="320" height="200" rx="10" class="panel"/><text x="434" y="70" class="s b f-m" text-anchor="start">브라우저 (웹 앱)</text><rect x="40" y="88" width="130" height="54" rx="6" class="bx-pur"/><text x="105" y="112" class="b" text-anchor="middle">초음파 센서</text><text x="105" y="130" class="s" text-anchor="middle">측정 → 필터</text><rect x="200" y="88" width="130" height="54" rx="6" class="bx-pur"/><text x="265" y="112" class="b" text-anchor="middle">D 줄 보내기</text><text x="265" y="130" class="s" text-anchor="middle">y, y<tspan dy="0.35em" font-size="72%">filt</tspan><tspan dy="-0.35em">, u, pot</tspan></text><rect x="200" y="176" width="130" height="54" rx="6" class="bx-org"/><text x="265" y="200" class="b" text-anchor="middle">S 줄 받기</text><text x="265" y="218" class="s" text-anchor="middle">각도 제한 ±lim</text><rect x="40" y="176" width="130" height="54" rx="6" class="bx-grn"/><text x="105" y="200" class="b" text-anchor="middle">서보 → 빔·공</text><text x="105" y="218" class="s" text-anchor="middle">명령각 적용</text><rect x="500" y="88" width="160" height="54" rx="6" class="bx-blue"/><text x="580" y="112" class="b" text-anchor="middle">제어기 계산</text><text x="580" y="130" class="s" text-anchor="middle">PID: u = f(r − y)</text><rect x="500" y="176" width="160" height="54" rx="6" class="bx-blue"/><text x="580" y="200" class="b" text-anchor="middle">단위 변환</text><text x="580" y="218" class="s" text-anchor="middle">rad → 0.01° 정수</text><line x1="170" y1="115" x2="192" y2="115" class="ln c-pur "/><polygon points="198,115 189.7,118.5 189.7,111.5" class="f-pur"/><line x1="330" y1="115" x2="492" y2="115" class="ln c-pur "/><polygon points="498,115 489.7,118.5 489.7,111.5" class="f-pur"/><text x="414" y="106" class="xs f-m" text-anchor="middle">시리얼 115200</text><line x1="580" y1="142" x2="580" y2="168" class="ln c-blue "/><polygon points="580,174 576.5,165.7 583.5,165.7" class="f-blue"/><line x1="500" y1="203" x2="338" y2="203" class="ln c-org "/><polygon points="332,203 340.3,199.5 340.3,206.5" class="f-org"/><text x="414" y="220" class="xs f-m" text-anchor="middle">S,&lt;cdeg&gt;</text><line x1="200" y1="203" x2="178" y2="203" class="ln c-org "/><polygon points="172,203 180.3,199.5 180.3,206.5" class="f-org"/><path d="M105 176L105 150" class="ln c-grn dash"/><polygon points="105,144 108.5,152.3 101.5,152.3" class="f-grn"/><text x="112" y="164" class="xs f-grn" text-anchor="start">공 위치</text><rect x="20" y="262" width="720" height="52" rx="8" class="bx-red"/><text x="34" y="284" class="s b f-red" text-anchor="start">안전 장치</text><text x="110" y="284" class="xs" text-anchor="start">① 펌웨어 각도 한계(하드 ±30°, 실습은 더 작게)   ② S 줄이 500 ms 없으면 스스로 수평으로</text><text x="110" y="302" class="xs" text-anchor="start">③ 화면의 비상 정지는 언제나 즉시 작동</text>
</svg>
