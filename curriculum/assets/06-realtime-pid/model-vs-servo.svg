<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 326" width="800" height="326" role="img" aria-labelledby="t d">
<title id="t">서보 무시 예측과 가정 서보 포함 응답</title>
<desc id="d">안전 기본값 PD(Kp 1.0, Kd 1.5)의 스텝 응답 시뮬레이션. 서보 무시 모델(파랑, 앱의 점선 예측)은 오버슈트 3.8%, 정착 2.2 s. 가정 서보(시정수 0.06 s, 지연 0.02 s)를 넣은 모델(주황)은 오버슈트 9.6%, 정착 5.2 s로 더 진동한다. 서보 값은 가정이며 07장에서 측정한다.</desc>
