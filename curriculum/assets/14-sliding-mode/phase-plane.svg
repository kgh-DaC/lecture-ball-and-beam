<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d">
<title id="t">위상평면의 실제 궤적</title>
<desc id="d">두 경우의 위상평면 궤적 시뮬레이션. 왼쪽: 기본값(Φ = 0.05)의 50 mm 스텝은 시작점이 이미 경계층 가장자리에 있어 궤적 전체가 띠 안에 있다. 오른쪽: Φ = 0.01로 150 mm 스텝을 주면 궤적이 먼저 면 쪽으로 끌려온(도달) 뒤 면을 따라 원점으로 미끄러진다.</desc>
