<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 390" width="790" height="390" role="img" aria-labelledby="t d">
<title id="t">슬라이딩 면과 위상평면 궤적</title>
<desc id="d">가로축 오차 e, 세로축 그 미분인 위상평면. 기울기 −λ인 초록 직선이 슬라이딩 면 s = de/dt + λe = 0이고, 그 둘레 띠가 경계층 |s| ≤ Φ이다. 두 시작점에서 출발한 궤적이 먼저 면에 도달한 뒤(①), 면을 따라 원점으로 미끄러진다(②).</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="789" height="389" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<clipPath id="pp"><rect x="120" y="30" width="480" height="340"/></clipPath><g clip-path="url(#pp)"><polygon points="120,-60.3 600,407.2 600,460.3 120,-7.2" class="zone"/><line x1="120" y1="-33.7" x2="600" y2="433.8" class="ln c-grn thick"/></g><line x1="120" y1="200" x2="604" y2="200" class="ln c-k "/><polygon points="610,200 601.7,203.5 601.7,196.5" class="f-k"/><line x1="360" y1="370" x2="360" y2="28" class="ln c-k "/><polygon points="360,22 363.5,30.3 356.5,30.3" class="f-k"/><text x="610" y="220" class="b it" text-anchor="end">e</text><text x="368" y="34" class="b it" text-anchor="start">de/dt</text><path d="M 556.4 104.4 L 545.5 168.1 L 523.6 263.8 L 501.8 322.2" class="ln c-blue thick"/><polygon points="501.8,322.2 501.3,311.2 509.4,314.2" class="f-blue"/><path d="M 152.7 295.6 L 169.1 221.3 L 201.8 120.3 L 229.1 77.8" class="ln c-blue thick dash"/><polygon points="229.1,77.8 227.2,88.7 220,84" class="f-blue"/><line x1="490.9" y1="327.5" x2="391.6" y2="230.7" class="ln c-org thick"/><polygon points="387.3,226.6 395.7,229.8 390.8,234.9" class="f-org"/><line x1="234.5" y1="77.8" x2="328.4" y2="169.3" class="ln c-org thick"/><polygon points="332.7,173.4 324.3,170.2 329.2,165.1" class="f-org"/><circle cx="556.4" cy="104.4" r="5" class="f-blue"/><circle cx="152.7" cy="295.6" r="5" class="f-blue"/><text x="561.8" y="94.4" class="s b" text-anchor="middle">① 도달 단계</text><text x="130.9" y="322.2" class="s b" text-anchor="start">② 미끄러짐: e → 0</text><text x="130.9" y="340.2" class="xs" text-anchor="start">(시정수 1/λ, 모델과 무관)</text><text x="130.9" y="45.9" class="b" text-anchor="start">s &lt; 0</text><text x="501.8" y="56.6" class="b" text-anchor="start">s &gt; 0</text><text x="501.8" y="74.6" class="xs" text-anchor="start">u<tspan dy="0.35em" font-size="72%">sw</tspan><tspan dy="-0.35em">가 면 쪽으로 민다</tspan></text><text x="620" y="80" class="s b" text-anchor="start">초록 직선:</text><text x="620" y="98" class="s" text-anchor="start">s = de/dt + λe = 0</text><text x="620" y="116" class="s" text-anchor="start">(기울기 −λ)</text><text x="620" y="150" class="s b" text-anchor="start">초록 띠: 경계층 |s| ≤ Φ</text><text x="620" y="168" class="xs" text-anchor="start">띠 안에서는 sign 대신</text><text x="620" y="184" class="xs" text-anchor="start">선형(sat)으로 바꿔 채터링 방지</text><text x="620" y="340" class="xs f-m" text-anchor="start">개념도 (λ = 1, Φ 과장)</text>
</svg>
