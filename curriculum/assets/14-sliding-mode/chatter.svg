<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d">
<title id="t">sign과 sat의 서보 명령</title>
<desc id="d">가상 장치 잡음 조건에서 같은 SMC의 스위칭 함수만 바꾼 시뮬레이션의 처음 3초 서보 명령. sign(빨강)은 거의 매 샘플 약 ±6.4° 사이를 뒤집혀 총변동 1004°, sat(파랑, Φ = 0.05)은 131°다.</desc>
