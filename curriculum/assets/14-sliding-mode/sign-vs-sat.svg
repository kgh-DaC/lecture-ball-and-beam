<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" role="img" aria-labelledby="t d">
<title id="t">스위칭 함수: sign과 sat 비교</title>
<desc id="d">왼쪽 sign(s)는 s가 0을 지날 때 −1에서 +1로 뒤집혀 샘플링과 지연이 있으면 채터링을 만든다. 오른쪽 sat(s/Φ)는 경계층 −Φ에서 Φ 사이에서 선형이라 그 안에서는 PD처럼 동작한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="719" height="261" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<line x1="60" y1="125" x2="314" y2="125" class="ln c-k "/><polygon points="320,125 311.7,128.5 311.7,121.5" class="f-k"/><line x1="190" y1="200" x2="190" y2="50" class="ln c-k "/><polygon points="190,44 193.5,52.3 186.5,52.3" class="f-k"/><text x="320" y="143" class="it" text-anchor="end">s</text><text x="60" y="32" class="b l" text-anchor="start">sign(s)</text><line x1="420" y1="125" x2="674" y2="125" class="ln c-k "/><polygon points="680,125 671.7,128.5 671.7,121.5" class="f-k"/><line x1="550" y1="200" x2="550" y2="50" class="ln c-k "/><polygon points="550,44 553.5,52.3 546.5,52.3" class="f-k"/><text x="680" y="143" class="it" text-anchor="end">s</text><text x="420" y="32" class="b l" text-anchor="start">sat(s/Φ)</text><path d="M60 178.6L190 178.6" class="ln c-red thick"/><path d="M190 71.4L320 71.4" class="ln c-red thick"/><line x1="190" y1="178.6" x2="190" y2="71.4" class="ln c-red thin dot"/><path d="M420 178.6L511 178.6L589 71.4L680 71.4" class="ln c-blue thick"/><rect x="511" y="50" width="78" height="150" class="f-grn" fill-opacity="0.15"/><text x="593" y="146.4" class="b" text-anchor="start">Φ</text><text x="507" y="146.4" class="b" text-anchor="end">−Φ</text><text x="60" y="230" class="s b" text-anchor="start">0을 지날 때마다 ±로 뒤집힘</text><text x="60" y="248" class="s" text-anchor="start">→ 샘플링·지연이 있으면 채터링</text><text x="420" y="230" class="s b" text-anchor="start">경계층 안에서는 선형</text><text x="420" y="248" class="s" text-anchor="start">→ PD처럼 동작 (4.1절)</text>
</svg>
