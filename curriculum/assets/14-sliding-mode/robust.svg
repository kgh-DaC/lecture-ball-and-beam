<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 366" width="820" height="366" role="img" aria-labelledby="t d">
<title id="t">K_b 변화에 대한 SMC와 PD</title>
<desc id="d">실제 K_b를 공칭의 0.7배, 1배, 1.19배로 바꾼 가상 장치 시뮬레이션에서 SMC(파랑)와 06장 PD(주황)의 스텝 응답. ×0.7: SMC 오버슈트 3.5%, PD 22.6%; ×1: SMC 오버슈트 2.0%, PD 10.0%; ×1.19: SMC 오버슈트 2.3%, PD 8.8%. K_b가 30% 작으면 PD는 크게 지나쳐 정착하지 못하지만 SMC는 거의 그대로다.</desc>
