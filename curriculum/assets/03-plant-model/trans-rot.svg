<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-labelledby="t d">
<title id="t">병진운동과 회전운동의 대응</title>
<desc id="d">왼쪽 병진운동과 오른쪽 회전운동의 대응표. 위치 x ↔ 각 φ, 속도 v ↔ 각속도 ω, 가속도 a ↔ 각가속도 dω/dt, 질량 m ↔ 관성모멘트 J, 힘 F ↔ 토크 τ, F = m a ↔ τ = J dω/dt, 운동에너지 ½ m v² ↔ ½ J ω². 아래에 구름 조건 dy/dt = R ω와 관성모멘트 J = κ m R²(점질량 1, 속찬 공 2/5, 속빈 공 2/3)를 적었다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="679" height="349" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="170" y="32" class="b l" text-anchor="middle">병진운동</text><text x="510" y="32" class="b l" text-anchor="middle">회전운동</text><rect x="20" y="44" width="300" height="232" rx="8" class="box"/><rect x="360" y="44" width="300" height="232" rx="8" class="box"/><text x="34" y="70" class="s f-m" text-anchor="start">위치</text><text x="130" y="70" class="b" text-anchor="start">x (m)</text><text x="374" y="70" class="s f-m" text-anchor="start">각</text><text x="470" y="70" class="b" text-anchor="start">φ (rad)</text><line x1="324" y1="65" x2="356" y2="65" class="ln c-m thin"/><polygon points="362,65 353.7,68.5 353.7,61.5" class="f-m"/><polygon points="318,65 326.3,61.5 326.3,68.5" class="f-m"/><text x="34" y="102" class="s f-m" text-anchor="start">속도</text><text x="130" y="102" class="b" text-anchor="start">v = dx/dt (m/s)</text><text x="374" y="102" class="s f-m" text-anchor="start">각속도</text><text x="470" y="102" class="b" text-anchor="start">ω = dφ/dt (rad/s)</text><line x1="30" y1="80" x2="310" y2="80" class="ln c-m thin dot"/><line x1="370" y1="80" x2="650" y2="80" class="ln c-m thin dot"/><line x1="324" y1="97" x2="356" y2="97" class="ln c-m thin"/><polygon points="362,97 353.7,100.5 353.7,93.5" class="f-m"/><polygon points="318,97 326.3,93.5 326.3,100.5" class="f-m"/><text x="34" y="134" class="s f-m" text-anchor="start">가속도</text><text x="130" y="134" class="b" text-anchor="start">a = d<tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">x/dt</tspan><tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em"> (m/s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">)</tspan></text><text x="374" y="134" class="s f-m" text-anchor="start">각가속도</text><text x="470" y="134" class="b" text-anchor="start">dω/dt (rad/s<tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">)</tspan></text><line x1="30" y1="112" x2="310" y2="112" class="ln c-m thin dot"/><line x1="370" y1="112" x2="650" y2="112" class="ln c-m thin dot"/><line x1="324" y1="129" x2="356" y2="129" class="ln c-m thin"/><polygon points="362,129 353.7,132.5 353.7,125.5" class="f-m"/><polygon points="318,129 326.3,125.5 326.3,132.5" class="f-m"/><text x="34" y="166" class="s f-m" text-anchor="start">관성</text><text x="130" y="166" class="b" text-anchor="start">질량 m (kg)</text><text x="374" y="166" class="s f-m" text-anchor="start">관성모멘트</text><text x="470" y="166" class="b" text-anchor="start">J (kg·m<tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">)</tspan></text><line x1="30" y1="144" x2="310" y2="144" class="ln c-m thin dot"/><line x1="370" y1="144" x2="650" y2="144" class="ln c-m thin dot"/><line x1="324" y1="161" x2="356" y2="161" class="ln c-m thin"/><polygon points="362,161 353.7,164.5 353.7,157.5" class="f-m"/><polygon points="318,161 326.3,157.5 326.3,164.5" class="f-m"/><text x="34" y="198" class="s f-m" text-anchor="start">원인</text><text x="130" y="198" class="b" text-anchor="start">힘 F (N)</text><text x="374" y="198" class="s f-m" text-anchor="start">원인</text><text x="470" y="198" class="b" text-anchor="start">토크 τ = F·R (N·m)</text><line x1="30" y1="176" x2="310" y2="176" class="ln c-m thin dot"/><line x1="370" y1="176" x2="650" y2="176" class="ln c-m thin dot"/><line x1="324" y1="193" x2="356" y2="193" class="ln c-m thin"/><polygon points="362,193 353.7,196.5 353.7,189.5" class="f-m"/><polygon points="318,193 326.3,189.5 326.3,196.5" class="f-m"/><text x="34" y="230" class="s f-m" text-anchor="start">운동방정식</text><text x="130" y="230" class="b" text-anchor="start">F = m a</text><text x="374" y="230" class="s f-m" text-anchor="start">운동방정식</text><text x="470" y="230" class="b" text-anchor="start">τ = J dω/dt</text><line x1="30" y1="208" x2="310" y2="208" class="ln c-m thin dot"/><line x1="370" y1="208" x2="650" y2="208" class="ln c-m thin dot"/><line x1="324" y1="225" x2="356" y2="225" class="ln c-m thin"/><polygon points="362,225 353.7,228.5 353.7,221.5" class="f-m"/><polygon points="318,225 326.3,221.5 326.3,228.5" class="f-m"/><text x="34" y="262" class="s f-m" text-anchor="start">운동에너지</text><text x="130" y="262" class="b" text-anchor="start">½ m v<tspan dy="-0.45em" font-size="72%">2</tspan></text><text x="374" y="262" class="s f-m" text-anchor="start">운동에너지</text><text x="470" y="262" class="b" text-anchor="start">½ J ω<tspan dy="-0.45em" font-size="72%">2</tspan></text><line x1="30" y1="240" x2="310" y2="240" class="ln c-m thin dot"/><line x1="370" y1="240" x2="650" y2="240" class="ln c-m thin dot"/><line x1="324" y1="257" x2="356" y2="257" class="ln c-m thin"/><polygon points="362,257 353.7,260.5 353.7,253.5" class="f-m"/><polygon points="318,257 326.3,253.5 326.3,260.5" class="f-m"/><text x="340" y="310" class="b" text-anchor="middle">구르는 공은 두 운동을 동시에 한다:  dy/dt = R ω  (미끄러지지 않을 때)</text><text x="340" y="332" class="s" text-anchor="middle">관성모멘트 J = κ m R<tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">:  점질량 κ = 1,  속찬 공 κ = 2/5,  속빈 얇은 공 κ = 2/3</tspan></text>
</svg>
