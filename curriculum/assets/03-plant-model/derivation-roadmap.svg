<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 190" width="780" height="190" role="img" aria-labelledby="t d">
<title id="t">03장 유도의 길</title>
<desc id="d">네 단계의 흐름. 물리 법칙(뉴턴의 병진, 오일러의 회전, 구름 조건; 2–3절) → 비선형 운동방정식 (m + J/R²)ÿ = mg sin α + m y (dα/dt)²(3–5절) → 선형화(sin θ ≈ θ, α ≈ (d/L)θ, 원심 항 무시; 7–8절) → 전달함수 P(s) = K_b/s², K_b = 0.8993(9–11절).</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="189" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="390" y="30" class="b l" text-anchor="middle">이 장이 가는 길</text><rect x="14" y="48" width="172" height="124" rx="10" class="bx-blue"/><text x="100" y="76" class="b" text-anchor="middle">물리 법칙</text><line x1="30" y1="88" x2="170" y2="88" class="ln c-m thin dot"/><text x="100" y="110" class="s" text-anchor="middle">뉴턴(병진) · 오일러(회전)</text><text x="100" y="130" class="s" text-anchor="middle">+ 구름 조건</text><rect x="71" y="144" width="58" height="20" rx="10" class="pill-blue"/><text x="100" y="158" class="xs b w" text-anchor="middle">2–3절</text><line x1="188" y1="110" x2="200" y2="110" class="ln c-m "/><polygon points="206,110 197.7,113.5 197.7,106.5" class="f-m"/><rect x="208" y="48" width="172" height="124" rx="10" class="bx-pur"/><text x="294" y="76" class="b" text-anchor="middle">비선형 운동방정식</text><line x1="224" y1="88" x2="364" y2="88" class="ln c-m thin dot"/><text x="294" y="110" class="s" text-anchor="middle">(m + J/R<tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">) ÿ =</tspan></text><text x="294" y="130" class="s" text-anchor="middle">m g sin α + m y (dα/dt)<tspan dy="-0.45em" font-size="72%">2</tspan></text><rect x="265" y="144" width="58" height="20" rx="10" class="pill-pur"/><text x="294" y="158" class="xs b w" text-anchor="middle">3–5절</text><line x1="382" y1="110" x2="394" y2="110" class="ln c-m "/><polygon points="400,110 391.7,113.5 391.7,106.5" class="f-m"/><rect x="402" y="48" width="172" height="124" rx="10" class="bx-org"/><text x="488" y="76" class="b" text-anchor="middle">선형화</text><line x1="418" y1="88" x2="558" y2="88" class="ln c-m thin dot"/><text x="488" y="110" class="s" text-anchor="middle">sin θ ≈ θ,  α ≈ (d/L) θ</text><text x="488" y="130" class="s" text-anchor="middle">원심 항 무시</text><rect x="459" y="144" width="58" height="20" rx="10" class="pill-org"/><text x="488" y="158" class="xs b w" text-anchor="middle">7–8절</text><line x1="576" y1="110" x2="588" y2="110" class="ln c-m "/><polygon points="594,110 585.7,113.5 585.7,106.5" class="f-m"/><rect x="596" y="48" width="172" height="124" rx="10" class="bx-grn"/><text x="682" y="76" class="b" text-anchor="middle">전달함수</text><line x1="612" y1="88" x2="752" y2="88" class="ln c-m thin dot"/><text x="682" y="110" class="s" text-anchor="middle">P(s) = K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em"> / s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan></text><text x="682" y="130" class="s" text-anchor="middle">K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em"> = 0.8993 m/s²/rad</tspan></text><rect x="653" y="144" width="58" height="20" rx="10" class="pill-grn"/><text x="682" y="158" class="xs b w" text-anchor="middle">9–11절</text>
</svg>
