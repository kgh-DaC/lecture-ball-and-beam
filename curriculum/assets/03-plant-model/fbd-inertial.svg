<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-labelledby="t d">
<title id="t">기운 빔 위 공의 자유물체도와 관성력</title>
<desc id="d">각도 α로 기운 빔 위의 공. 실제 힘은 중력 mg(아래), 수직항력 N(빔에 수직), 접촉점의 마찰력 f(오르막 방향)이다. 점선은 달랑베르 형식의 관성력 −m ÿ(운동 반대 방향)와 관성 토크 −J dω/dt이다. 아래에 병진(뉴턴)·회전(오일러)·구름 조건 식과 f를 소거한 결과 (m + J/R²) ÿ = m g sin α를 적었다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="639" height="349" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<path d="M60 80L564.6 205.8" class="ln c-k thick"/><line x1="60" y1="80" x2="580" y2="80" class="ln c-m thin dash"/><path d="M 130 80 A 70 70 0 0 1 127.9 96.9" class="ln c-red "/><text x="134" y="92" class="b it" text-anchor="start">α</text><text x="56" y="66" class="s" text-anchor="start">센서 쪽</text><text x="524.6" y="231.8" class="s" text-anchor="start">+y 방향(내리막)</text><circle cx="338.9" cy="118.6" r="30" class="box"/><circle cx="338.9" cy="118.6" r="3" class="f-k"/><circle cx="331.7" cy="147.7" r="3.5" class="f-k"/><line x1="338.9" y1="118.6" x2="338.9" y2="222.6" class="ln c-k "/><polygon points="338.9,228.6 335.4,220.3 342.4,220.3" class="f-k"/><text x="346.9" y="230.6" class="b" text-anchor="start">mg</text><line x1="331.7" y1="147.7" x2="359.3" y2="37.1" class="ln c-blue "/><polygon points="360.7,31.3 362.1,40.2 355.3,38.5" class="f-blue"/><text x="366.7" y="27.3" class="b" text-anchor="start">N</text><line x1="331.7" y1="147.7" x2="259.9" y2="129.8" class="ln c-grn thick"/><polygon points="254.1,128.4 263,127 261.3,133.8" class="f-grn"/><text x="246.1" y="148.4" class="s b" text-anchor="end">f (접촉 마찰력)</text><line x1="341.8" y1="107" x2="274.9" y2="90.3" class="ln c-org dash"/><polygon points="269.1,88.8 278,87.4 276.3,94.2" class="f-org"/><text x="261.1" y="93.8" class="s b" text-anchor="end">−m ÿ (관성력)</text><path d="M 352.9 78.6 A 44 44 0 0 0 300.9 98.6" class="ln c-org dash"/><polygon points="300.9,98.6 303.4,90 308.9,94.3" class="f-org"/><text x="292.9" y="60.6" class="s b" text-anchor="end">−J dω/dt (관성 토크)</text><path d="M 358.9 144.6 A 34 34 0 0 0 371.9 108.6" class="ln c-pur "/><polygon points="371.9,108.6 376.1,116.6 369.1,117.2" class="f-pur"/><text x="380.9" y="120.6" class="s" text-anchor="start">ω (구름)</text><text x="30" y="285" class="b" text-anchor="start">빔 방향(뉴턴):  m ÿ = m g sin α − f</text><text x="30" y="309" class="b" text-anchor="start">회전(오일러):  J dω/dt = f R,   구름: dy/dt = R ω</text><text x="30" y="333" class="b" text-anchor="start">→ (m + J/R<tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">) ÿ = m g sin α</tspan></text><text x="380" y="285" class="s" text-anchor="start">달랑베르: 실제 힘 + 관성력(점선) = 0</text><text x="380" y="305" class="s" text-anchor="start">m g sin α − f − m ÿ = 0</text><text x="380" y="325" class="s" text-anchor="start">f R − J dω/dt = 0</text>
</svg>
