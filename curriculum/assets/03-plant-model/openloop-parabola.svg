<title id="t">개루프: 일정 각도에서 공 위치</title>
<desc id="d">빔을 1°, 2°, 3°로 고정했을 때 100 mm에서 출발한 공 위치가 시간의 제곱에 비례해 커지는 포물선 세 개. 2°에서 200 mm에 닿는 시각은 약 2.6 s.</desc>
