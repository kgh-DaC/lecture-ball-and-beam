<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-labelledby="t d">
<title id="t">기울어진 빔 위 공에 작용하는 힘</title>
<desc id="d">각도 α로 기운 빔 위의 공. 중력 mg 가운데 빔 방향 성분 mg sin α가 공을 빔을 따라 가속하고, 공은 미끄러지지 않고 각속도 ω로 구른다. 공 위치 y는 빔을 따라 잰다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="639" height="309" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<path d="M90 110L559.5 209.8" class="ln c-k thick"/><line x1="90" y1="110" x2="570" y2="110" class="ln c-m thin dash"/><path d="M 210 110 A 120 120 0 0 1 207.4 134.9" class="ln c-red "/><text x="216" y="124" class="b it" text-anchor="start">α</text><circle cx="349.7" cy="138.6" r="24" class="box"/><circle cx="349.7" cy="138.6" r="3" class="f-k"/><path d="M 335.7 118.6 A 24 24 0 0 1 367.7 122.6" class="ln c-pur "/><polygon points="367.7,122.6 359,120.5 363.2,114.8" class="f-pur"/><text x="321.7" y="98.6" class="s" text-anchor="end">ω (구름)</text><line x1="349.7" y1="138.6" x2="349.7" y2="222.6" class="ln c-k "/><polygon points="349.7,228.6 346.2,220.3 353.2,220.3" class="f-k"/><text x="355.7" y="230.6" class="b" text-anchor="start">mg</text><line x1="349.7" y1="138.6" x2="398.8" y2="149" class="ln c-org thick"/><polygon points="404.6,150.3 395.8,152 397.3,145.1" class="f-org"/><text x="408.6" y="140.3" class="s b" text-anchor="start">mg sin α (빔 방향)</text><line x1="107.7" y1="26.9" x2="356.1" y2="79.7" class="ln c-blue "/><polygon points="362,80.9 353.2,82.6 354.6,75.8" class="f-blue"/><text x="234.8" y="43.9" class="s b" text-anchor="middle">y (빔을 따라 잰 공 위치)</text><text x="40" y="270" class="b" text-anchor="start">굴러가는 공:  dy/dt = R·ω,   (m + J/R<tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">) ÿ = m g sin α  ≈ m g (d/L) θ</tspan></text><text x="40" y="294" class="s" text-anchor="start">회전에 에너지가 들어가므로 같은 힘에도 미끄러지는 물체보다 천천히 가속한다(추가 질량 J/R<tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">).</tspan></text>
</svg>
