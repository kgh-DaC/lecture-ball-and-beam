<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="t d">
<title id="t">이중 적분기 블록선도</title>
<desc id="d">서보 각 θ에 K_b를 곱하면 가속도, 가속도를 한 번 적분하면 속도, 속도를 한 번 더 적분하면 위치 y가 된다. 서보 각을 일정하게 주면 가속도는 일정, 속도는 직선으로, 위치는 포물선으로 커진다. 스스로 멈추게 하는 항이 없어 극점 두 개가 원점에 있는 이중 적분기이며 개루프로는 불안정하다.</desc>
