<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 414" width="860" height="414" role="img" aria-labelledby="t d">
<title id="t">제어기별 특성 비교</title>
<desc id="d">여섯 열(PID, LQR, SMC, Q 정책, 신경망 정책 ES, 모방 정책 DAgger)과 여섯 행(필요한 데이터·실험, 학습·설계 계산, 매 주기 실행 계산, 안정성 보장의 어려움, 설명의 어려움, 사람이 정할 것)인 표. 칸마다 적음·보통·많음을 주황 색 농도로 나타내고 짧은 근거를 적었다. AI 제어기 열은 데이터·학습 계산·안정성 보장·설명에서 부담이 크고, Q 정책은 실행 계산이 가장 적다.</desc>
