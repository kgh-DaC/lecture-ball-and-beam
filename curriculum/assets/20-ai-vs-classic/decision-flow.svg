<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 522" width="850" height="522" role="img" aria-labelledby="t d">
<title id="t">제어기 선택 질문 흐름</title>
<desc id="d">질문 흐름도. 쓸 만한 모델이 있나? 예이면 모델 오차가 크고 그 상한을 아나에 따라 아니오는 PID/LQR, 예는 SMC. 모델이 없으면 실험해서 모델을 얻을 수 있나? 예이면 식별·오토튜닝 후 처음 질문으로 돌아간다. 아니오이면 믿을 만한 시뮬레이터가 있고 비선형이 큰가? 예이면 AI 정책과 안전 장치. 따로, 잘하는 선생님이 있고 더 가볍게 만들고 싶으면 모방 학습. 모든 경로 끝에 반복 검증, 같은 조건 비교, 출처 표시가 있다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="849" height="521" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="260" y="30" width="260" height="40" rx="14" class="box"/><text x="390" y="55" class="s b" text-anchor="middle">쓸 만한 모델(전달함수)이 있나?</text><path d="M330 70L330 100L180 100L180 114" class="ln c-k "/><polygon points="180,120 176.5,111.7 183.5,111.7" class="f-k"/><text x="255" y="94" class="xs b" text-anchor="middle">예</text><path d="M450 70L450 100L600 100L600 114" class="ln c-k "/><polygon points="600,120 596.5,111.7 603.5,111.7" class="f-k"/><text x="525" y="94" class="xs b" text-anchor="middle">아니오</text><rect x="60" y="120" width="240" height="52" rx="14" class="box"/><text x="180" y="142" class="s b" text-anchor="middle">모델 오차가 크고</text><text x="180" y="160" class="xs" text-anchor="middle">그 상한을 아나?</text><path d="M120 172L120 204" class="ln c-k "/><polygon points="120,210 116.5,201.7 123.5,201.7" class="f-k"/><text x="112" y="196" class="xs b" text-anchor="end">아니오</text><path d="M240 172L240 204" class="ln c-k "/><polygon points="240,210 236.5,201.7 243.5,201.7" class="f-k"/><text x="248" y="196" class="xs b" text-anchor="start">예</text><rect x="30" y="210" width="160" height="48" rx="6" class="f-grn" fill-opacity="0.16"/><rect x="30" y="210" width="160" height="48" rx="6" class="boxd"/><text x="110" y="231" class="s b" text-anchor="middle">PID / LQR</text><text x="110" y="248" class="xs" text-anchor="middle">04–06·13장 (선형 근처)</text><rect x="200" y="210" width="130" height="48" rx="6" class="f-grn" fill-opacity="0.16"/><rect x="200" y="210" width="130" height="48" rx="6" class="boxd"/><text x="265" y="231" class="s b" text-anchor="middle">SMC</text><text x="265" y="248" class="xs" text-anchor="middle">14장</text><rect x="470" y="120" width="260" height="40" rx="14" class="box"/><text x="600" y="145" class="s b" text-anchor="middle">실험해서 모델을 얻을 수 있나?</text><path d="M540 160L540 194" class="ln c-k "/><polygon points="540,200 536.5,191.7 543.5,191.7" class="f-k"/><text x="532" y="186" class="xs b" text-anchor="end">예</text><path d="M680 160L680 284" class="ln c-k "/><polygon points="680,290 676.5,281.7 683.5,281.7" class="f-k"/><text x="688" y="186" class="xs b" text-anchor="start">아니오</text><rect x="450" y="200" width="180" height="48" rx="6" class="f-blue" fill-opacity="0.16"/><rect x="450" y="200" width="180" height="48" rx="6" class="boxd"/><text x="540" y="221" class="s b" text-anchor="middle">식별·오토튜닝</text><text x="540" y="238" class="xs" text-anchor="middle">07·11장 → 맨 위로</text><path d="M450 224L410 224L410 76" class="ln c-blue dash"/><polygon points="410,70 413.5,78.3 406.5,78.3" class="f-blue"/><rect x="560" y="290" width="260" height="52" rx="14" class="box"/><text x="690" y="312" class="s b" text-anchor="middle">믿을 만한 시뮬레이터가 있고</text><text x="690" y="330" class="xs" text-anchor="middle">식으로 쓰기 어려운 비선형이 큰가?</text><path d="M690 342L690 374" class="ln c-k "/><polygon points="690,380 686.5,371.7 693.5,371.7" class="f-k"/><text x="698" y="366" class="xs b" text-anchor="start">예</text><rect x="590" y="380" width="200" height="48" rx="6" class="f-org" fill-opacity="0.16"/><rect x="590" y="380" width="200" height="48" rx="6" class="boxd"/><text x="690" y="401" class="s b" text-anchor="middle">AI 정책 + 안전 장치</text><text x="690" y="418" class="xs" text-anchor="middle">17·18장 (폴백 PD 필수)</text><rect x="60" y="300" width="300" height="52" rx="14" class="box"/><text x="210" y="322" class="s b" text-anchor="middle">잘하는 선생님(제어기·사람)이 있고</text><text x="210" y="340" class="xs" text-anchor="middle">더 가볍게 만들고 싶나?</text><path d="M210 352L210 374" class="ln c-k "/><polygon points="210,380 206.5,371.7 213.5,371.7" class="f-k"/><text x="218" y="370" class="xs b" text-anchor="start">예</text><rect x="110" y="380" width="200" height="48" rx="6" class="f-pur" fill-opacity="0.16"/><rect x="110" y="380" width="200" height="48" rx="6" class="boxd"/><text x="210" y="401" class="s b" text-anchor="middle">모방 학습 (DAgger)</text><text x="210" y="418" class="xs" text-anchor="middle">19장 (선생님에게 물을 수 있을 때)</text><rect x="30" y="452" width="790" height="40" rx="6" class="f-k" fill-opacity="0.06"/><text x="425" y="477" class="s b" text-anchor="middle">모든 경로의 끝: 반복 검증(10장) + 같은 조건 비교(15·20장) + 출처 표시(실측/시뮬레이션/가정)</text><text x="830" y="512" class="xs f-m" text-anchor="end">[가정] 이 교재의 경험에 기반한 출발점이며 규칙이 아니다</text>
</svg>
