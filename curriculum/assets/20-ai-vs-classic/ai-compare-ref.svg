<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 362" width="800" height="362" role="img" aria-labelledby="t d">
<title id="t">ai-compare 참고 실행</title>
<desc id="d">P1 표준 스텝, 무작위 모델 8개(seed 1)에서 다섯 제어기 비교. PID: 성공 8/8, 평균 ITAE 0.125, 공칭 u_tv 0.4 rad; LQR: 성공 8/8, 평균 ITAE 0.047, 공칭 u_tv 1.7 rad; SMC: 성공 8/8, 평균 ITAE 0.090, 공칭 u_tv 3.1 rad; ES 정책: 성공 5/8, 평균 ITAE 0.152, 공칭 u_tv 23.3 rad; Q 정책: 성공 0/8, 평균 ITAE 0.614, 공칭 u_tv 2.9 rad.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="799" height="361" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="40" y="28" class="b" text-anchor="start">ai-compare 참고 실행: P1, 무작위 모델 8개(seed 1), 가정 서보 [시뮬레이션]</text><text x="40" y="64" class="s b" text-anchor="start">무작위 8개 성공</text><line x1="40" y1="250" x2="260" y2="250" class="ln c-k "/><rect x="46" y="102.2" width="32" height="147.8" rx="3" class="bx-org"/><text x="62" y="97.2" class="xs b" text-anchor="middle">8/8</text><rect x="89" y="102.2" width="32" height="147.8" rx="3" class="bx-blue"/><text x="105" y="97.2" class="xs b" text-anchor="middle">8/8</text><rect x="132" y="102.2" width="32" height="147.8" rx="3" class="bx-grn"/><text x="148" y="97.2" class="xs b" text-anchor="middle">8/8</text><rect x="175" y="157.6" width="32" height="92.4" rx="3" class="bx-pur"/><text x="191" y="152.6" class="xs b" text-anchor="middle">5/8</text><rect x="218" y="248" width="32" height="2" rx="3" class="bx-red"/><text x="234" y="243" class="xs b" text-anchor="middle">0/8</text><text x="290" y="64" class="s b" text-anchor="start">무작위 8개 평균 ITAE (m·s²)</text><line x1="290" y1="250" x2="510" y2="250" class="ln c-k "/><rect x="296" y="217.3" width="32" height="32.7" rx="3" class="bx-org"/><text x="312" y="212.3" class="xs b" text-anchor="middle">0.125</text><rect x="339" y="237.7" width="32" height="12.3" rx="3" class="bx-blue"/><text x="355" y="232.7" class="xs b" text-anchor="middle">0.047</text><rect x="382" y="226.5" width="32" height="23.5" rx="3" class="bx-grn"/><text x="398" y="221.5" class="xs b" text-anchor="middle">0.090</text><rect x="425" y="210.3" width="32" height="39.7" rx="3" class="bx-pur"/><text x="441" y="205.3" class="xs b" text-anchor="middle">0.152</text><rect x="468" y="89.4" width="32" height="160.6" rx="3" class="bx-red"/><text x="484" y="84.4" class="xs b" text-anchor="middle">0.614</text><text x="540" y="64" class="s b" text-anchor="start">공칭 u<tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em"> (rad)</tspan></text><line x1="540" y1="250" x2="760" y2="250" class="ln c-k "/><rect x="546" y="247.5" width="32" height="2.5" rx="3" class="bx-org"/><text x="562" y="242.5" class="xs b" text-anchor="middle">0.4</text><rect x="589" y="238.4" width="32" height="11.6" rx="3" class="bx-blue"/><text x="605" y="233.4" class="xs b" text-anchor="middle">1.7</text><rect x="632" y="228.6" width="32" height="21.4" rx="3" class="bx-grn"/><text x="648" y="223.6" class="xs b" text-anchor="middle">3.1</text><rect x="675" y="91.9" width="32" height="158.1" rx="3" class="bx-pur"/><text x="691" y="86.9" class="xs b" text-anchor="middle">23.3</text><rect x="718" y="230.2" width="32" height="19.8" rx="3" class="bx-red"/><text x="734" y="225.2" class="xs b" text-anchor="middle">2.9</text><rect x="40" y="288" width="18" height="12" rx="2" class="bx-org"/><text x="64" y="299" class="s b" text-anchor="start">PID</text><rect x="190" y="288" width="18" height="12" rx="2" class="bx-blue"/><text x="214" y="299" class="s b" text-anchor="start">LQR</text><rect x="340" y="288" width="18" height="12" rx="2" class="bx-grn"/><text x="364" y="299" class="s b" text-anchor="start">SMC</text><rect x="490" y="288" width="18" height="12" rx="2" class="bx-pur"/><text x="514" y="299" class="s b" text-anchor="start">ES 정책</text><rect x="640" y="288" width="18" height="12" rx="2" class="bx-red"/><text x="664" y="299" class="s b" text-anchor="start">Q 정책</text><text x="40" y="330" class="xs f-m" text-anchor="start">성공 = 끝 충돌 없이 정착(지표 정의 2판). 폴백은 다섯 제어기 모두 0. 고전·현대 제어기는 사람이 고른 기본값, AI 정책은 번들(수천~1만 에피소드).</text><text x="40" y="346" class="xs f-m" text-anchor="start">ES의 공칭 u<tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em">는 PID의 약 60배, Q 정책은 공칭에서도 정착하지 못한다.</tspan></text>
</svg>
