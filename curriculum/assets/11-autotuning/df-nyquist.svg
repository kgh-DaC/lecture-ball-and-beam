<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d">
<title id="t">기술함수로 본 릴레이 극한 사이클</title>
<desc id="d">릴레이가 보는 대상 G'(jω)의 나이키스트 곡선(파랑)과 릴레이의 −1/N(a) 궤적. 이상 릴레이(초록, 음의 실축)와는 ω ≈ 2.03 rad/s에서 만나 Ku ≈ 4.86, Tu ≈ 3.09 s를 예측한다. 히스테리시스 6 mm가 있으면 궤적이 실축 아래로 내려가(보라 점선) 더 낮은 주파수 ω ≈ 1.57에서 만나므로 Tu가 길어지고 Ku가 작아진다.</desc>
