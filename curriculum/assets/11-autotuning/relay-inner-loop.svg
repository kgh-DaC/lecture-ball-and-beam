<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 325" width="760" height="325" role="img" aria-labelledby="t d">
<title id="t">안쪽 미분 루프를 더한 릴레이 실험 구성</title>
<desc id="d">오차 e가 릴레이(±1, 히스테리시스 ε)와 이득 h를 거치고, 공 위치의 측정값 미분에 k_d,stab를 곱한 값이 빠져 서보 명령 u가 된다. 점선 상자 안쪽 루프가 이중 적분기를 K_b/(s(s + K_b k_d,stab))로 바꿔 극한 사이클이 생기게 한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="324" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="14" y="105" class="b l" text-anchor="start">r</text><line x1="28" y1="100" x2="66" y2="100" class="ln c-k "/><polygon points="72,100 63.7,103.5 63.7,96.5" class="f-k"/><circle cx="85" cy="100" r="13" class="box"/><line x1="78" y1="100" x2="92" y2="100" class="ln c-k "/><line x1="85" y1="93" x2="85" y2="107" class="ln c-k "/><text x="63" y="92" class="b" text-anchor="start">+</text><text x="95" y="126" class="b" text-anchor="start">−</text><line x1="98" y1="100" x2="134" y2="100" class="ln c-k "/><polygon points="140,100 131.7,103.5 131.7,96.5" class="f-k"/><text x="119" y="90" class="b it" text-anchor="middle">e</text><rect x="140" y="72" width="110" height="56" rx="6" class="box"/><text x="195" y="97" class="b" text-anchor="middle">릴레이 ±1</text><text x="195" y="115" class="s" text-anchor="middle">히스테리시스 ε</text><line x1="250" y1="100" x2="284" y2="100" class="ln c-k "/><polygon points="290,100 281.7,103.5 281.7,96.5" class="f-k"/><rect x="290" y="72" width="60" height="56" rx="6" class="box"/><text x="320" y="105" class="b" text-anchor="middle">× h</text><line x1="350" y1="100" x2="392" y2="100" class="ln c-k "/><polygon points="398,100 389.7,103.5 389.7,96.5" class="f-k"/><circle cx="411" cy="100" r="13" class="box"/><line x1="404" y1="100" x2="418" y2="100" class="ln c-k "/><line x1="411" y1="93" x2="411" y2="107" class="ln c-k "/><text x="389" y="92" class="b" text-anchor="start">+</text><text x="421" y="126" class="b" text-anchor="start">−</text><line x1="424" y1="100" x2="474" y2="100" class="ln c-k "/><polygon points="480,100 471.7,103.5 471.7,96.5" class="f-k"/><text x="452" y="90" class="b it" text-anchor="middle">u</text><rect x="480" y="72" width="140" height="56" rx="6" class="box"/><text x="550" y="97" class="b" text-anchor="middle">서보·빔·공</text><text x="550" y="115" class="s" text-anchor="middle">(K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">/s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em"> + 지연들)</tspan></text><line x1="620" y1="100" x2="714" y2="100" class="ln c-k "/><polygon points="720,100 711.7,103.5 711.7,96.5" class="f-k"/><text x="726" y="105" class="b l" text-anchor="start">y</text><path d="M670 100L670 185L526 185" class="ln c-k "/><polygon points="520,185 528.3,181.5 528.3,188.5" class="f-k"/><rect x="380" y="160" width="140" height="50" rx="6" class="box"/><text x="450" y="182" class="b" text-anchor="middle">k<tspan dy="0.35em" font-size="72%">d,stab</tspan><tspan dy="-0.35em">·s</tspan></text><text x="450" y="200" class="s" text-anchor="middle">측정값 미분 (필터)</text><path d="M411 160L411 119" class="ln c-k "/><polygon points="411,113 414.5,121.3 407.5,121.3" class="f-k"/><path d="M690 100L690 250L85 250L85 119" class="ln c-k "/><polygon points="85,113 88.5,121.3 81.5,121.3" class="f-k"/><rect x="370" y="60" width="270" height="165" rx="10" class="boxd"/><text x="505" y="242" class="s b" text-anchor="middle">안쪽 루프: G'(s) = K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em"> / (s (s + K</tspan><tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em"> k</tspan><tspan dy="0.35em" font-size="72%">d,stab</tspan><tspan dy="-0.35em">))</tspan></text><text x="20" y="290" class="s b" text-anchor="start">u = h·(±1) − k<tspan dy="0.35em" font-size="72%">d,stab</tspan><tspan dy="-0.35em">·(dy</tspan><tspan dy="0.35em" font-size="72%">f</tspan><tspan dy="-0.35em">/dt),   기본 k</tspan><tspan dy="0.35em" font-size="72%">d,stab</tspan><tspan dy="-0.35em"> = 1.5 rad·s/m (실제 장치에서 최소 0.3)</tspan></text><text x="20" y="310" class="s" text-anchor="start">안쪽 미분 루프가 이중 적분기를 먼저 안정화해야 유한한 주파수에서 극한 사이클이 생긴다</text>
</svg>
