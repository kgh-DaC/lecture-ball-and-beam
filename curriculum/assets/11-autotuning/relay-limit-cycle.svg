<title id="t">릴레이 피드백의 극한 사이클</title>
<desc id="d">위: 오차 e가 진폭 a, 주기 Tu로 계속 진동한다. 초록 띠는 히스테리시스 ±ε. 아래: 릴레이 출력 u는 오차가 +ε 위로 올라가면 +h, −ε 아래로 내려가면 −h로 바뀌는 사각파이다. 한계 게인은 Ku = 4h/(πa).</desc>
