<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 428" width="820" height="428" role="img" aria-labelledby="t d">
<title id="t">릴레이 피드백의 극한 사이클</title>
<desc id="d">가상 장치(가정 서보) 시뮬레이션의 16~30 s 구간. 위는 오차 e가 진폭 약 21 mm, 주기 4.1 s로 계속 진동하는 모습이고 초록 띠는 히스테리시스 ±6 mm다. 아래는 서보 명령 u로, 오차가 띠를 벗어날 때마다 +h와 −h 사이를 오가며 안쪽 미분 루프 때문에 계단이 기울어 있다. 한계 게인 Ku = 3.11 rad/m.</desc>
