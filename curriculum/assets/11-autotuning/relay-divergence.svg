<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d">
<title id="t">순수 릴레이의 발산</title>
<desc id="d">설정값 170 mm에서 릴레이 실험을 한 시뮬레이션. 안쪽 미분 루프가 없으면(k_d,stab = 0, 빨강) 진동 진폭이 주기마다 커져 13.6 s에 공이 빔 끝에 닿는다. k_d,stab = 1.5(파랑)이면 일정한 진폭의 극한 사이클이 유지된다.</desc>
