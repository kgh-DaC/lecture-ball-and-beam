<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 414" width="820" height="414" role="img" aria-labelledby="t d">
<title id="t">LQR과 PD의 스텝 응답</title>
<desc id="d">가상 장치 잡음 조건에서 LQR(r 10, Luenberger ×3, θ 측정)과 06장 PD(1.0, 1.5)의 150 → 200 mm 스텝 응답과 서보 명령. LQR은 오버슈트 3.4%, 정착 2.3 s, u_tv 58°이고 PD는 오버슈트 5.5%, 정착 5.8 s, u_tv 14°다. LQR은 빨리 정착하지만 명령이 잘게 떨린다.</desc>
