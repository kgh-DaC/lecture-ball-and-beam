text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="819" height="329" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="80" y="28" class="b" text-anchor="start">관측기별 서보 명령 총변동 u<tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em">: θ 측정을 켜느냐에 따라 순위가 바뀐다 [시뮬레이션]</tspan></text><line x1="80" y1="298" x2="560" y2="298" class="ln c-m thin dot"/><line x1="80" y1="234" x2="560" y2="234" class="ln c-m thin dot"/><line x1="80" y1="170" x2="560" y2="170" class="ln c-m thin dot"/><line x1="80" y1="106" x2="560" y2="106" class="ln c-m thin dot"/><line x1="80" y1="298" x2="568" y2="298" class="ln c-k "/><polygon points="574,298 565.7,301.5 565.7,294.5" class="f-k"/><line x1="80" y1="298" x2="80" y2="52" class="ln c-k "/><polygon points="80,46 83.5,54.3 76.5,54.3" class="f-k"/><line x1="75" y1="298" x2="80" y2="298" class="ln c-k "/><text x="72" y="302" class="s" text-anchor="end">0</text><line x1="75" y1="234" x2="80" y2="234" class="ln c-k "/><text x="72" y="238" class="s" text-anchor="end">200</text><line x1="75" y1="170" x2="80" y2="170" class="ln c-k "/><text x="72" y="174" class="s" text-anchor="end">400</text><line x1="75" y1="106" x2="80" y2="106" class="ln c-k "/><text x="72" y="110" class="s" text-anchor="end">600</text><text x="564" y="334" class="s" text-anchor="end"></text><text x="86" y="42" class="s" text-anchor="start">u<tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em"> (°, 8 s 동안)</tspan></text><rect x="93.4" y="197.8" width="32.6" height="100.2" rx="3" class="bx-blue"/><rect x="130" y="194.3" width="32.6" height="103.7" rx="3" class="bx-org"/><text x="109.7" y="192.8" class="xs b f-blue" text-anchor="middle">313</text><text x="146.3" y="189.3" class="xs b f-org" text-anchor="middle">324</text><text x="128" y="316" class="s b" text-anchor="middle">차분</text><rect x="189.4" y="289.1" width="32.6" height="8.9" rx="3" class="bx-blue"/><rect x="226" y="169" width="32.6" height="129" rx="3" class="bx-org"/><text x="205.7" y="284.1" class="xs b f-blue" text-anchor="middle">28</text><text x="242.3" y="164" class="xs b f-org" text-anchor="middle">403</text><text x="224" y="316" class="s b" text-anchor="middle">Luen ×1</text><rect x="285.4" y="279.5" width="32.6" height="18.5" rx="3" class="bx-blue"/><rect x="322" y="104.7" width="32.6" height="193.3" rx="3" class="bx-org"/><text x="301.7" y="274.5" class="xs b f-blue" text-anchor="middle">58</text><text x="338.3" y="99.7" class="xs b f-org" text-anchor="middle">604</text><text x="320" y="316" class="s b" text-anchor="middle">Luen ×3</text><rect x="381.4" y="246.3" width="32.6" height="51.7" rx="3" class="bx-blue"/><rect x="418" y="77" width="32.6" height="221" rx="3" class="bx-org"/><text x="397.7" y="241.3" class="xs b f-blue" text-anchor="middle">162</text><text x="434.3" y="72" class="xs b f-org" text-anchor="middle">691</text><text x="416" y="316" class="s b" text-anchor="middle">Luen ×6</text><rect x="477.4" y="249.6" width="32.6" height="48.4" rx="3" class="bx-blue"/><rect x="514" y="248.1" width="32.6" height="49.9" rx="3" class="bx-org"/><text x="493.7" y="244.6" class="xs b f-blue" text-anchor="middle">151</text><text x="530.3" y="243.1" class="xs b f-org" text-anchor="middle">156</text><text x="512" y="316" class="s b" text-anchor="middle">칼만</text><rect x="590" y="70" width="18" height="14" rx="3" class="bx-blue"/><text x="616" y="82" class="s b f-blue" text-anchor="start">θ 측정 켬 (기본값)</text><rect x="590" y="100" width="18" height="14" rx="3" class="bx-org"/><text x="616" y="112" class="s b f-org" text-anchor="start">θ 측정 끔 (θ도 추정)</text><text x="590" y="150" class="s" text-anchor="start">θ를 재면 Luenberger ×3이</text><text x="590" y="168" class="s" text-anchor="start">칼만보다 매끄럽다.</text><text x="590" y="196" class="s" text-anchor="start">θ까지 추정하면 칼만이</text><text x="590" y="214" class="s" text-anchor="start">Luenberger ×3의 약 1/4.</text><text x="590" y="262" class="xs f-m" text-anchor="start">r 10, 가정 서보, 잡음 σ 1 mm,</text><text x="590" y="276" class="xs f-m" text-anchor="start">유실 1 %, 포텐쇼미터 잡음 0.23°</text>
</svg>
