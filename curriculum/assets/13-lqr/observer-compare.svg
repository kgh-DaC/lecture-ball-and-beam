<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d">
<title id="t">관측기별 서보 명령 총변동</title>
<desc id="d">같은 LQR(r = 10)에서 관측기만 바꿨을 때 8초 동안 서보 명령의 총변동 u_tv. θ 측정을 켜면(파랑) 차분 차분 313°, Luen ×1 28°, Luen ×3 58°, Luen ×6 162°, 칼만 151°. θ 측정을 끄면(주황) 차분 324°, Luen ×1 403°, Luen ×3 604°, Luen ×6 691°, 칼만 156°. θ를 재면 Luenberger ×3이 칼만보다 매끄럽고, θ까지 추정하면 칼만이 훨씬 매끄럽다.</desc>
