<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760" height="305" role="img" aria-labelledby="t d">
<title id="t">LQR 상태 피드백과 관측기 블록선도</title>
<desc id="d">서보와 빔·공의 상태는 오차 e, 그 미분, 서보 각 θ이다. 초음파로 잰 y에서 ref를 뺀 e와 서보 명령 u가 관측기로 들어가 추정 상태 x̂를 만들고, 게인 −K를 곱해 u = −k1 ê − k2 dê/dt − k3 θ̂를 만든다. 서보 각 θ는 포텐쇼미터로 직접 잴 수도 있다(점선).</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="304" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="330" y="40" width="200" height="70" rx="6" class="box"/><text x="430" y="72" class="b" text-anchor="middle">서보 + 빔·공</text><text x="430" y="90" class="s" text-anchor="middle">상태 x = [e, de/dt, θ]</text><line x1="530" y1="60" x2="634" y2="60" class="ln c-k "/><polygon points="640,60 631.7,63.5 631.7,56.5" class="f-k"/><text x="648" y="65" class="s b" text-anchor="start">y (초음파)</text><line x1="530" y1="95" x2="634" y2="95" class="ln c-pur dash"/><polygon points="640,95 631.7,98.5 631.7,91.5" class="f-pur"/><text x="648" y="100" class="s b" text-anchor="start">θ (포텐쇼미터, 선택)</text><path d="M600 60L600 175L566 175" class="ln c-k "/><polygon points="560,175 568.3,171.5 568.3,178.5" class="f-k"/><text x="606" y="150" class="s" text-anchor="start">y</text><circle cx="545" cy="175" r="13" class="box"/><line x1="538" y1="175" x2="552" y2="175" class="ln c-k "/><line x1="545" y1="168" x2="545" y2="182" class="ln c-k "/><text x="555" y="159" class="b" text-anchor="start">+</text><text x="555" y="201" class="b" text-anchor="start">−</text><text x="545" y="222" class="s b" text-anchor="middle">ref</text><line x1="545" y1="210" x2="545" y2="196" class="ln c-k "/><polygon points="545,190 548.5,198.3 541.5,198.3" class="f-k"/><line x1="532" y1="175" x2="476" y2="175" class="ln c-k "/><polygon points="470,175 478.3,171.5 478.3,178.5" class="f-k"/><text x="500" y="165" class="s" text-anchor="middle">e = y − ref</text><path d="M620 95L620 205L476 205" class="ln c-pur dash"/><polygon points="470,205 478.3,201.5 478.3,208.5" class="f-pur"/><rect x="290" y="155" width="180" height="70" rx="6" class="box"/><text x="380" y="187" class="b" text-anchor="middle">관측기</text><text x="380" y="205" class="s" text-anchor="middle">luenberger / kalman</text><line x1="290" y1="190" x2="216" y2="190" class="ln c-k "/><polygon points="210,190 218.3,186.5 218.3,193.5" class="f-k"/><text x="250" y="180" class="b" text-anchor="middle">x̂</text><text x="250" y="210" class="xs" text-anchor="middle">[ê, dê/dt, θ̂]</text><rect x="120" y="165" width="90" height="50" rx="6" class="box"/><text x="165" y="187" class="b" text-anchor="middle">−K</text><text x="165" y="205" class="s" text-anchor="middle">상태 게인</text><path d="M165 165L165 75L324 75" class="ln c-k "/><polygon points="330,75 321.7,78.5 321.7,71.5" class="f-k"/><text x="170" y="52" class="s b" text-anchor="start">u = −k<tspan dy="0.35em" font-size="72%">1</tspan><tspan dy="-0.35em">ê − k</tspan><tspan dy="0.35em" font-size="72%">2</tspan><tspan dy="-0.35em">(dê/dt) − k</tspan><tspan dy="0.35em" font-size="72%">3</tspan><tspan dy="-0.35em">θ̂</tspan></text><path d="M260 75L260 130L380 130L380 149" class="ln c-k thin"/><polygon points="380,155 376.5,146.7 383.5,146.7" class="f-k"/><text x="270" y="124" class="xs" text-anchor="start">u도 관측기 입력</text><text x="20" y="270" class="s" text-anchor="start">K는 Q(오차를 싫어하는 정도)와 R(서보를 움직이는 것을 싫어하는 정도)로 정한다 (리카티 방정식)</text><text x="20" y="290" class="s" text-anchor="start">초음파는 위치만 잰다 → 속도는 관측기가 추정. θ는 개조한 포텐쇼미터로 직접 잴 수 있다.</text>
</svg>
