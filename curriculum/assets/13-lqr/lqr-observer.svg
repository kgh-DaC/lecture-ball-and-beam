<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d">
<title id="t">LQR 상태 피드백과 관측기</title>
<desc id="d">서보와 빔·공의 출력 중 초음파로 잰 위치 y에서 ref를 뺀 e와, 서보 명령 u가 관측기로 들어가 상태 (e, de/dt, θ)의 추정값을 만들고, 상태 게인 −K를 곱해 u를 만든다. 서보 각 θ는 포텐쇼미터로 직접 잴 수도 있다(주황 점선).</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="799" height="339" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="28" class="b" text-anchor="start">LQR 상태 피드백과 관측기</text><rect x="330" y="50" width="190" height="62" rx="6" class="bx-grn"/><text x="425" y="78" class="b" text-anchor="middle">서보 + 빔·공</text><text x="425" y="96" class="s" text-anchor="middle">상태 x = [e, de/dt, θ]</text><line x1="520" y1="70" x2="634" y2="70" class="ln c-pur "/><polygon points="640,70 631.7,73.5 631.7,66.5" class="f-pur"/><text x="648" y="75" class="s b f-pur" text-anchor="start">y (초음파)</text><path d="M520 96L600 96L600 128L634 128" class="ln c-org dash"/><polygon points="640,128 631.7,131.5 631.7,124.5" class="f-org"/><text x="648" y="133" class="s b f-org" text-anchor="start">θ (포텐쇼미터,</text><text x="648" y="151" class="xs f-org" text-anchor="start">켜면 측정값 사용)</text><circle cx="575" cy="200" r="13" class="box"/><line x1="568" y1="200" x2="582" y2="200" class="ln c-k "/><line x1="575" y1="193" x2="575" y2="207" class="ln c-k "/><text x="585" y="184" class="b" text-anchor="start">+</text><text x="585" y="226" class="b" text-anchor="start">−</text><path d="M575 70L575 181" class="ln c-pur "/><polygon points="575,187 571.5,178.7 578.5,178.7" class="f-pur"/><text x="560" y="250" class="s b" text-anchor="middle">ref</text><path d="M575 245L575 219" class="ln c-k "/><polygon points="575,213 578.5,221.3 571.5,221.3" class="f-k"/><line x1="562" y1="200" x2="438" y2="200" class="ln c-pur "/><polygon points="432,200 440.3,196.5 440.3,203.5" class="f-pur"/><text x="497" y="192" class="xs b f-pur" text-anchor="middle">e = y − ref</text><rect x="252" y="172" width="180" height="58" rx="6" class="bx-pur"/><text x="342" y="198" class="b" text-anchor="middle">관측기</text><text x="342" y="216" class="s" text-anchor="middle">Luenberger / 칼만 / 차분</text><path d="M620 128L620 270L342 270L342 238" class="ln c-org dash"/><polygon points="342,232 345.5,240.3 338.5,240.3" class="f-org"/><path d="M270 81L270 150L300 150L300 164" class="ln c-blue "/><polygon points="300,170 296.5,161.7 303.5,161.7" class="f-blue"/><text x="306" y="156" class="xs f-blue" text-anchor="start">u도 관측기 입력</text><line x1="252" y1="200" x2="196" y2="200" class="ln c-k "/><polygon points="190,200 198.3,196.5 198.3,203.5" class="f-k"/><text x="221" y="190" class="s b" text-anchor="middle">추정 x</text><text x="221" y="220" class="xs" text-anchor="middle">(e, de/dt, θ)</text><rect x="60" y="172" width="130" height="58" rx="6" class="bx-blue"/><text x="125" y="198" class="b" text-anchor="middle">−K</text><text x="125" y="216" class="s" text-anchor="middle">상태 게인 (dlqr)</text><path d="M125 172L125 81L322 81" class="ln c-blue "/><polygon points="328,81 319.7,84.5 319.7,77.5" class="f-blue"/><text x="132" y="70" class="s b f-blue" text-anchor="start">u = −K·(추정 x)</text><text x="20" y="284" class="s b f-blue" text-anchor="start">u = −k<tspan dy="0.35em" font-size="72%">1</tspan><tspan dy="-0.35em">e − k</tspan><tspan dy="0.35em" font-size="72%">2</tspan><tspan dy="-0.35em">(de/dt) − k</tspan><tspan dy="0.35em" font-size="72%">3</tspan><tspan dy="-0.35em">θ (모두 추정값).</tspan></text><text x="20" y="304" class="s" text-anchor="start">K는 Q(상태가 벗어나는 것에 대한 벌점)와 R(서보를 쓰는 것에 대한 벌점)로 정한다(이산 리카티 방정식, 60 ms).</text><text x="20" y="324" class="s" text-anchor="start">초음파는 위치만 잰다 → 속도는 관측기가 추정한다. θ는 개조한 포텐쇼미터로 직접 잴 수 있다(주황 점선).</text>
</svg>
