<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" width="800" height="344" role="img" aria-labelledby="t d">
<title id="t">Q와 R의 트레이드오프</title>
<desc id="d">r을 1에서 100까지 바꾸며 계산한 LQR 해의 제어 노력(u_rms)과 추종 오차(ITAE). r을 키우면 서보를 덜 쓰는 대신 오차가 커지고, 줄이면 반대가 된다. 06장 PD(1.0, 1.5)는 u_rms 1.12°, ITAE 107로 같은 노력의 LQR보다 오차가 크다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="799" height="343" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="80" y="28" class="b" text-anchor="start">Q와 R의 트레이드오프: r을 바꾸며 계산한 LQR 해 [시뮬레이션]</text><line x1="80" y1="298" x2="540" y2="298" class="ln c-m thin dot"/><line x1="80" y1="218" x2="540" y2="218" class="ln c-m thin dot"/><line x1="80" y1="138" x2="540" y2="138" class="ln c-m thin dot"/><line x1="80" y1="58" x2="540" y2="58" class="ln c-m thin dot"/><line x1="80" y1="298" x2="548" y2="298" class="ln c-k "/><polygon points="554,298 545.7,301.5 545.7,294.5" class="f-k"/><line x1="80" y1="298" x2="80" y2="52" class="ln c-k "/><polygon points="80,46 83.5,54.3 76.5,54.3" class="f-k"/><line x1="128.4" y1="298" x2="128.4" y2="303" class="ln c-k "/><text x="128.4" y="317" class="s" text-anchor="middle">1.0</text><line x1="225.3" y1="298" x2="225.3" y2="303" class="ln c-k "/><text x="225.3" y="317" class="s" text-anchor="middle">1.2</text><line x1="322.1" y1="298" x2="322.1" y2="303" class="ln c-k "/><text x="322.1" y="317" class="s" text-anchor="middle">1.4</text><line x1="418.9" y1="298" x2="418.9" y2="303" class="ln c-k "/><text x="418.9" y="317" class="s" text-anchor="middle">1.6</text><line x1="515.8" y1="298" x2="515.8" y2="303" class="ln c-k "/><text x="515.8" y="317" class="s" text-anchor="middle">1.8</text><line x1="75" y1="298" x2="80" y2="298" class="ln c-k "/><text x="72" y="302" class="s" text-anchor="end">0</text><line x1="75" y1="218" x2="80" y2="218" class="ln c-k "/><text x="72" y="222" class="s" text-anchor="end">40</text><line x1="75" y1="138" x2="80" y2="138" class="ln c-k "/><text x="72" y="142" class="s" text-anchor="end">80</text><line x1="75" y1="58" x2="80" y2="58" class="ln c-k "/><text x="72" y="62" class="s" text-anchor="end">120</text><text x="544" y="334" class="s" text-anchor="end">제어 노력 u<tspan dy="0.35em" font-size="72%">rms</tspan><tspan dy="-0.35em"> (°)</tspan></text><text x="86" y="42" class="s" text-anchor="start">추종 오차 ITAE (mm·s²)</text><path d="M495.9 208.3L480.3 207.1L457.5 205.1L429.6 202.4L390.8 198L320.7 188.1L271.4 179.3L178.2 157.2L107.7 133.5" class="ln c-blue thick"/><circle cx="495.9" cy="208.3" r="4" class="f-m"/><circle cx="480.3" cy="207.1" r="4" class="f-m"/><circle cx="457.5" cy="205.1" r="6" class="f-blue"/><circle cx="429.6" cy="202.4" r="4" class="f-m"/><circle cx="390.8" cy="198" r="6" class="f-blue"/><circle cx="320.7" cy="188.1" r="4" class="f-m"/><circle cx="271.4" cy="179.3" r="6" class="f-blue"/><circle cx="178.2" cy="157.2" r="4" class="f-m"/><circle cx="107.7" cy="133.5" r="4" class="f-m"/><text x="501.9" y="196.3" class="xs b f-blue" text-anchor="start">r = 1</text><text x="457.5" y="193.1" class="xs b f-blue" text-anchor="middle">r = 3.65</text><text x="390.8" y="186" class="xs b f-blue" text-anchor="middle">r = 10</text><text x="271.4" y="167.3" class="xs b f-blue" text-anchor="middle">r = 30</text><text x="107.7" y="121.5" class="xs b f-blue" text-anchor="middle">r = 100</text><circle cx="187.5" cy="83.5" r="6" class="f-red"/><text x="197.5" y="87.5" class="xs b f-red" text-anchor="start">06장 PD (1.0, 1.5)</text><text x="570" y="82" class="s b" text-anchor="start">r을 키우면(왼쪽 위로)</text><text x="570" y="100" class="s" text-anchor="start">서보를 덜 쓰고 느려진다</text><text x="570" y="136" class="s b" text-anchor="start">r을 줄이면(오른쪽 아래로)</text><text x="570" y="154" class="s" text-anchor="start">빠르지만 서보를 많이 쓴다</text><rect x="562" y="180" width="214" height="78" rx="8" class="bx-red"/><text x="572" y="202" class="xs" text-anchor="start">06장 PD: u<tspan dy="0.35em" font-size="72%">rms</tspan><tspan dy="-0.35em"> 1.12°,</tspan></text><text x="572" y="220" class="xs" text-anchor="start">ITAE 107</text><text x="572" y="240" class="xs b f-red" text-anchor="start">곡선보다 위(같은 노력에 더 큰 오차)</text><text x="570" y="290" class="xs f-m" text-anchor="start">q<tspan dy="0.35em" font-size="72%">e</tspan><tspan dy="-0.35em"> 400, q</tspan><tspan dy="0.35em" font-size="72%">ė</tspan><tspan dy="-0.35em"> 25, q</tspan><tspan dy="0.35em" font-size="72%">θ</tspan><tspan dy="-0.35em"> 33, Luenberger,</tspan></text><text x="570" y="304" class="xs f-m" text-anchor="start">잡음 없음, 150 → 200 mm</text>
