<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 358" width="680" height="358" role="img" aria-labelledby="t d">
<title id="t">Q와 R의 트레이드오프 개념도</title>
<desc id="d">가로축 제어 노력, 세로축 추종 오차인 평면에서 LQR 해들이 이루는 곡선. R을 키우면 서보를 아끼지만 느려지고, Q를 키우면 빠르지만 서보를 많이 쓴다. Q와 R의 비율이 곡선 위 위치를 정한다.</desc>
