<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 412" width="700" height="412" role="img" aria-labelledby="t d">
<title id="t">아두이노 핀과 볼앤빔 부품 대응</title>
<desc id="d">가운데 Arduino Nano. 왼쪽: USB(D0·D1) 시리얼 통신 → PC·웹 앱, D13 디지털 출력 → 내장 LED, A0 아날로그 입력(ADC) → 서보 포텐쇼미터. 오른쪽: D6·D7 디지털 출력·입력과 시간 재기 → HC-SR04 초음파 센서, D9 타이머·PWM → 서보모터, 인터럽트는 개념만(이 교재 펌웨어는 쓰지 않음).</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="699" height="411" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="270" y="70" width="160" height="300" rx="10" class="box"/><text x="350" y="200" class="b" text-anchor="middle">Arduino Nano</text><text x="350" y="220" class="s" text-anchor="middle">(ATmega328P,</text><text x="350" y="236" class="s" text-anchor="middle">Uno와 같은 칩)</text><circle cx="270" cy="105" r="4.5" class="f-k"/><text x="278" y="109" class="xs b" text-anchor="start">USB (D0·D1)</text><line x1="270" y1="105" x2="230" y2="105" class="ln c-blue "/><rect x="20" y="81" width="210" height="58" rx="6" class="box"/><text x="30" y="99" class="b" text-anchor="start">PC · 웹 앱</text><text x="30" y="117" class="s" text-anchor="start">시리얼 통신</text><text x="30" y="133" class="xs f-m" text-anchor="start">명령 받기, 측정값 보내기</text><circle cx="270" cy="175" r="4.5" class="f-k"/><text x="278" y="179" class="xs b" text-anchor="start">D13</text><line x1="270" y1="175" x2="230" y2="175" class="ln c-grn dot"/><rect x="20" y="151" width="210" height="58" rx="6" class="box"/><text x="30" y="169" class="b" text-anchor="start">내장 LED</text><text x="30" y="187" class="s" text-anchor="start">디지털 출력</text><text x="30" y="203" class="xs f-m" text-anchor="start">Blink 실습(①)</text><circle cx="270" cy="245" r="4.5" class="f-k"/><text x="278" y="249" class="xs b" text-anchor="start">A0</text><line x1="270" y1="245" x2="230" y2="245" class="ln c-pur dash"/><rect x="20" y="221" width="210" height="58" rx="6" class="box"/><text x="30" y="239" class="b" text-anchor="start">서보 포텐쇼미터</text><text x="30" y="257" class="s" text-anchor="start">아날로그 입력(ADC)</text><text x="30" y="273" class="xs f-m" text-anchor="start">혼 각도 0~1023 (개조, 02장 7절)</text><circle cx="430" cy="105" r="4.5" class="f-k"/><text x="422" y="109" class="xs b" text-anchor="end">D6 / D7</text><line x1="430" y1="105" x2="470" y2="105" class="ln c-org "/><rect x="470" y="81" width="210" height="58" rx="6" class="box"/><text x="480" y="99" class="b" text-anchor="start">HC-SR04</text><text x="480" y="117" class="s" text-anchor="start">디지털 출력·입력 + 시간 재기</text><text x="480" y="133" class="xs f-m" text-anchor="start">Trig 출력, Echo 펄스 폭(pulseIn)</text><circle cx="430" cy="210" r="4.5" class="f-k"/><text x="422" y="214" class="xs b" text-anchor="end">D9</text><line x1="430" y1="210" x2="470" y2="210" class="ln c-red thick"/><rect x="470" y="186" width="210" height="58" rx="6" class="box"/><text x="480" y="204" class="b" text-anchor="start">서보모터</text><text x="480" y="222" class="s" text-anchor="start">타이머 · PWM 펄스</text><text x="480" y="238" class="xs f-m" text-anchor="start">20 ms마다 0.5~2.4 ms 펄스</text><circle cx="430" cy="310" r="4.5" class="f-k"/><text x="422" y="314" class="xs b" text-anchor="end"></text><line x1="430" y1="310" x2="470" y2="310" class="ln c-m dot"/><rect x="470" y="286" width="210" height="58" rx="6" class="box"/><text x="480" y="304" class="b" text-anchor="start">인터럽트 (개념)</text><text x="480" y="322" class="s" text-anchor="start">인터럽트</text><text x="480" y="338" class="xs f-m" text-anchor="start">이 교재 펌웨어는 쓰지 않음</text><text x="350" y="40" class="b" text-anchor="middle">마이크로컨트롤러의 다섯 가지 기능이 볼앤빔의 어느 부품을 맡는가</text><text x="350" y="398" class="xs f-m" text-anchor="middle">선 모양(실선·점선·굵은 선)과 이름으로 구분. 배선 세부와 전원은 02장 6절.</text>
</svg>
