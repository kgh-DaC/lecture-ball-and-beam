<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d">
<title id="t">PWM 듀티비와 평균 전압, 서보 펄스</title>
<desc id="d">위쪽 세 줄은 analogWrite의 네모파다. 값 51은 듀티비 20%로 평균 1 V, 값 153은 60%로 평균 3 V, 값 255는 100%로 계속 5 V이다. 한 주기는 약 2 ms이고 평균 전압을 점선으로 표시했다. 아래 줄은 서보 신호로, 20 ms마다 폭 1.5 ms의 펄스가 하나씩 오며 서보는 평균이 아니라 펄스 폭을 각도 명령(90°)으로 읽는다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="439" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="20" y="20" width="92" height="20" rx="10" class="pill-blue"/><text x="66" y="34" class="xs b w" text-anchor="middle">평균을 쓴다</text><text x="122" y="35" class="b" text-anchor="start">LED 밝기 · DC 모터 속도  (analogWrite)</text><line x1="196" y1="60" x2="276.5" y2="60" class="ln c-m thin"/><polygon points="282.5,60 274.2,63.5 274.2,56.5" class="f-m"/><polygon points="190,60 198.3,56.5 198.3,63.5" class="f-m"/><text x="290.5" y="64" class="xs f-m" text-anchor="start">한 주기 ≈ 2 ms (초당 약 490번)</text><text x="20" y="88" class="s b" text-anchor="start">analogWrite(핀, 51)</text><text x="20" y="106" class="s" text-anchor="start">듀티비 20%</text><line x1="190" y1="116" x2="560" y2="116" class="ln c-m thin dot"/><text x="182" y="76" class="xs f-m" text-anchor="end">5 V</text><text x="182" y="120" class="xs f-m" text-anchor="end">0 V</text><path d="M190 116L190 116L190 72L208.5 72L208.5 116L282.5 116L282.5 116L282.5 72L301 72L301 116L375 116L375 116L375 72L393.5 72L393.5 116L467.5 116L467.5 116L467.5 72L486 72L486 116L560 116" class="ln c-blue "/><line x1="190" y1="107.2" x2="570" y2="107.2" class="ln c-org dash"/><text x="578" y="88" class="b f-org" text-anchor="start">평균 1 V</text><text x="578" y="106" class="s" text-anchor="start">아주 어두움</text><text x="20" y="166" class="s b" text-anchor="start">analogWrite(핀, 153)</text><text x="20" y="184" class="s" text-anchor="start">듀티비 60%</text><line x1="190" y1="194" x2="560" y2="194" class="ln c-m thin dot"/><text x="182" y="154" class="xs f-m" text-anchor="end">5 V</text><text x="182" y="198" class="xs f-m" text-anchor="end">0 V</text><path d="M190 194L190 194L190 150L245.5 150L245.5 194L282.5 194L282.5 194L282.5 150L338 150L338 194L375 194L375 194L375 150L430.5 150L430.5 194L467.5 194L467.5 194L467.5 150L523 150L523 194L560 194" class="ln c-blue "/><line x1="190" y1="167.6" x2="570" y2="167.6" class="ln c-org dash"/><text x="578" y="166" class="b f-org" text-anchor="start">평균 3 V</text><text x="578" y="184" class="s" text-anchor="start">밝음</text><text x="20" y="244" class="s b" text-anchor="start">analogWrite(핀, 255)</text><text x="20" y="262" class="s" text-anchor="start">듀티비 100%</text><line x1="190" y1="272" x2="560" y2="272" class="ln c-m thin dot"/><text x="182" y="232" class="xs f-m" text-anchor="end">5 V</text><text x="182" y="276" class="xs f-m" text-anchor="end">0 V</text><path d="M190 272L190 228L282.5 228L282.5 228L375 228L375 228L467.5 228L467.5 228L560 228" class="ln c-blue "/><line x1="190" y1="228" x2="570" y2="228" class="ln c-org dash"/><text x="578" y="244" class="b f-org" text-anchor="start">평균 5 V</text><text x="578" y="262" class="s" text-anchor="start">최대</text><line x1="20" y1="296" x2="740" y2="296" class="ln c-m thin dash"/><rect x="20" y="312" width="92" height="20" rx="10" class="pill-red"/><text x="66" y="326" class="xs b w" text-anchor="middle">폭을 읽는다</text><text x="122" y="327" class="b" text-anchor="start">서보 각도  (Servo 라이브러리)</text><text x="20" y="368" class="s b" text-anchor="start">Servo.write(90)</text><text x="20" y="386" class="s" text-anchor="start">20 ms마다 펄스 하나</text><line x1="190" y1="392" x2="560" y2="392" class="ln c-m thin dot"/><text x="182" y="356" class="xs f-m" text-anchor="end">5 V</text><text x="182" y="396" class="xs f-m" text-anchor="end">0 V</text><path d="M190 392L190 352L203.9 352L203.9 392L375 392L375 352L388.9 352L388.9 392L560 392" class="ln c-red "/><line x1="196" y1="408" x2="369" y2="408" class="ln c-m thin"/><polygon points="375,408 366.7,411.5 366.7,404.5" class="f-m"/><polygon points="190,408 198.3,404.5 198.3,411.5" class="f-m"/><text x="282.5" y="424" class="xs f-m" text-anchor="middle">주기 20 ms</text><line x1="207.9" y1="362" x2="243.9" y2="362" class="ln c-red thin"/><text x="247.9" y="366" class="xs b f-red" text-anchor="start">폭 1.5 ms</text><text x="578" y="368" class="b f-red" text-anchor="start">폭 1.5 ms → 90°</text><text x="578" y="386" class="s" text-anchor="start">평균이 아니라 폭</text>
</svg>
