<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t d">
<title id="t">ADC 전압과 숫자의 대응</title>
<desc id="d">0 V에서 5 V까지의 전압 막대와 그 아래 analogRead 값의 눈금. 0 V는 0, 1.25 V는 256, 2.5 V는 512, 3.75 V는 768, 5 V는 1023에 대응한다. 한 단계는 5 V를 1024로 나눈 약 4.9 mV이고, 서보 포텐쇼미터에서는 서보각 약 0.33°에 해당한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="719" height="251" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="350" y="34" class="b" text-anchor="middle">10비트 ADC: 0~5 V를 1024 단계로 나눠 숫자로 읽는다</text><text x="104" y="86" class="s b" text-anchor="end">A0 전압</text><text x="104" y="148" class="s b" text-anchor="end">analogRead</text><rect x="130" y="96" width="540" height="26" rx="4" class="bx-pur"/><line x1="146.9" y1="100" x2="146.9" y2="118" class="ln c-pur thin"/><line x1="163.8" y1="100" x2="163.8" y2="118" class="ln c-pur thin"/><line x1="180.6" y1="100" x2="180.6" y2="118" class="ln c-pur thin"/><line x1="197.5" y1="100" x2="197.5" y2="118" class="ln c-pur thin"/><line x1="214.4" y1="100" x2="214.4" y2="118" class="ln c-pur thin"/><line x1="231.3" y1="100" x2="231.3" y2="118" class="ln c-pur thin"/><line x1="248.1" y1="100" x2="248.1" y2="118" class="ln c-pur thin"/><line x1="265" y1="100" x2="265" y2="118" class="ln c-pur thin"/><line x1="281.9" y1="100" x2="281.9" y2="118" class="ln c-pur thin"/><line x1="298.8" y1="100" x2="298.8" y2="118" class="ln c-pur thin"/><line x1="315.6" y1="100" x2="315.6" y2="118" class="ln c-pur thin"/><line x1="332.5" y1="100" x2="332.5" y2="118" class="ln c-pur thin"/><line x1="349.4" y1="100" x2="349.4" y2="118" class="ln c-pur thin"/><line x1="366.3" y1="100" x2="366.3" y2="118" class="ln c-pur thin"/><line x1="383.1" y1="100" x2="383.1" y2="118" class="ln c-pur thin"/><line x1="400" y1="100" x2="400" y2="118" class="ln c-pur thin"/><line x1="416.9" y1="100" x2="416.9" y2="118" class="ln c-pur thin"/><line x1="433.8" y1="100" x2="433.8" y2="118" class="ln c-pur thin"/><line x1="450.6" y1="100" x2="450.6" y2="118" class="ln c-pur thin"/><line x1="467.5" y1="100" x2="467.5" y2="118" class="ln c-pur thin"/><line x1="484.4" y1="100" x2="484.4" y2="118" class="ln c-pur thin"/><line x1="501.3" y1="100" x2="501.3" y2="118" class="ln c-pur thin"/><line x1="518.1" y1="100" x2="518.1" y2="118" class="ln c-pur thin"/><line x1="535" y1="100" x2="535" y2="118" class="ln c-pur thin"/><line x1="551.9" y1="100" x2="551.9" y2="118" class="ln c-pur thin"/><line x1="568.8" y1="100" x2="568.8" y2="118" class="ln c-pur thin"/><line x1="585.6" y1="100" x2="585.6" y2="118" class="ln c-pur thin"/><line x1="602.5" y1="100" x2="602.5" y2="118" class="ln c-pur thin"/><line x1="619.4" y1="100" x2="619.4" y2="118" class="ln c-pur thin"/><line x1="636.3" y1="100" x2="636.3" y2="118" class="ln c-pur thin"/><line x1="653.1" y1="100" x2="653.1" y2="118" class="ln c-pur thin"/><line x1="130" y1="88" x2="130" y2="96" class="ln c-k thin"/><text x="130" y="82" class="s" text-anchor="middle">0 V</text><line x1="130" y1="122" x2="130" y2="130" class="ln c-k thin"/><text x="130" y="148" class="s b f-pur" text-anchor="middle">0</text><line x1="265" y1="88" x2="265" y2="96" class="ln c-k thin"/><text x="265" y="82" class="s" text-anchor="middle">1.25 V</text><line x1="265" y1="122" x2="265" y2="130" class="ln c-k thin"/><text x="265" y="148" class="s b f-pur" text-anchor="middle">256</text><line x1="400" y1="88" x2="400" y2="96" class="ln c-k thin"/><text x="400" y="82" class="s" text-anchor="middle">2.5 V</text><line x1="400" y1="122" x2="400" y2="130" class="ln c-k thin"/><text x="400" y="148" class="s b f-pur" text-anchor="middle">512</text><line x1="535" y1="88" x2="535" y2="96" class="ln c-k thin"/><text x="535" y="82" class="s" text-anchor="middle">3.75 V</text><line x1="535" y1="122" x2="535" y2="130" class="ln c-k thin"/><text x="535" y="148" class="s b f-pur" text-anchor="middle">768</text><line x1="670" y1="88" x2="670" y2="96" class="ln c-k thin"/><text x="670" y="82" class="s" text-anchor="middle">5 V</text><line x1="670" y1="122" x2="670" y2="130" class="ln c-k thin"/><text x="670" y="148" class="s b f-pur" text-anchor="middle">1023</text><rect x="60" y="174" width="600" height="62" rx="8" class="panel"/><text x="360" y="198" class="b" text-anchor="middle">한 단계 = 5 V ÷ 1024 ≈ 4.9 mV</text><text x="360" y="222" class="s" text-anchor="middle">포텐쇼미터가 약 2.99단계/° [실측]이므로, 한 단계 ≈ 서보각 0.33° (이보다 잘게는 못 본다)</text>
</svg>
