<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">블루투스 모듈 연결: D0·D1 충돌과 SoftwareSerial</title>
<desc id="d">왼쪽은 블루투스 모듈을 D0·D1에 꽂은 경우로, PC의 USB 통신과 블루투스 모듈이 하나뿐인 하드웨어 시리얼을 같이 써서 업로드 실패, 데이터 섞임, 속도 불일치가 생긴다. 오른쪽은 해결책으로, PC는 Serial(D0·D1, 115200 baud)에 그대로 두고 블루투스 모듈은 SoftwareSerial로 D2·D3에 9600 baud로 따로 연결한다. 다만 서보 펄스가 흔들릴 수 있어 이 교재는 USB 유선을 쓴다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="329" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="12" y="12" width="360" height="306" rx="10" class="panel"/><rect x="27" y="24" width="50" height="20" rx="10" class="pill-red"/><text x="52" y="38" class="xs b w" text-anchor="middle">충돌</text><text x="86" y="39" class="b" text-anchor="start">블루투스를 D0·D1에 꽂으면</text><rect x="28" y="110" width="84" height="50" rx="6" class="bx-blue"/><text x="70" y="132" class="b" text-anchor="middle">PC</text><text x="70" y="150" class="s" text-anchor="middle">USB</text><rect x="152" y="76" width="96" height="118" rx="8" class="box"/><text x="200" y="100" class="b" text-anchor="middle">Nano</text><rect x="288" y="110" width="70" height="50" rx="6" class="bx-red"/><text x="323" y="132" class="b" text-anchor="middle">BT</text><text x="323" y="150" class="s" text-anchor="middle">모듈</text><line x1="118" y1="135" x2="146" y2="135" class="ln c-blue "/><polygon points="152,135 143.7,138.5 143.7,131.5" class="f-blue"/><polygon points="112,135 120.3,131.5 120.3,138.5" class="f-blue"/><line x1="254" y1="135" x2="282" y2="135" class="ln c-red "/><polygon points="288,135 279.7,138.5 279.7,131.5" class="f-red"/><polygon points="248,135 256.3,131.5 256.3,138.5" class="f-red"/><rect x="158" y="118" width="84" height="34" rx="5" class="bx-red"/><text x="200" y="132" class="s b" text-anchor="middle">Serial</text><text x="200" y="146" class="xs" text-anchor="middle">D0 · D1</text><text x="200" y="176" class="xs f-red" text-anchor="middle">하나뿐인 선을</text><text x="200" y="189" class="xs f-red" text-anchor="middle">둘이 같이 씀</text><text x="30" y="232" class="s" text-anchor="start">✗ 업로드 실패 (업로드 때마다 선을 빼야 함)</text><text x="30" y="256" class="s" text-anchor="start">✗ USB 데이터와 블루투스 데이터가 섞임</text><text x="30" y="280" class="s" text-anchor="start">✗ 속도는 하나만: 9600 과 115200 을 못 맞춤</text><rect x="388" y="12" width="360" height="306" rx="10" class="panel"/><rect x="403" y="24" width="50" height="20" rx="10" class="pill-grn"/><text x="428" y="38" class="xs b w" text-anchor="middle">해결</text><text x="462" y="39" class="b" text-anchor="start">SoftwareSerial로 D2·D3에 따로</text><rect x="404" y="110" width="84" height="50" rx="6" class="bx-blue"/><text x="446" y="132" class="b" text-anchor="middle">PC</text><text x="446" y="150" class="s" text-anchor="middle">USB</text><rect x="528" y="76" width="96" height="118" rx="8" class="box"/><text x="576" y="100" class="b" text-anchor="middle">Nano</text><rect x="664" y="110" width="70" height="50" rx="6" class="bx-grn"/><text x="699" y="132" class="b" text-anchor="middle">BT</text><text x="699" y="150" class="s" text-anchor="middle">모듈</text><rect x="534" y="108" width="84" height="30" rx="5" class="bx-blue"/><text x="576" y="121" class="xs b" text-anchor="middle">Serial</text><text x="576" y="133" class="xs" text-anchor="middle">D0·D1</text><rect x="534" y="148" width="84" height="30" rx="5" class="bx-grn"/><text x="576" y="161" class="xs b" text-anchor="middle">SoftwareSerial</text><text x="576" y="173" class="xs" text-anchor="middle">D2·D3</text><path d="M488 123L522 123" class="ln c-blue "/><polygon points="528,123 519.7,126.5 519.7,119.5" class="f-blue"/><path d="M664 150L644 150L644 163L630 163" class="ln c-grn "/><polygon points="624,163 632.3,159.5 632.3,166.5" class="f-grn"/><text x="506" y="142" class="xs f-blue" text-anchor="middle">115200</text><text x="650" y="190" class="xs f-grn" text-anchor="middle">9600</text><text x="406" y="232" class="s" text-anchor="start">✓ PC와의 USB 통신은 Serial 그대로</text><text x="406" y="256" class="s" text-anchor="start">✓ 블루투스는 자기 속도(9600 baud)로 따로</text><text x="406" y="280" class="s" text-anchor="start">△ 서보 펄스가 흔들릴 수 있음 → 교재는 USB 유선</text>
</svg>
