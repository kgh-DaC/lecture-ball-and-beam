<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="t d">
<title id="t">펌웨어와 웹 앱이 주고받는 것</title>
<desc id="d">왼쪽 Arduino 펌웨어는 센서를 읽어(실습 ⑤) 측정값 한 줄을 보내고(실습 ②), 명령을 받아(실습 ⑥) 서보를 구동한다(실습 ④). 오른쪽 웹 앱은 측정값을 받아 제어 법칙을 계산하고 각도 명령을 만들어 한 줄로 보내며, 그래프와 기록도 맡는다. 둘은 USB 시리얼 115200 baud로 이어져 있고 이 왕복이 60 ms마다 한 번 돈다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="289" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="20" y="46" width="300" height="190" rx="10" class="panel"/><text x="35" y="72" class="b" text-anchor="start">Arduino (펌웨어)</text><rect x="440" y="46" width="300" height="190" rx="10" class="panel"/><text x="455" y="72" class="b" text-anchor="start">웹 앱 (브라우저)</text><rect x="35" y="90" width="125" height="40" rx="6" class="bx-pur"/><text x="97.5" y="115" class="b" text-anchor="middle">센서 읽기 ⑤</text><line x1="160" y1="110" x2="174" y2="110" class="ln c-k "/><polygon points="180,110 171.7,113.5 171.7,106.5" class="f-k"/><rect x="180" y="90" width="125" height="40" rx="6" class="bx-blue"/><text x="242.5" y="115" class="b" text-anchor="middle">한 줄 보내기 ②</text><rect x="180" y="170" width="125" height="40" rx="6" class="bx-blue"/><text x="242.5" y="195" class="b" text-anchor="middle">명령 받기 ⑥</text><line x1="180" y1="190" x2="166" y2="190" class="ln c-k "/><polygon points="160,190 168.3,186.5 168.3,193.5" class="f-k"/><rect x="35" y="170" width="125" height="40" rx="6" class="bx-org"/><text x="97.5" y="195" class="b" text-anchor="middle">서보 구동 ④</text><rect x="455" y="90" width="125" height="40" rx="6" class="bx-blue"/><text x="517.5" y="115" class="b" text-anchor="middle">측정값 받기</text><line x1="580" y1="110" x2="594" y2="110" class="ln c-k "/><polygon points="600,110 591.7,113.5 591.7,106.5" class="f-k"/><rect x="600" y="90" width="125" height="40" rx="6" class="bx-grn"/><text x="662.5" y="115" class="b" text-anchor="middle">제어 법칙 계산</text><line x1="662" y1="130" x2="662" y2="164" class="ln c-k "/><polygon points="662,170 658.5,161.7 665.5,161.7" class="f-k"/><rect x="600" y="170" width="125" height="40" rx="6" class="bx-grn"/><text x="662.5" y="195" class="b" text-anchor="middle">각도 명령 만들기</text><line x1="600" y1="190" x2="586" y2="190" class="ln c-k "/><polygon points="580,190 588.3,186.5 588.3,193.5" class="f-k"/><rect x="455" y="170" width="125" height="40" rx="6" class="bx-blue"/><text x="517.5" y="195" class="b" text-anchor="middle">한 줄 보내기</text><line x1="305" y1="110" x2="449" y2="110" class="ln c-blue thick"/><polygon points="455,110 446.7,113.5 446.7,106.5" class="f-blue"/><text x="380" y="98" class="s b f-blue" text-anchor="middle">측정값 한 줄</text><line x1="455" y1="190" x2="311" y2="190" class="ln c-blue thick"/><polygon points="305,190 313.3,186.5 313.3,193.5" class="f-blue"/><text x="380" y="210" class="s b f-blue" text-anchor="middle">각도 명령 한 줄</text><text x="380" y="146" class="xs f-m" text-anchor="middle">USB 시리얼</text><text x="380" y="160" class="xs f-m" text-anchor="middle">115200 baud</text><text x="590" y="226" class="xs f-m" text-anchor="middle">그래프 · 기록도 여기서</text><text x="380" y="268" class="s" text-anchor="middle">이 왕복이 60 ms마다 한 번 돈다: 01장 블록선도의 되먹임 루프가 실제로 도는 모습</text>
</svg>
