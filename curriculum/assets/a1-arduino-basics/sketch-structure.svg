<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 334" width="700" height="334" role="img" aria-labelledby="t d">
<title id="t">아두이노 스케치 구조</title>
<desc id="d">스케치는 전처리(라이브러리 포함, 상수), 전원을 켜면 한 번 실행되는 setup(), 끝없이 반복되는 loop()로 이루어진다. 오른쪽: loop() 한 번은 센서 읽기 → 계산 → 명령 쓰기 → 보고하기의 제어 한 주기이며, delay()보다 millis()로 주기를 지키는 것이 좋다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="699" height="333" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="30" y="40" width="210" height="56" rx="6" class="bx-m"/><text x="135" y="65" class="b" text-anchor="middle">전처리</text><text x="135" y="83" class="s" text-anchor="middle">#include &lt;Servo.h&gt;, 상수</text><line x1="135" y1="96" x2="135" y2="124" class="ln c-k "/><polygon points="135,130 131.5,121.7 138.5,121.7" class="f-k"/><rect x="30" y="130" width="210" height="56" rx="6" class="bx-org"/><text x="135" y="155" class="b" text-anchor="middle">setup()</text><text x="135" y="173" class="s" text-anchor="middle">전원 켜면 한 번: 핀·통신 설정</text><line x1="135" y1="186" x2="135" y2="214" class="ln c-k "/><polygon points="135,220 131.5,211.7 138.5,211.7" class="f-k"/><rect x="30" y="220" width="210" height="56" rx="6" class="bx-blue"/><text x="135" y="245" class="b" text-anchor="middle">loop()</text><text x="135" y="263" class="s" text-anchor="middle">끝없이 반복: 읽기 → 계산 → 쓰기</text><path d="M240 248L278 248L278 300L135 300L135 288" class="ln c-blue "/><polygon points="135,282 138.5,290.3 131.5,290.3" class="f-blue"/><text x="150" y="316" class="s f-blue" text-anchor="start">다시 처음부터</text><rect x="320" y="30" width="360" height="290" rx="10" class="panel"/><text x="338" y="58" class="b" text-anchor="start">loop() 한 번 = 제어 한 주기</text><rect x="338" y="74" width="324" height="34" rx="6" class="bx-pur"/><text x="350" y="96" class="b s" text-anchor="start">① 센서 읽기</text><text x="450" y="96" class="s" text-anchor="start">pulseIn, analogRead</text><line x1="500" y1="108" x2="500" y2="112" class="ln c-m thin"/><polygon points="500,118 496.5,109.7 503.5,109.7" class="f-m"/><rect x="338" y="118" width="324" height="34" rx="6" class="bx-blue"/><text x="350" y="140" class="b s" text-anchor="start">② 계산</text><text x="450" y="140" class="s" text-anchor="start">거리 환산, 필터, 제어 법칙</text><line x1="500" y1="152" x2="500" y2="156" class="ln c-m thin"/><polygon points="500,162 496.5,153.7 503.5,153.7" class="f-m"/><rect x="338" y="162" width="324" height="34" rx="6" class="bx-org"/><text x="350" y="184" class="b s" text-anchor="start">③ 명령 쓰기</text><text x="450" y="184" class="s" text-anchor="start">Servo.write, digitalWrite</text><line x1="500" y1="196" x2="500" y2="200" class="ln c-m thin"/><polygon points="500,206 496.5,197.7 503.5,197.7" class="f-m"/><rect x="338" y="206" width="324" height="34" rx="6" class="bx-grn"/><text x="350" y="228" class="b s" text-anchor="start">④ 보고하기</text><text x="450" y="228" class="s" text-anchor="start">Serial.print → PC</text><text x="338" y="272" class="s b" text-anchor="start">주기를 일정하게: delay()로 멈추면 그동안 아무것도 못 한다.</text><text x="338" y="294" class="s" text-anchor="start">millis()로 시간을 재며 돌린다(실습 ⑤).</text>
</svg>
