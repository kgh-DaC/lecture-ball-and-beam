<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" role="img" aria-labelledby="t d">
<title id="t">위상여유가 줄어드는 과정</title>
<desc id="d">슬라이드 48 PD의 위상여유가 줄어드는 폭포 그림. 순수 PD 61.4°, D 필터로 51.7°, 센서 필터 α = 0.2로 24.7°, 가정 서보로 15.4°, 샘플링 지연 0.03 s로 11.9°. 재설계 목표 30°에 못 미친다.</desc>
