x="405.5" y="201.1" width="72.3" height="32.1" class="f-org" fill-opacity="0.45" stroke-dasharray="4 3"/><text x="441.7" y="222.1" class="s b" text-anchor="middle">−9.0°</text><line x1="374.5" y1="201.1" x2="405.5" y2="201.1" class="ln c-m thin dot"/><text x="441.7" y="308" class="xs b" text-anchor="middle">서보 (가정)</text><rect x="508.8" y="233.2" width="72.3" height="12.1" class="f-org" fill-opacity="0.45" stroke-dasharray="4 3"/><text x="545" y="244.3" class="s b" text-anchor="middle">−3.4°</text><line x1="477.8" y1="233.2" x2="508.8" y2="233.2" class="ln c-m thin dot"/><text x="545" y="308" class="xs b" text-anchor="middle">지연 0.03 s</text><rect x="612.2" y="245.4" width="72.3" height="44.6" class="f-blue" fill-opacity="0.55"/><text x="648.3" y="239.4" class="s b" text-anchor="middle">12.5°</text><text x="648.3" y="308" class="xs b" text-anchor="middle">남은 위상여유</text><line x1="80" y1="182.9" x2="700" y2="182.9" class="ln c-grn dash"/><text x="700" y="176.9" class="s b" text-anchor="end">08장 재설계 목표 30°</text><text x="80" y="336" class="xs" text-anchor="start">슬라이드 48 PD (K<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em"> = 2.3884, K</tspan><tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em"> = 2.0684) [시뮬레이션: analysis.margins]</tspan></text><text x="80" y="352" class="xs" text-anchor="start">15.9°까지는 추가 지연 없음, 마지막 단계는 샘플링(ZOH) 지연 0.03 s 포함</text><text x="80" y="370" class="xs f-m" text-anchor="start">파란 막대 = 위상여유, 주황 점선 막대 = 그 단계에서 깎인 양. 서보는 가정값(τ = 0.06 s, T<tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em"> = 0.02 s)</tspan></text>
</svg>
