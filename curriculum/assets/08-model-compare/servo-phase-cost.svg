<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 326" width="800" height="326" role="img" aria-labelledby="t d">
<title id="t">교차주파수와 서보의 위상 지연</title>
<desc id="d">가정 서보가 깎는 위상 tan⁻¹(τω) + ωT_d를 주파수에 대해 그린 곡선. 거의 직선으로 커진다. 재설계 예, 06장 안전 기본값, 슬라이드 48 PD의 교차주파수를 점으로 표시했다. 교차주파수가 높은 설계일수록 서보가 더 큰 위상을 깎아 위상여유가 더 많이 줄어든다.</desc>
