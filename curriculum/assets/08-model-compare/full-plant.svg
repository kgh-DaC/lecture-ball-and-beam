<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 328" width="740" height="328" role="img" aria-labelledby="t d">
<title id="t">서보 포함 전체 전달함수와 극점</title>
<desc id="d">명령각 θcmd가 순수 지연 e^(−Td s)와 1차 서보 K/(τs+1)을 거쳐 실제 각 θ가 되고, 빔·공 Kb/s²가 공 위치 y를 만든다. 아래 실수축에 개루프 극점 0, 0과 가정 서보 극점 −16.7을 표시했다. 교차주파수 1~2 rad/s보다 멀지만 ω = 2 rad/s에서 위상을 약 9.1° 깎는다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="739" height="327" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="16" y="85" class="b" text-anchor="start">θ<tspan dy="0.35em" font-size="72%">cmd</tspan></text><line x1="58" y1="80" x2="104" y2="80" class="ln c-k "/><polygon points="110,80 101.7,83.5 101.7,76.5" class="f-k"/><rect x="100" y="30" width="330" height="100" rx="10" class="boxd"/><text x="265" y="24" class="s b" text-anchor="middle">G<tspan dy="0.35em" font-size="72%">servo</tspan><tspan dy="-0.35em">(s): 07장에서 식별</tspan></text><rect x="110" y="55" width="130" height="50" rx="6" class="box"/><text x="175" y="77" class="b" text-anchor="middle">exp(−T<tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em">s)</tspan></text><text x="175" y="95" class="s" text-anchor="middle">순수 지연</text><line x1="240" y1="80" x2="284" y2="80" class="ln c-k "/><polygon points="290,80 281.7,83.5 281.7,76.5" class="f-k"/><rect x="290" y="55" width="130" height="50" rx="6" class="box"/><text x="355" y="77" class="b" text-anchor="middle">K/(τs + 1)</text><text x="355" y="95" class="s" text-anchor="middle">1차 서보</text><line x1="420" y1="80" x2="484" y2="80" class="ln c-k "/><polygon points="490,80 481.7,83.5 481.7,76.5" class="f-k"/><text x="455" y="70" class="b it" text-anchor="middle">θ</text><rect x="490" y="55" width="130" height="50" rx="6" class="box"/><text x="555" y="77" class="b" text-anchor="middle">K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">/s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan></text><text x="555" y="95" class="s" text-anchor="middle">빔·공 (03장)</text><line x1="620" y1="80" x2="684" y2="80" class="ln c-k "/><polygon points="690,80 681.7,83.5 681.7,76.5" class="f-k"/><text x="698" y="85" class="b" text-anchor="start">y</text><line x1="40" y1="210" x2="714" y2="210" class="ln c-k "/><polygon points="720,210 711.7,213.5 711.7,206.5" class="f-k"/><text x="720" y="232" class="s" text-anchor="end">Re(s)</text><line x1="159" y1="206" x2="159" y2="214" class="ln c-k "/><text x="159" y="230" class="xs" text-anchor="middle">-15</text><line x1="329" y1="206" x2="329" y2="214" class="ln c-k "/><text x="329" y="230" class="xs" text-anchor="middle">-10</text><line x1="499" y1="206" x2="499" y2="214" class="ln c-k "/><text x="499" y="230" class="xs" text-anchor="middle">-5</text><line x1="669" y1="206" x2="669" y2="214" class="ln c-k "/><text x="669" y="230" class="xs" text-anchor="middle">0</text><line x1="659" y1="204" x2="671" y2="216" class="ln c-k thick"/><line x1="659" y1="216" x2="671" y2="204" class="ln c-k thick"/><line x1="667" y1="204" x2="679" y2="216" class="ln c-k thick"/><line x1="667" y1="216" x2="679" y2="204" class="ln c-k thick"/><text x="669" y="196" class="s b" text-anchor="middle">0, 0 (빔·공)</text><line x1="96.3" y1="204" x2="108.3" y2="216" class="ln c-org thick"/><line x1="96.3" y1="216" x2="108.3" y2="204" class="ln c-org thick"/><text x="102.3" y="196" class="s b" text-anchor="middle">−1/τ = −16.7 (가정 서보)</text><rect x="601" y="236" width="34" height="10" class="f-grn" fill-opacity="0.5"/><text x="595" y="246" class="xs" text-anchor="end">교차주파수 크기 ≈ 1~2 rad/s</text><text x="40" y="290" class="s b" text-anchor="start">멀리 있는 극점과 지연도 ω = 2 rad/s에서 위상을 tan<tspan dy="-0.45em" font-size="72%">−1</tspan><tspan dy="0.45em">(τω) + ωT</tspan><tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em"> ≈ 9.1° 깎는다 [가정]</tspan></text><text x="40" y="312" class="s" text-anchor="start">P(s) = G<tspan dy="0.35em" font-size="72%">servo</tspan><tspan dy="-0.35em">(s)·K</tspan><tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">/s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em"> = K K</tspan><tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em"> exp(−T</tspan><tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em">s) / (s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">(τs + 1))</tspan></text>
</svg>
