"161.9" y2="204" class="ln c-k "/><text x="161.9" y="220" class="s" text-anchor="middle">−15</text><line x1="314.3" y1="196" x2="314.3" y2="204" class="ln c-k "/><text x="314.3" y="220" class="s" text-anchor="middle">−10</text><line x1="466.7" y1="196" x2="466.7" y2="204" class="ln c-k "/><text x="466.7" y="220" class="s" text-anchor="middle">−5</text><line x1="105.1" y1="194" x2="117.1" y2="206" class="ln c-org thick"/><line x1="105.1" y1="206" x2="117.1" y2="194" class="ln c-org thick"/><text x="111.1" y="184" class="s b f-org" text-anchor="middle">−1/τ = −16.7 (서보, 가정)</text><line x1="609" y1="194" x2="621" y2="206" class="ln c-grn thick"/><line x1="609" y1="206" x2="621" y2="194" class="ln c-grn thick"/><line x1="617" y1="194" x2="629" y2="206" class="ln c-grn thick"/><line x1="617" y1="206" x2="629" y2="194" class="ln c-grn thick"/><text x="619" y="184" class="s b f-grn" text-anchor="middle">0, 0 (빔·공)</text><rect x="558.1" y="228" width="30.5" height="10" class="zone3"/><text x="550.1" y="238" class="xs f-blue" text-anchor="end">교차주파수 1~2 rad/s 는 여기</text><text x="20" y="284" class="s" text-anchor="start">서보 극점은 교차주파수보다 열 배 가까이 멀지만, ω = 2 rad/s에서 위상을 tan<tspan dy="-0.45em" font-size="72%">−1</tspan><tspan dy="0.45em">(τω) + ωT</tspan><tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em"> ≈ 9.1° 깎는다 [가정]</tspan></text>
</svg>
