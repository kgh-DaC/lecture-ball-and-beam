<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 302" width="740" height="302" role="img" aria-labelledby="t d">
<title id="t">서보 포함 전체 전달함수</title>
<desc id="d">명령각이 순수 지연 e^(−T_d s)와 1차 서보 K/(τs + 1)을 거쳐 실제 각 θ가 되고, 빔·공 K_b/s²가 공 위치 y를 만드는 블록선도. 아래 실수축에 개루프 극점 0, 0(빔·공)과 가정 서보 극점 −16.7을 표시했다. 교차주파수 1~2 rad/s에서 서보는 위상을 약 9° 깎는다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
