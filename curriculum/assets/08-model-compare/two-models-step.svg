<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 342" width="800" height="342" role="img" aria-labelledby="t d">
<title id="t">같은 PD에 대한 두 모델의 예측</title>
<desc id="d">같은 PD를 서보 무시 모델과 가정 서보 포함 모델에 넣은 스텝 응답 시뮬레이션. 왼쪽은 06장 안전 기본값, 오른쪽은 슬라이드 48 PD. 두 경우 모두 서보를 넣으면 오버슈트가 커지고 정착이 늦어지며, 게인이 큰 슬라이드 48 PD에서 차이가 더 크다.</desc>
