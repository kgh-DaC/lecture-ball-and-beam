<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 326" width="810" height="326" role="img" aria-labelledby="t d">
<title id="t">재설계 전후의 스텝 응답</title>
<desc id="d">가정 서보 포함 모델에서 06장 안전 기본값 PD(위상여유 23.8°)와 재설계 예(Kp 0.5, Kd 1.2, 위상여유 30.3°)의 스텝 응답 시뮬레이션. 안전 기본값은 오버슈트 8.1%, 정착 5.4 s. 재설계 예는 설정값을 넘지 않지만(앱 지표 오버슈트 1.9%는 창 끝까지 천천히 올라가서 생긴 값) 상승이 2.5 s로 느리다.</desc>
