<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 415" width="820" height="415" role="img" aria-labelledby="t d">
<title id="t">분포 이동</title>
<desc id="d">가로축 위치 오차, 세로축 속도인 평면. 선생님 궤적(녹색)은 원점 근처 좁은 영역에 모여 원점으로 감겨 들어가고, 그 영역이 시연 데이터 영역이다. 학생 정책 궤적(빨강)은 영역 안에서 시작해 작은 오차로 영역 밖으로 벗어난 뒤 점점 크게 휘어 나간다.</desc>
