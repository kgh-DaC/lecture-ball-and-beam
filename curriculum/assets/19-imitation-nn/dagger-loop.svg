<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="850" height="380" role="img" aria-labelledby="t d">
<title id="t">DAgger 한 라운드</title>
<desc id="d">왼쪽 순환: 학생 정책 실행(2라운드는 50% 선생님 명령 섞음) → 학생이 방문한 상태 기록 → 선생님이 각 상태에 정답 명령 표시 → 데이터에 합치고 다시 학습 → 다시 학생 정책 실행. 오른쪽: 오차-속도 평면에서 데이터가 있는 영역이 1라운드(시연)의 좁은 영역에서 3라운드, 6라운드로 갈수록 학생이 가는 곳까지 넓어진다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="849" height="379" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="165" y="39" width="190" height="52" rx="6" class="box"/><text x="260" y="62" class="b" text-anchor="middle">① 학생 정책 실행</text><text x="260" y="80" class="s" text-anchor="middle">(2라운드는 50% 선생님)</text><rect x="325" y="164" width="190" height="52" rx="6" class="box"/><text x="420" y="187" class="b" text-anchor="middle">② 학생이 간 상태 기록</text><text x="420" y="205" class="s" text-anchor="middle">[e, v, u_prev]</text><rect x="165" y="289" width="190" height="52" rx="6" class="box"/><text x="260" y="312" class="b" text-anchor="middle">③ 선생님이 정답 표시</text><text x="260" y="330" class="s" text-anchor="middle">u* = PD(그 상태)</text><rect x="5" y="164" width="190" height="52" rx="6" class="box"/><text x="100" y="187" class="b" text-anchor="middle">④ 데이터에 합치고 재학습</text><text x="100" y="205" class="s" text-anchor="middle">16장과 같은 지도학습</text><path d="M355 65L362.5 67.4L369.5 70.1L376.1 73.1L382.3 76.3L388 79.8L393.2 83.6L398.1 87.6L402.4 91.9L406.3 96.5L409.8 101.3L412.8 106.4L415.4 111.7L417.6 117.3L419.2 123.2L420.5 129.3L421.3 135.7L421.6 142.4L421.5 149.3L421 156.5L420.8 158.1" class="ln c-blue "/><polygon points="420,164 417.6,155.3 424.6,156.2" class="f-blue"/><path d="M420 216L421 223.5L421.5 230.7L421.6 237.6L421.3 244.3L420.5 250.7L419.2 256.8L417.6 262.7L415.4 268.3L412.8 273.6L409.8 278.7L406.3 283.5L402.4 288.1L398.1 292.4L393.2 296.4L388 300.2L382.3 303.7L376.1 306.9L369.5 309.9L362.5 312.6L360.7 313.1" class="ln c-blue "/><polygon points="355,315 361.8,309.1 364,315.8" class="f-blue"/><path d="M165 315L157.5 312.6L150.5 309.9L143.9 306.9L137.7 303.7L132 300.2L126.8 296.4L121.9 292.4L117.6 288.1L113.7 283.5L110.2 278.7L107.2 273.6L104.6 268.3L102.4 262.7L100.8 256.8L99.5 250.7L98.7 244.3L98.4 237.6L98.5 230.7L99 223.5L99.2 221.9" class="ln c-blue "/><polygon points="100,216 102.4,224.7 95.4,223.8" class="f-blue"/><path d="M100 164L99 156.5L98.5 149.3L98.4 142.4L98.7 135.7L99.5 129.3L100.8 123.2L102.4 117.3L104.6 111.7L107.2 106.4L110.2 101.3L113.7 96.5L117.6 91.9L121.9 87.6L126.8 83.6L132 79.8L137.7 76.3L143.9 73.1L150.5 70.1L157.5 67.4L159.3 66.9" class="ln c-blue "/><polygon points="165,65 158.2,70.9 156,64.2" class="f-blue"/><text x="260" y="195" class="b" text-anchor="middle">한 라운드</text><text x="260" y="212" class="xs" text-anchor="middle">(기본 4 에피소드)</text><line x1="570" y1="300" x2="808" y2="300" class="ln c-k "/><polygon points="814,300 805.7,303.5 805.7,296.5" class="f-k"/><line x1="570" y1="300" x2="570" y2="54" class="ln c-k "/><polygon points="570,48 573.5,56.3 566.5,56.3" class="f-k"/><text x="804" y="336" class="s" text-anchor="end">e</text><text x="576" y="44" class="s" text-anchor="start">v</text><line x1="685" y1="60" x2="685" y2="300" class="ln c-m thin dot"/><line x1="570" y1="180" x2="800" y2="180" class="ln c-m thin dot"/><ellipse cx="685" cy="180" rx="84.3" ry="90" class="zone3"/><ellipse cx="685" cy="180" rx="49.8" ry="54" class="zone2"/><ellipse cx="685" cy="180" rx="16.9" ry="21" class="zone"/><text x="765.3" y="86" class="xs b" text-anchor="end">6라운드</text><text x="736.8" y="122" class="xs b" text-anchor="start">3라운드</text><text x="705.9" y="215" class="xs b" text-anchor="start">1라운드(시연)</text><text x="685" y="30" class="s b" text-anchor="middle">데이터가 있는 영역</text><text x="830" y="370" class="xs f-m" text-anchor="end">개념도: 모양을 설명하기 위한 그림이며 측정·학습 결과가 아니다</text>
</svg>
