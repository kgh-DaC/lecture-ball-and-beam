<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" width="800" height="388" role="img" aria-labelledby="t d">
<title id="t">라운드별 행동복제와 DAgger</title>
<desc id="d">번들 학습 기록의 라운드별 폐루프 평가 return과 학습 손실. 1라운드(시연만)는 두 방법 모두 -412. 행동복제는 -412, -221, -152, -104, -92, -90로 나아지지만 선생님 PD(-73) 아래에서 멈추고, DAgger는 -412, -81, -72, -73, -73, -73로 3라운드에 선생님 수준이 된다. DAgger의 학습 손실은 2라운드부터 약 10배로 커진다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="799" height="387" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="60" y="28" class="b" text-anchor="start">라운드별 폐루프 성능과 학습 손실: 행동복제 vs DAgger (번들 기록) [시뮬레이션]</text><text x="80" y="52" class="s b" text-anchor="start">폐루프 평가 return (높을수록 좋음)</text><line x1="80" y1="259.3" x2="380" y2="259.3" class="ln c-m thin dot"/><line x1="80" y1="210.5" x2="380" y2="210.5" class="ln c-m thin dot"/><line x1="80" y1="161.7" x2="380" y2="161.7" class="ln c-m thin dot"/><line x1="80" y1="112.8" x2="380" y2="112.8" class="ln c-m thin dot"/><line x1="80" y1="64" x2="380" y2="64" class="ln c-m thin dot"/><line x1="80" y1="274" x2="388" y2="274" class="ln c-k "/><polygon points="394,274 385.7,277.5 385.7,270.5" class="f-k"/><line x1="80" y1="274" x2="80" y2="58" class="ln c-k "/><polygon points="80,52 83.5,60.3 76.5,60.3" class="f-k"/><line x1="80" y1="274" x2="80" y2="279" class="ln c-k "/><text x="80" y="293" class="s" text-anchor="middle">1</text><line x1="140" y1="274" x2="140" y2="279" class="ln c-k "/><text x="140" y="293" class="s" text-anchor="middle">2</text><line x1="200" y1="274" x2="200" y2="279" class="ln c-k "/><text x="200" y="293" class="s" text-anchor="middle">3</text><line x1="260" y1="274" x2="260" y2="279" class="ln c-k "/><text x="260" y="293" class="s" text-anchor="middle">4</text><line x1="320" y1="274" x2="320" y2="279" class="ln c-k "/><text x="320" y="293" class="s" text-anchor="middle">5</text><line x1="380" y1="274" x2="380" y2="279" class="ln c-k "/><text x="380" y="293" class="s" text-anchor="middle">6</text><line x1="75" y1="259.3" x2="80" y2="259.3" class="ln c-k "/><text x="72" y="263.3" class="s" text-anchor="end">−400</text><line x1="75" y1="210.5" x2="80" y2="210.5" class="ln c-k "/><text x="72" y="214.5" class="s" text-anchor="end">−300</text><line x1="75" y1="161.7" x2="80" y2="161.7" class="ln c-k "/><text x="72" y="165.7" class="s" text-anchor="end">−200</text><line x1="75" y1="112.8" x2="80" y2="112.8" class="ln c-k "/><text x="72" y="116.8" class="s" text-anchor="end">−100</text><line x1="75" y1="64" x2="80" y2="64" class="ln c-k "/><text x="72" y="68" class="s" text-anchor="end">0</text><text x="384" y="310" class="s" text-anchor="end">라운드</text><text x="86" y="48" class="s" text-anchor="start"></text><line x1="80" y1="99.7" x2="380" y2="99.7" class="ln c-grn dash"/><text x="380" y="93.7" class="xs b f-grn" text-anchor="end">선생님 PD −73</text><path d="M80 265.3L140 172L200 138.1L260 115L320 108.9L380 107.9" class="ln c-red thick"/><circle cx="80" cy="265.3" r="4" class="f-red"/><circle cx="140" cy="172" r="4" class="f-red"/><circle cx="200" cy="138.1" r="4" class="f-red"/><circle cx="260" cy="115" r="4" class="f-red"/><circle cx="320" cy="108.9" r="4" class="f-red"/><circle cx="380" cy="107.9" r="4" class="f-red"/><path d="M80 265.3L140 103.4L200 99.3L260 99.7L320 99.9L380 99.6" class="ln c-blue thick"/><circle cx="80" cy="265.3" r="4" class="f-blue"/><circle cx="140" cy="103.4" r="4" class="f-blue"/><circle cx="200" cy="99.3" r="4" class="f-blue"/><circle cx="260" cy="99.7" r="4" class="f-blue"/><circle cx="320" cy="99.9" r="4" class="f-blue"/><circle cx="380" cy="99.6" r="4" class="f-blue"/><text x="376" y="123.9" class="xs b f-red" text-anchor="end">−90</text><text x="90" y="255.3" class="xs b" text-anchor="start">1라운드(시연만) −412</text><text x="470" y="52" class="s b" text-anchor="start">학습 손실 (로그 눈금)</text><line x1="470" y1="274" x2="750" y2="274" class="ln c-m thin dot"/><line x1="470" y1="178.5" x2="750" y2="178.5" class="ln c-m thin dot"/><line x1="470" y1="83.1" x2="750" y2="83.1" class="ln c-m thin dot"/><line x1="470" y1="274" x2="758" y2="274" class="ln c-k "/><polygon points="764,274 755.7,277.5 755.7,270.5" class="f-k"/><line x1="470" y1="274" x2="470" y2="58" class="ln c-k "/><polygon points="470,52 473.5,60.3 466.5,60.3" class="f-k"/><line x1="470" y1="274" x2="470" y2="279" class="ln c-k "/><text x="470" y="293" class="s" text-anchor="middle">1</text><line x1="526" y1="274" x2="526" y2="279" class="ln c-k "/><text x="526" y="293" class="s" text-anchor="middle">2</text><line x1="582" y1="274" x2="582" y2="279" class="ln c-k "/><text x="582" y="293" class="s" text-anchor="middle">3</text><line x1="638" y1="274" x2="638" y2="279" class="ln c-k "/><text x="638" y="293" class="s" text-anchor="middle">4</text><line x1="694" y1="274" x2="694" y2="279" class="ln c-k "/><text x="694" y="293" class="s" text-anchor="middle">5</text><line x1="750" y1="274" x2="750" y2="279" class="ln c-k "/><text x="750" y="293" class="s" text-anchor="middle">6</text><line x1="465" y1="274" x2="470" y2="274" class="ln c-k "/><text x="462" y="278" class="s" text-anchor="end">10<tspan dy="-0.45em" font-size="72%">−7</tspan></text><line x1="465" y1="178.5" x2="470" y2="178.5" class="ln c-k "/><text x="462" y="182.5" class="s" text-anchor="end">10<tspan dy="-0.45em" font-size="72%">−6</tspan></text><line x1="465" y1="83.1" x2="470" y2="83.1" class="ln c-k "/><text x="462" y="87.1" class="s" text-anchor="end">10<tspan dy="-0.45em" font-size="72%">−5</tspan></text><text x="754" y="310" class="s" text-anchor="end">라운드</text><text x="476" y="48" class="s" text-anchor="start"></text><path d="M470 199.9L526 211.6L582 209.2L638 201.5L694 205.6L750 203.4" class="ln c-red thick"/><circle cx="470" cy="199.9" r="4" class="f-red"/><circle cx="526" cy="211.6" r="4" class="f-red"/><circle cx="582" cy="209.2" r="4" class="f-red"/><circle cx="638" cy="201.5" r="4" class="f-red"/><circle cx="694" cy="205.6" r="4" class="f-red"/><circle cx="750" cy="203.4" r="4" class="f-red"/><path d="M470 199.9L526 104L582 91.6L638 108.4L694 109.3L750 103.7" class="ln c-blue thick"/><circle cx="470" cy="199.9" r="4" class="f-blue"/><circle cx="526" cy="104" r="4" class="f-blue"/><circle cx="582" cy="91.6" r="4" class="f-blue"/><circle cx="638" cy="108.4" r="4" class="f-blue"/><circle cx="694" cy="109.3" r="4" class="f-blue"/><circle cx="750" cy="103.7" r="4" class="f-blue"/><line x1="80" y1="330" x2="102" y2="330" class="ln c-red thick"/><text x="108" y="334" class="xs b f-red" text-anchor="start">행동복제: 라운드마다 시연 4 에피소드 추가</text><line x1="400" y1="330" x2="422" y2="330" class="ln c-blue thick"/><text x="428" y="334" class="xs b f-blue" text-anchor="start">DAgger: 학생이 간 곳에 선생님 정답 추가</text><text x="80" y="358" class="xs f-m" text-anchor="start">DAgger는 3라운드에 선생님 수준이 되고, 학습 손실은 오히려 약 10배로 커졌다(어려운 상태가 데이터에 들어옴).</text><text x="80" y="374" class="xs f-m" text-anchor="start">행동복제는 나아지지만 선생님 아래에서 멈춘다.</text>
</svg>
