.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="919" height="381" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="70" y="28" class="b" text-anchor="start">지표 정의를 응답 위에: 06장 안전 기본값 PD, 가정 서보, 잡음 없음 [시뮬레이션]</text><line x1="70" y1="282" x2="630" y2="282" class="ln c-m thin dot"/><line x1="70" y1="266" x2="630" y2="266" class="ln c-m thin dot"/><line x1="70" y1="138" x2="630" y2="138" class="ln c-m thin dot"/><line x1="70" y1="122" x2="630" y2="122" class="ln c-m thin dot"/><line x1="70" y1="314" x2="638" y2="314" class="ln c-k "/><polygon points="644,314 635.7,317.5 635.7,310.5" class="f-k"/><line x1="70" y1="314" x2="70" y2="68" class="ln c-k "/><polygon points="70,62 73.5,70.3 66.5,70.3" class="f-k"/><line x1="102.9" y1="314" x2="102.9" y2="319" class="ln c-k "/><text x="102.9" y="333" class="s" text-anchor="middle">0</text><line x1="234.7" y1="314" x2="234.7" y2="319" class="ln c-k "/><text x="234.7" y="333" class="s" text-anchor="middle">2</text><line x1="366.5" y1="314" x2="366.5" y2="319" class="ln c-k "/><text x="366.5" y="333" class="s" text-anchor="middle">4</text><line x1="498.2" y1="314" x2="498.2" y2="319" class="ln c-k "/><text x="498.2" y="333" class="s" text-anchor="middle">6</text><line x1="630" y1="314" x2="630" y2="319" class="ln c-k "/><text x="630" y="333" class="s" text-anchor="middle">8</text><line x1="65" y1="282" x2="70" y2="282" class="ln c-k "/><text x="62" y="286" class="s" text-anchor="end">150</text><line x1="65" y1="266" x2="70" y2="266" class="ln c-k "/><text x="62" y="270" class="s" text-anchor="end">155</text><line x1="65" y1="138" x2="70" y2="138" class="ln c-k "/><text x="62" y="142" class="s" text-anchor="end">195</text><line x1="65" y1="122" x2="70" y2="122" class="ln c-k "/><text x="62" y="126" class="s" text-anchor="end">200</text><text x="634" y="350" class="s" text-anchor="end">스텝 뒤 시간 (s)</text><text x="76" y="58" class="s" text-anchor="start">공 위치 y (mm)</text><rect x="524.6" y="74" width="105.4" height="240" class="zone3"/><text x="577.3" y="88" class="xs b f-blue" text-anchor="middle">마지막 20%</text><text x="577.3" y="102" class="xs f-blue" text-anchor="middle">평균 = y<tspan dy="0.35em" font-size="72%">final</tspan></text><rect x="70" y="111.6" width="560" height="16" class="zone"/><line x1="70" y1="122" x2="630" y2="122" class="ln c-k thin dash"/><line x1="70" y1="266" x2="630" y2="266" class="ln c-m thin dot"/><line x1="70" y1="138" x2="630" y2="138" class="ln c-m thin dot"/><path d="M70 282L74 282L77.9 282L81.9 282L85.8 282L89.8 282L93.7 282L97.7 282L101.6 282L105.6 282L109.5 282L113.5 281.7L117.4 281.1L121.4 279.9L125.3 278.3L129.3 276.1L133.2 273.5L137.2 270.3L141.2 266.7L145.1 262.7L149.1 258.2L153 253.3L157 248.1L160.9 242.5L164.9 236.7L168.8 230.6L172.8 224.3L176.7 217.9L180.7 211.3L184.6 204.7L188.6 198L192.5 191.4L196.5 184.8L200.4 178.3L204.4 172L208.4 165.8L212.3 159.8L216.3 154.1L220.2 148.6L224.2 143.5L228.1 138.6L232.1 134L236 129.8L240 126L243.9 122.5L247.9 119.3L251.8 116.5L255.8 114.1L259.7 112L263.7 110.3L267.6 109L271.6 107.9L275.6 107.2L279.5 106.7L283.5 106.6L287.4 106.7L291.4 107.1L295.3 107.6L299.3 108.4L303.2 109.4L307.2 110.5L311.1 111.7L315.1 113.1L319 114.5L323 116L326.9 117.6L330.9 119.1L334.8 120.7L338.8 122.3L342.8 123.8L346.7 125.3L350.7 126.8L354.6 128.1L358.6 129.4L362.5 130.6L366.5 131.7L370.4 132.7L374.4 133.6L378.3 134.3L382.3 134.9L386.2 135.4L390.2 135.8L394.1 136.1L398.1 136.2L402 136.3L406 136.2L410 136L413.9 135.7L417.9 135.3L421.8 134.9L425.8 134.3L429.7 133.7L433.7 133.1L437.6 132.3L441.6 131.6L445.5 130.7L449.5 129.9L453.4 129.1L457.4 128.2L461.3 127.3L465.3 126.5L469.2 125.6L473.2 124.8L477.2 124L481.1 123.2L485.1 122.5L489 121.8L493 121.2L496.9 120.6L500.9 120L504.8 119.5L508.8 119.1L512.7 118.7L516.7 118.3L520.6 118.1L524.6 117.9L528.5 117.7L532.5 117.6L536.4 117.5L540.4 117.5L544.4 117.5L548.3 117.6L552.3 117.7L556.2 117.9L560.2 118.1L564.1 118.3L568.1 118.5L572 118.8L576 119.1L579.9 119.4L583.9 119.7L587.8 120L591.8 120.4L595.7 120.7L599.7 121L603.6 121.3L607.6 121.6L611.6 121.9L615.5 122.2L619.5 122.5L623.4 122.7L627.4 123" class="ln c-blue thick"/><line x1="141.9" y1="266" x2="141.9" y2="314" class="ln c-org thin dash"/><line x1="228.6" y1="138" x2="228.6" y2="314" class="ln c-org thin dash"/><line x1="147.9" y1="301.2" x2="222.6" y2="301.2" class="ln c-org "/><polygon points="228.6,301.2 220.3,304.7 220.3,297.7" class="f-org"/><polygon points="141.9,301.2 150.1,297.7 150.1,304.7" class="f-org"/><text x="185.2" y="295.2" class="s b f-org" text-anchor="middle">t<tspan dy="0.35em" font-size="72%">r</tspan><tspan dy="-0.35em"> 1.32 s</tspan></text><line x1="280.8" y1="106.6" x2="280.8" y2="314" class="ln c-red thin dash"/><circle cx="280.8" cy="106.6" r="4.5" class="f-red"/><text x="288.8" y="98.6" class="s b f-red" text-anchor="start">t<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em"> 2.70 s, P.O. 8.1%</tspan></text><line x1="458.7" y1="81.6" x2="458.7" y2="314" class="ln c-grn thin dash"/><text x="464.7" y="89.6" class="s b f-grn" text-anchor="start">t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em"> 5.40 s</tspan></text><text x="650" y="90" class="s b" text-anchor="start">읽는 법 (store/metrics.js)</text><text x="650" y="116" class="xs b f-org" text-anchor="start">t<tspan dy="0.35em" font-size="72%">r</tspan><tspan dy="-0.35em">: 스텝의 10% → 90% (155 → 195 mm)</tspan></text><text x="650" y="138" class="xs b f-red" text-anchor="start">t<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em">: 최댓값에 처음 닿은 시각</tspan></text><text x="650" y="160" class="xs b f-red" text-anchor="start">P.O. = (y<tspan dy="0.35em" font-size="72%">max</tspan><tspan dy="-0.35em"> − y</tspan><tspan dy="0.35em" font-size="72%">final</tspan><tspan dy="-0.35em">) / |Δ|</tspan></text><text x="650" y="182" class="xs b f-grn" text-anchor="start">t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em">: 이후 |y − y</tspan><tspan dy="0.35em" font-size="72%">final</tspan><tspan dy="-0.35em">| ≤ 5%|Δ|</tspan></text><text x="650" y="204" class="xs b f-grn" text-anchor="start">     (초록 띠 = ±2.5 mm)</text><text x="650" y="226" class="xs b f-blue" text-anchor="start">y<tspan dy="0.35em" font-size="72%">final</tspan><tspan dy="-0.35em">: 구간 마지막 20% 평균</tspan></text><text x="650" y="248" class="xs b f-k" text-anchor="start">e<tspan dy="0.35em" font-size="72%">ss</tspan><tspan dy="-0.35em"> = |200 − y</tspan><tspan dy="0.35em" font-size="72%">final</tspan><tspan dy="-0.35em">| = 0.76 mm</tspan></text><text x="650" y="288" class="xs f-m" text-anchor="start">시각은 모두 스텝 시점에서 잰다.</text><text x="650" y="304" class="xs f-m" text-anchor="start">지표는 원측정 y_mm 으로 계산한다.</text><text x="70" y="366" class="xs f-m" text-anchor="start">150 → 200 mm (Δ = 50 mm), 60 ms, α 0.2, D 필터 N = 8, 각도 한계 20°. 정착 인정: 띠 안에 min(1 s, 관찰 길이/4) 이상 머묾.</text>
</svg>
