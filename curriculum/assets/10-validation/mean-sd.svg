<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" width="760" height="345" role="img" aria-labelledby="t d">
<title id="t">평균 ± 표준편차로 비교하기</title>
<desc id="d">PID A 오버슈트 15 ± 3%(세 시행 12, 15, 18%)와 PID B 13 ± 4%를 막대와 오차 막대로 그렸다. 평균 차이 2%p가 흩어짐보다 작고 오차 막대가 겹치므로 우열을 단정하기 어렵다. 본문의 예시 숫자이다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="344" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<line x1="110" y1="280" x2="530" y2="280" class="ln c-m thin dot"/><line x1="110" y1="184" x2="530" y2="184" class="ln c-m thin dot"/><line x1="110" y1="136" x2="530" y2="136" class="ln c-m thin dot"/><line x1="110" y1="88" x2="530" y2="88" class="ln c-m thin dot"/><line x1="110" y1="280" x2="538" y2="280" class="ln c-k "/><polygon points="544,280 535.7,283.5 535.7,276.5" class="f-k"/><line x1="110" y1="280" x2="110" y2="34" class="ln c-k "/><polygon points="110,28 113.5,36.3 106.5,36.3" class="f-k"/><line x1="105" y1="280" x2="110" y2="280" class="ln c-k "/><text x="102" y="284" class="s" text-anchor="end">0</text><line x1="105" y1="184" x2="110" y2="184" class="ln c-k "/><text x="102" y="188" class="s" text-anchor="end">10</text><line x1="105" y1="136" x2="110" y2="136" class="ln c-k "/><text x="102" y="140" class="s" text-anchor="end">15</text><line x1="105" y1="88" x2="110" y2="88" class="ln c-k "/><text x="102" y="92" class="s" text-anchor="end">20</text><text x="534" y="316" class="s" text-anchor="end"></text><text x="116" y="24" class="s" text-anchor="start">오버슈트 (%)</text><rect x="110" y="116.8" width="420" height="57.6" class="f-grn" fill-opacity="0.12"/><rect x="210" y="136" width="80" height="144" class="f-blue" fill-opacity="0.35"/><line x1="250" y1="164.8" x2="250" y2="107.2" class="ln c-k thick"/><line x1="236" y1="164.8" x2="264" y2="164.8" class="ln c-k thick"/><line x1="236" y1="107.2" x2="264" y2="107.2" class="ln c-k thick"/><text x="250" y="300" class="b" text-anchor="middle">PID A</text><text x="272" y="101.2" class="s b" text-anchor="start">15 ± 3%</text><rect x="350" y="155.2" width="80" height="124.8" class="f-org" fill-opacity="0.35"/><line x1="390" y1="193.6" x2="390" y2="116.8" class="ln c-k thick"/><line x1="376" y1="193.6" x2="404" y2="193.6" class="ln c-k thick"/><line x1="376" y1="116.8" x2="404" y2="116.8" class="ln c-k thick"/><text x="390" y="300" class="b" text-anchor="middle">PID B</text><text x="412" y="110.8" class="s b" text-anchor="start">13 ± 4%</text><circle cx="224" cy="164.8" r="4" class="f-k"/><circle cx="224" cy="136" r="4" class="f-k"/><circle cx="224" cy="107.2" r="4" class="f-k"/><text x="216" y="168.8" class="xs" text-anchor="end">시행 3회</text><text x="560" y="90" class="s b" text-anchor="start">평균 차이 2%p</text><text x="560" y="110" class="s b" text-anchor="start">&lt; 흩어짐(표준편차 3~4%p)</text><text x="560" y="140" class="s" text-anchor="start">오차 막대가 겹친다</text><text x="560" y="160" class="s" text-anchor="start">→ "B가 낫다"고 단정하기 어렵다</text><text x="560" y="200" class="xs f-m" text-anchor="start">초록 띠: 두 오차 막대가 겹치는 범위</text><text x="20" y="330" class="xs f-m" text-anchor="start">[가정: 본문 3·4절의 예시 숫자. 점 = A의 세 시행 12, 15, 18%]</text>
</svg>
