<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">실행 순서: 몰아서, 번갈아, 절충</title>
<desc id="d">장치 상태가 시간에 따라 천천히 변할 때의 세 가지 실행 순서. 몰아서(AAABBB)는 B만 변한 장치에서 실행되어 비교가 왜곡된다. 번갈아(ABABAB)는 두 제어기가 같은 변화를 겪어 가장 공정하고, 검증 도구의 번갈아 실행이 이 순서로 돌린다. 절충(AAABBBAAA)은 반복 실행을 세 번 하고 앞뒤 A를 비교해 장치 변화를 점검한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="399" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="34" class="s b" text-anchor="start">장치 상태의 느린 변화 (예: 배터리 전압)</text><line x1="150" y1="56" x2="698" y2="92" class="ln c-m thick dash"/><text x="698" y="110" class="xs" text-anchor="end">시간 →</text><text x="20" y="154" class="s b" text-anchor="start">몰아서</text><rect x="150" y="130" width="52" height="36" rx="4" class="bx-blue"/><text x="176" y="154" class="b f-blue" text-anchor="middle">A</text><rect x="212" y="130" width="52" height="36" rx="4" class="bx-blue"/><text x="238" y="154" class="b f-blue" text-anchor="middle">A</text><rect x="274" y="130" width="52" height="36" rx="4" class="bx-blue"/><text x="300" y="154" class="b f-blue" text-anchor="middle">A</text><rect x="336" y="130" width="52" height="36" rx="4" class="bx-org"/><text x="362" y="154" class="b f-org" text-anchor="middle">B</text><rect x="398" y="130" width="52" height="36" rx="4" class="bx-org"/><text x="424" y="154" class="b f-org" text-anchor="middle">B</text><rect x="460" y="130" width="52" height="36" rx="4" class="bx-org"/><text x="486" y="154" class="b f-org" text-anchor="middle">B</text><text x="150" y="186" class="xs" text-anchor="start">B는 모두 장치가 변한 뒤에 실행됨 → 차이가 제어기 때문인지 장치 때문인지 모른다</text><text x="20" y="238" class="s b" text-anchor="start">번갈아</text><rect x="150" y="214" width="52" height="36" rx="4" class="bx-blue"/><text x="176" y="238" class="b f-blue" text-anchor="middle">A</text><rect x="212" y="214" width="52" height="36" rx="4" class="bx-org"/><text x="238" y="238" class="b f-org" text-anchor="middle">B</text><rect x="274" y="214" width="52" height="36" rx="4" class="bx-blue"/><text x="300" y="238" class="b f-blue" text-anchor="middle">A</text><rect x="336" y="214" width="52" height="36" rx="4" class="bx-org"/><text x="362" y="238" class="b f-org" text-anchor="middle">B</text><rect x="398" y="214" width="52" height="36" rx="4" class="bx-blue"/><text x="424" y="238" class="b f-blue" text-anchor="middle">A</text><rect x="460" y="214" width="52" height="36" rx="4" class="bx-org"/><text x="486" y="238" class="b f-org" text-anchor="middle">B</text><text x="150" y="270" class="xs" text-anchor="start">두 제어기가 같은 변화를 똑같이 겪는다 → 가장 공정. 검증 도구에서 B를 고정하고</text><text x="150" y="286" class="xs" text-anchor="start">'번갈아 실행'을 누르면 이 순서로 돌리고 제어기별 평균 ± 표준편차를 낸다</text><text x="20" y="338" class="s b" text-anchor="start">절충</text><rect x="150" y="314" width="52" height="36" rx="4" class="bx-blue"/><text x="176" y="338" class="b f-blue" text-anchor="middle">A</text><rect x="212" y="314" width="52" height="36" rx="4" class="bx-blue"/><text x="238" y="338" class="b f-blue" text-anchor="middle">A</text><rect x="274" y="314" width="52" height="36" rx="4" class="bx-blue"/><text x="300" y="338" class="b f-blue" text-anchor="middle">A</text><rect x="336" y="314" width="52" height="36" rx="4" class="bx-org"/><text x="362" y="338" class="b f-org" text-anchor="middle">B</text><rect x="398" y="314" width="52" height="36" rx="4" class="bx-org"/><text x="424" y="338" class="b f-org" text-anchor="middle">B</text><rect x="460" y="314" width="52" height="36" rx="4" class="bx-org"/><text x="486" y="338" class="b f-org" text-anchor="middle">B</text><rect x="522" y="314" width="52" height="36" rx="4" class="bx-blue"/><text x="548" y="338" class="b f-blue" text-anchor="middle">A</text><rect x="584" y="314" width="52" height="36" rx="4" class="bx-blue"/><text x="610" y="338" class="b f-blue" text-anchor="middle">A</text><rect x="646" y="314" width="52" height="36" rx="4" class="bx-blue"/><text x="672" y="338" class="b f-blue" text-anchor="middle">A</text><text x="150" y="370" class="xs" text-anchor="start">반복 실행을 세 번(묶음 3개). 앞뒤 A의 차이가 흩어짐 안이면 그사이 장치 변화가 작았다고 본다</text>
</svg>
