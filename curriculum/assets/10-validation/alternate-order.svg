<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 332" width="740" height="332" role="img" aria-labelledby="t d">
<title id="t">몰아서 실행과 번갈아 실행</title>
<desc id="d">장치 상태가 시간에 따라 천천히 변할 때, A를 세 번 실행한 뒤 B를 세 번 실행하면 B만 변한 장치에서 실행되어 비교가 왜곡되고, A와 B를 번갈아 실행하면 두 제어기가 같은 변화를 똑같이 겪는다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="739" height="331" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="40" class="s b" text-anchor="start">장치 상태의 느린 변화 (예: 배터리 전압)</text><path d="M140 60L197 64L254 68L311 72L368 76L425 80L482 84L539 88L596 92L653 96L710 100" class="ln c-m thick dash"/><text x="720" y="104" class="xs" text-anchor="start">시간 →</text><text x="20" y="156" class="b" text-anchor="start">몰아서</text><rect x="140" y="130" width="80" height="40" class="f-blue" fill-opacity="0.3"/><rect x="140" y="130" width="80" height="40" fill="none" class="ln c-k thin"/><text x="180" y="156" class="b l" text-anchor="middle">A</text><rect x="235" y="130" width="80" height="40" class="f-blue" fill-opacity="0.3"/><rect x="235" y="130" width="80" height="40" fill="none" class="ln c-k thin"/><text x="275" y="156" class="b l" text-anchor="middle">A</text><rect x="330" y="130" width="80" height="40" class="f-blue" fill-opacity="0.3"/><rect x="330" y="130" width="80" height="40" fill="none" class="ln c-k thin"/><text x="370" y="156" class="b l" text-anchor="middle">A</text><rect x="425" y="130" width="80" height="40" class="f-org" fill-opacity="0.45"/><rect x="425" y="130" width="80" height="40" fill="none" class="ln c-k thin"/><text x="465" y="156" class="b l" text-anchor="middle">B</text><rect x="520" y="130" width="80" height="40" class="f-org" fill-opacity="0.45"/><rect x="520" y="130" width="80" height="40" fill="none" class="ln c-k thin"/><text x="560" y="156" class="b l" text-anchor="middle">B</text><rect x="615" y="130" width="80" height="40" class="f-org" fill-opacity="0.45"/><rect x="615" y="130" width="80" height="40" fill="none" class="ln c-k thin"/><text x="655" y="156" class="b l" text-anchor="middle">B</text><text x="140" y="192" class="s" text-anchor="start">B는 모두 장치가 변한 뒤에 실행됨 → 차이가 제어기 때문인지 장치 때문인지 모른다</text><text x="20" y="246" class="b" text-anchor="start">번갈아</text><rect x="140" y="220" width="80" height="40" class="f-blue" fill-opacity="0.3"/><rect x="140" y="220" width="80" height="40" fill="none" class="ln c-k thin"/><text x="180" y="246" class="b l" text-anchor="middle">A</text><rect x="235" y="220" width="80" height="40" class="f-org" fill-opacity="0.45"/><rect x="235" y="220" width="80" height="40" fill="none" class="ln c-k thin"/><text x="275" y="246" class="b l" text-anchor="middle">B</text><rect x="330" y="220" width="80" height="40" class="f-blue" fill-opacity="0.3"/><rect x="330" y="220" width="80" height="40" fill="none" class="ln c-k thin"/><text x="370" y="246" class="b l" text-anchor="middle">A</text><rect x="425" y="220" width="80" height="40" class="f-org" fill-opacity="0.45"/><rect x="425" y="220" width="80" height="40" fill="none" class="ln c-k thin"/><text x="465" y="246" class="b l" text-anchor="middle">B</text><rect x="520" y="220" width="80" height="40" class="f-blue" fill-opacity="0.3"/><rect x="520" y="220" width="80" height="40" fill="none" class="ln c-k thin"/><text x="560" y="246" class="b l" text-anchor="middle">A</text><rect x="615" y="220" width="80" height="40" class="f-org" fill-opacity="0.45"/><rect x="615" y="220" width="80" height="40" fill="none" class="ln c-k thin"/><text x="655" y="246" class="b l" text-anchor="middle">B</text><text x="140" y="282" class="s" text-anchor="start">두 제어기가 같은 변화를 똑같이 겪는다 → 공정한 비교</text><text x="20" y="320" class="xs f-m" text-anchor="start">개념도: A = 파란 상자(옅게), B = 주황 상자(진하게)</text>
</svg>
