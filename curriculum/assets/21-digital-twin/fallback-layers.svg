<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 588" width="860" height="588" role="img" aria-labelledby="t d">
<title id="t">센서 고장 대응 층(폴백)</title>
<desc id="d">위에서 아래로 여섯 층: 센서는 이상값·유실·멈춤을 스스로 알리지 않는다. 펌웨어 1.1.0 이상값 제거 gate(despike 2)는 직전 채택값에서 60 mm 넘게 벗어난 값을 최대 3번 연속 버리지만 filt_mm에만 작용하고, 트윈 기본(despike 0, 펌웨어 1.0.0 동작)에서는 꺼져 있으며, 공이 304 mm 근처일 때의 튐과 4번 이상 이어진 튐은 통과시킨다. 펌웨어 필터는 유실이면 직전 값을 유지하지만 gate가 꺼져 있으면 이상값을 섞는다. 호스트는 유실이면 제어기에 NaN을 주고, 출력이 NaN이면 직전 명령을 쓰며, 제어기 예외는 비상 정지로 처리한다. 제어기는 PID가 직전 명령을 유지하고 적분을 멈추며, LQR·SMC는 관측기가 모델로 예측한다. 장치 안전 규칙은 하트비트가 끊기면 빔을 수평으로 돌리고 IDLE로 간다. 오른쪽 점선은 원측정 dist_mm이 gate와 필터를 거치지 않고 LQR·LQI·SMC로 가는 경로다. 트윈 기본에서는 범위 안의 이상값을 어느 층도 거르지 않고, gate를 켜도 원측정을 쓰는 제어기는 보호받지 못한다는 빈틈을 강조했다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="859" height="587" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="30" class="b s" text-anchor="start">센서가 잘못된 값을 줄 때, 어디에서 무엇이 막아 주나</text><rect x="40" y="50" width="8" height="66" rx="2" class="f-red" fill-opacity="0.9"/><rect x="52" y="50" width="668" height="66" rx="6" class="box"/><text x="66" y="71" class="b" text-anchor="start">센서</text><text x="66" y="90" class="s" text-anchor="start">생기는 고장: 이상값(≈304 mm), 유실(−1), 멈춤(같은 값 반복)</text><text x="706" y="71" class="s f-m" text-anchor="end">한계: 고장을 스스로 알리지 않는다</text><line x1="380" y1="116" x2="380" y2="124" class="ln c-m "/><polygon points="380,130 376.5,121.7 383.5,121.7" class="f-m"/><rect x="40" y="130" width="8" height="66" rx="2" class="f-org" fill-opacity="0.9"/><rect x="52" y="130" width="668" height="66" rx="6" class="boxd"/><text x="66" y="151" class="b" text-anchor="start">펌웨어 1.1.0 이상값 제거 gate (despike 2)</text><text x="66" y="170" class="s" text-anchor="start">막는 것: 직전 채택값에서 60 mm 넘게 벗어난 값을 최대 3번 연속 버림 (filt_mm 에만)</text><text x="66" y="187" class="xs f-m" text-anchor="start">통과시키는 것: 공이 304 mm 근처(차 ≤ 60 mm)일 때의 튐, 4번 이상 이어진 튐, 원측정 dist_mm</text><text x="706" y="151" class="s f-m" text-anchor="end">한계: 트윈 기본은 꺼짐(despike 0 = 1.0.0 동작)</text><line x1="380" y1="196" x2="380" y2="204" class="ln c-m "/><polygon points="380,210 376.5,201.7 383.5,201.7" class="f-m"/><rect x="40" y="210" width="8" height="66" rx="2" class="f-org" fill-opacity="0.9"/><rect x="52" y="210" width="668" height="66" rx="6" class="box"/><text x="66" y="231" class="b" text-anchor="start">펌웨어 필터 f ← f(1−α) + xα</text><text x="66" y="250" class="s" text-anchor="start">막는 것: 유실이면 직전 값 유지</text><text x="706" y="231" class="s f-m" text-anchor="end">한계: gate 가 꺼져 있으면 이상값을 섞는다</text><line x1="380" y1="276" x2="380" y2="284" class="ln c-m "/><polygon points="380,290 376.5,281.7 383.5,281.7" class="f-m"/><rect x="40" y="290" width="8" height="66" rx="2" class="f-blue" fill-opacity="0.9"/><rect x="52" y="290" width="668" height="66" rx="6" class="box"/><text x="66" y="311" class="b" text-anchor="start">호스트(러너)</text><text x="66" y="330" class="s" text-anchor="start">막는 것: 유실이면 y = NaN 전달, 출력이 NaN이면 직전 u, 제어기 예외 → 비상 정지</text><text x="706" y="311" class="s f-m" text-anchor="end"></text><line x1="380" y1="356" x2="380" y2="364" class="ln c-m "/><polygon points="380,370 376.5,361.7 383.5,361.7" class="f-m"/><rect x="40" y="370" width="8" height="66" rx="2" class="f-pur" fill-opacity="0.9"/><rect x="52" y="370" width="668" height="66" rx="6" class="box"/><text x="66" y="391" class="b" text-anchor="start">제어기</text><text x="66" y="410" class="s" text-anchor="start">막는 것: PID는 직전 u 유지·적분 정지 / LQR·SMC는 관측기가 모델로 예측</text><text x="66" y="427" class="xs f-m" text-anchor="start">PD·PID 는 filt_mm(gate·필터 뒤)을, LQR·LQI·SMC 는 원측정 dist_mm(aux.y_raw_m)을 받는다(점선)</text><text x="706" y="391" class="s f-m" text-anchor="end">한계: 범위 안의 튄 값은 정상 측정으로 받는다</text><line x1="380" y1="436" x2="380" y2="444" class="ln c-m "/><polygon points="380,450 376.5,441.7 383.5,441.7" class="f-m"/><rect x="40" y="450" width="8" height="66" rx="2" class="f-grn" fill-opacity="0.9"/><rect x="52" y="450" width="668" height="66" rx="6" class="box"/><text x="66" y="471" class="b" text-anchor="start">장치 안전 규칙</text><text x="66" y="490" class="s" text-anchor="start">막는 것: 하트비트 500 ms 끊김 → 수평 + IDLE, 비상 정지, 각도 한계 ±lim</text><text x="706" y="471" class="s f-m" text-anchor="end"></text><path d="M720 83L754 83L754 403L726 403" class="ln c-org dash"/><polygon points="720,403 728.3,399.5 728.3,406.5" class="f-org"/><text x="762" y="220" class="xs f-org b" text-anchor="start">원측정</text><text x="762" y="235" class="xs f-org" text-anchor="start">dist_mm</text><text x="762" y="250" class="xs f-org" text-anchor="start">→ LQR·LQI·SMC</text><text x="762" y="265" class="xs f-org" text-anchor="start">gate 를 거치지</text><text x="762" y="280" class="xs f-org" text-anchor="start">않는다</text><text x="430" y="532" class="s b f-red" text-anchor="middle">빈틈: 트윈 기본(1.0.0 동작)에서는 범위 안(20~500 mm)의 이상값을 어느 층도 거르지 않는다.</text><text x="430" y="552" class="s b f-red" text-anchor="middle">1.1.0 gate 를 켜도 원측정을 쓰는 LQR·LQI·SMC 는 보호받지 못한다 → 실습 ④, 생각해 보기 5</text><text x="430" y="574" class="xs f-m" text-anchor="middle">개념도: 구조를 설명하기 위한 그림이며 측정·시뮬레이션 결과가 아니다</text>
</svg>
