<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 442" width="780" height="442" role="img" aria-labelledby="t d">
<title id="t">제어기별 트윈 강건성 성공률(step-nominal, n = 30)</title>
<desc id="d">가로 막대 그래프. step-nominal 시나리오에서 30개 파라미터 표본에 대한 성공률은 LQI 87%, LQR 77%, SMC sat 50%, PD p1 40%, PD 서보 재설계 30%, PD 슬라이드47 27%, PD 슬라이드48 20%, PID TL 10%이다. 오른쪽 열은 공칭 트윈 1회 실행의 성공 여부로, LQI·LQR·PD p1·PD 서보 재설계가 성공, 나머지는 실패다. 시뮬레이션 결과이며 트윈 파라미터는 가정값이다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="441" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="30" class="s b" text-anchor="start">step-nominal 시나리오, 몬테카를로 n = 30 (표본 0 = 공칭), 성공 = 마지막 2 s 참 위치 오차 ≤ 10 mm</text><text x="20" y="50" class="xs f-m" text-anchor="start">변동: 마찰 ±50 %, 서보 τ ±30 %, T<tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em"> ±50 %, κ ±10 %, 수평 오차 ±0.1°, 센서 잡음 ±50 %</tspan></text><line x1="250" y1="70" x2="250" y2="344" class="ln c-m thin dot"/><text x="250" y="362" class="s" text-anchor="middle">0 %</text><line x1="355" y1="70" x2="355" y2="344" class="ln c-m thin dot"/><text x="355" y="362" class="s" text-anchor="middle">25 %</text><line x1="460" y1="70" x2="460" y2="344" class="ln c-m thin dot"/><text x="460" y="362" class="s" text-anchor="middle">50 %</text><line x1="565" y1="70" x2="565" y2="344" class="ln c-m thin dot"/><text x="565" y="362" class="s" text-anchor="middle">75 %</text><line x1="670" y1="70" x2="670" y2="344" class="ln c-m thin dot"/><text x="670" y="362" class="s" text-anchor="middle">100 %</text><text x="460" y="384" class="s" text-anchor="middle">30개 표본 중 성공 비율</text><text x="710" y="64" class="xs b" text-anchor="middle">공칭 1회</text><text x="240" y="93" class="s" text-anchor="end">LQI</text><rect x="250" y="78" width="365.4" height="20" rx="3" class="f-blue" fill-opacity="0.75"/><text x="621.4" y="93" class="s b" text-anchor="start">87 %</text><text x="710" y="93" class="s f-grn b" text-anchor="middle">O 성공</text><text x="240" y="127" class="s" text-anchor="end">LQR</text><rect x="250" y="112" width="323.4" height="20" rx="3" class="f-blue" fill-opacity="0.75"/><text x="579.4" y="127" class="s b" text-anchor="start">77 %</text><text x="710" y="127" class="s f-grn b" text-anchor="middle">O 성공</text><text x="240" y="161" class="s" text-anchor="end">SMC sat</text><rect x="250" y="146" width="210" height="20" rx="3" class="f-pur" fill-opacity="0.75"/><text x="466" y="161" class="s b" text-anchor="start">50 %</text><text x="710" y="161" class="s f-red b" text-anchor="middle">X 실패</text><text x="240" y="195" class="s" text-anchor="end">PD p1 (1.0, 1.5)</text><rect x="250" y="180" width="168" height="20" rx="3" class="f-org" fill-opacity="0.75"/><text x="424" y="195" class="s b" text-anchor="start">40 %</text><text x="710" y="195" class="s f-grn b" text-anchor="middle">O 성공</text><text x="240" y="229" class="s" text-anchor="end">PD 서보 재설계 (0.5, 1.25)</text><rect x="250" y="214" width="126" height="20" rx="3" class="f-org" fill-opacity="0.75"/><text x="382" y="229" class="s b" text-anchor="start">30 %</text><text x="710" y="229" class="s f-grn b" text-anchor="middle">O 성공</text><text x="240" y="263" class="s" text-anchor="end">PD 슬라이드47</text><rect x="250" y="248" width="113.4" height="20" rx="3" class="f-org" fill-opacity="0.75"/><text x="369.4" y="263" class="s b" text-anchor="start">27 %</text><text x="710" y="263" class="s f-red b" text-anchor="middle">X 실패</text><text x="240" y="297" class="s" text-anchor="end">PD 슬라이드48</text><rect x="250" y="282" width="84" height="20" rx="3" class="f-org" fill-opacity="0.75"/><text x="340" y="297" class="s b" text-anchor="start">20 %</text><text x="710" y="297" class="s f-red b" text-anchor="middle">X 실패</text><text x="240" y="331" class="s" text-anchor="end">PID TL</text><rect x="250" y="316" width="42" height="20" rx="3" class="f-org" fill-opacity="0.75"/><text x="298" y="331" class="s b" text-anchor="start">10 %</text><text x="710" y="331" class="s f-red b" text-anchor="middle">X 실패</text><text x="20" y="408" class="xs" text-anchor="start">공칭 트윈 1회에서 성공(O)한 PD p1·PD 서보 재설계도 변동 표본의 30~40 %에서만 성공했다. 1회 성공은 강건성의 근거가 아니다.</text><text x="20" y="426" class="xs f-m" text-anchor="start">[시뮬레이션] 트윈 파라미터는 모두 [가정]. 동특성은 실측 미검증. 출처: docs/theory/digital-twin.md §6 (report_robustness.mjs 30, 2026-11-03)</text>
</svg>
