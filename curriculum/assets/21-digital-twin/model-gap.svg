<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 406" width="780" height="406" role="img" aria-labelledby="t d">
<title id="t">설계 모델과 디지털 트윈의 구조 비교</title>
<desc id="d">위는 제어기 설계에 쓴 선형 설계 모델로, 서보 1차+지연+속도 한계, 공·빔 K_b/s², 센서 필터 세 블록뿐이다. 아래는 디지털 트윈으로, 호스트의 정수 명령과 통신 지연, PWM 20 ms 프레임과 1 µs 양자화, 서보 지연·시정수·속도 한계·데드밴드, 링크 백래시, sin 레버와 수평 오차, 마찰·멈춤판이 있는 공, 잡음·이상값·유실·지연이 있는 초음파 센서, 트윈 기본(despike 0, 펌웨어 1.0.0 동작)에서는 이상값을 거르지 않는 펌웨어 필터를 거쳐 제어기로 돌아온다(펌웨어 1.1.0 의 이상값 제거 gate 는 그림 3). 참 상태는 화면과 채점에만 쓰고 제어기에는 가지 않는다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="405" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="30" class="b s" text-anchor="start">① 설계 모델 (04·08·13·14장에서 제어기를 만들 때 쓴 것)</text><line x1="24" y1="80" x2="64" y2="80" class="ln c-k "/><polygon points="70,80 61.7,83.5 61.7,76.5" class="f-k"/><text x="24" y="70" class="b" text-anchor="start">u</text><rect x="70" y="56" width="150" height="48" rx="6" class="box"/><text x="145" y="77" class="b" text-anchor="middle">G<tspan dy="0.35em" font-size="72%">servo</tspan><tspan dy="-0.35em">(s)</tspan></text><text x="145" y="95" class="s" text-anchor="middle">1차 + 지연 + 속도 한계</text><line x1="220" y1="80" x2="262" y2="80" class="ln c-k "/><polygon points="268,80 259.7,83.5 259.7,76.5" class="f-k"/><text x="232" y="70" class="b" text-anchor="start">θ</text><rect x="268" y="56" width="130" height="48" rx="6" class="box"/><text x="333" y="77" class="b" text-anchor="middle">K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em"> / s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan></text><text x="333" y="95" class="s" text-anchor="middle">선형, K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em"> = 0.8709</tspan></text><line x1="398" y1="80" x2="440" y2="80" class="ln c-k "/><polygon points="446,80 437.7,83.5 437.7,76.5" class="f-k"/><text x="412" y="70" class="b" text-anchor="start">y</text><rect x="446" y="56" width="150" height="48" rx="6" class="box"/><text x="521" y="77" class="b" text-anchor="middle">센서 필터 α</text><text x="521" y="95" class="s" text-anchor="middle">60 ms 샘플링</text><line x1="596" y1="80" x2="644" y2="80" class="ln c-k "/><polygon points="650,80 641.7,83.5 641.7,76.5" class="f-k"/><text x="606" y="70" class="b s" text-anchor="start">y<tspan dy="0.35em" font-size="72%">meas</tspan></text><text x="660" y="76" class="xs f-m" text-anchor="start">마찰·수평 오차·</text><text x="660" y="92" class="xs f-m" text-anchor="start">유격 없음</text><text x="20" y="150" class="b s" text-anchor="start">② 디지털 트윈 (21장: 같은 제어기를 이 위에서 시험)</text><rect x="20" y="172" width="118" height="54" rx="6" class="box"/><text x="79" y="196" class="b" text-anchor="middle">호스트</text><text x="79" y="214" class="s" text-anchor="middle">cdeg 정수, 지연 8 ms</text><line x1="138" y1="199" x2="152" y2="199" class="ln c-k "/><polygon points="158,199 149.7,202.5 149.7,195.5" class="f-k"/><rect x="158" y="172" width="128" height="54" rx="6" class="box"/><text x="222" y="196" class="b" text-anchor="middle">PWM</text><text x="222" y="214" class="s" text-anchor="middle">20 ms 프레임, 1 µs</text><line x1="286" y1="199" x2="300" y2="199" class="ln c-k "/><polygon points="306,199 297.7,202.5 297.7,195.5" class="f-k"/><rect x="306" y="172" width="150" height="54" rx="6" class="box"/><text x="381" y="196" class="b" text-anchor="middle">서보 모터 θ<tspan dy="0.35em" font-size="72%">m</tspan></text><text x="381" y="214" class="s" text-anchor="middle">T<tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em">, τ, ω</tspan><tspan dy="0.35em" font-size="72%">max</tspan><tspan dy="-0.35em">, 데드밴드 δ</tspan></text><line x1="456" y1="199" x2="470" y2="199" class="ln c-k "/><polygon points="476,199 467.7,202.5 467.7,195.5" class="f-k"/><rect x="476" y="172" width="118" height="54" rx="6" class="box"/><text x="535" y="196" class="b" text-anchor="middle">링크 θ<tspan dy="0.35em" font-size="72%">b</tspan></text><text x="535" y="214" class="s" text-anchor="middle">백래시 β</text><line x1="594" y1="199" x2="608" y2="199" class="ln c-k "/><polygon points="614,199 605.7,202.5 605.7,195.5" class="f-k"/><rect x="614" y="172" width="146" height="54" rx="6" class="box"/><text x="687" y="196" class="b" text-anchor="middle">빔 α</text><text x="687" y="214" class="s" text-anchor="middle">sin 레버 + 수평 오차 α<tspan dy="0.35em" font-size="72%">0</tspan></text><path d="M687 226L687 262" class="ln c-k "/><polygon points="687,268 683.5,259.7 690.5,259.7" class="f-k"/><rect x="586" y="268" width="174" height="54" rx="6" class="box"/><text x="673" y="292" class="b" text-anchor="middle">공 (참 위치 y)</text><text x="673" y="310" class="s" text-anchor="middle">구름·정지 마찰, κ, 멈춤판</text><line x1="586" y1="295" x2="546" y2="295" class="ln c-k "/><polygon points="540,295 548.3,291.5 548.3,298.5" class="f-k"/><rect x="380" y="268" width="160" height="54" rx="6" class="box"/><text x="460" y="292" class="b" text-anchor="middle">초음파 센서</text><text x="460" y="310" class="s" text-anchor="middle">잡음 σ, 이상값, 유실, 지연</text><line x1="380" y1="295" x2="340" y2="295" class="ln c-k "/><polygon points="334,295 342.3,291.5 342.3,298.5" class="f-k"/><rect x="184" y="268" width="150" height="54" rx="6" class="box"/><text x="259" y="292" class="b" text-anchor="middle">펌웨어 필터 α</text><text x="259" y="310" class="s" text-anchor="middle">트윈 기본: 이상값 통과</text><line x1="184" y1="295" x2="144" y2="295" class="ln c-k "/><polygon points="138,295 146.3,291.5 146.3,298.5" class="f-k"/><text x="161" y="287" class="xs" text-anchor="middle">D 줄</text><rect x="20" y="268" width="118" height="54" rx="6" class="box"/><text x="79" y="292" class="b" text-anchor="middle">제어기</text><text x="79" y="310" class="s" text-anchor="middle">센서 출력만 받음</text><path d="M79 268L79 232" class="ln c-k "/><polygon points="79,226 82.5,234.3 75.5,234.3" class="f-k"/><path d="M673 322L673 356L506 356" class="ln c-org dash"/><polygon points="500,356 508.3,352.5 508.3,359.5" class="f-org"/><text x="492" y="361" class="s f-org" text-anchor="end">참 상태(공 위치·속도, 각도) → 화면 애니메이션·채점에만 쓴다. 제어기로는 가지 않는다</text><text x="390" y="392" class="xs f-m" text-anchor="middle">개념도: 구조를 설명하기 위한 그림이며 측정·시뮬레이션 결과가 아니다</text>
</svg>
