" y2="255.4" class="ln c-grn thick dash"/><circle cx="220" cy="202.7" r="5" class="f-grn"/><text x="366" y="275.4" class="s b f-grn" text-anchor="end">D: 지금의 기울기</text><rect x="486" y="58" width="262" height="66" rx="8" class="bx-blue"/><text x="498" y="80" class="b" text-anchor="start">P · 현재</text><text x="498" y="98" class="s" text-anchor="start">지금 오차가 크면 많이, 작으면 조금</text><text x="498" y="115" class="xs b f-blue" text-anchor="start">빠르기를 정한다. 혼자서는 진동</text><rect x="486" y="134" width="262" height="66" rx="8" class="bx-org"/><text x="498" y="156" class="b" text-anchor="start">I · 과거</text><text x="498" y="174" class="s" text-anchor="start">오차가 남아 있는 한 계속 쌓는다</text><text x="498" y="191" class="xs b f-org" text-anchor="start">남는 오차를 없앤다. 대가는 오버슈트</text><rect x="486" y="210" width="262" height="66" rx="8" class="bx-grn"/><text x="498" y="232" class="b" text-anchor="start">D · 미래</text><text x="498" y="250" class="s" text-anchor="start">오차가 줄어드는 속도를 보고 미리 줄인다</text><text x="498" y="267" class="xs b f-grn" text-anchor="start">브레이크. 진동을 잡는다</text>
</svg>
