<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
<title id="t">PID 세 항이 보는 것</title>
<desc id="d">시간에 따라 줄어드는 오차 곡선. 지금 시각에서 P 항은 곡선의 높이(지금의 오차), I 항은 지금까지 곡선 아래 넓이(쌓인 오차), D 항은 곡선의 기울기(오차가 변하는 속도)를 본다. 오른쪽 카드: P는 현재를 보고 빠르기를 정하지만 혼자서는 진동하고, I는 과거를 쌓아 남는 오차를 없애는 대신 오버슈트를 부르고, D는 미래를 보는 브레이크로 진동을 잡는다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
