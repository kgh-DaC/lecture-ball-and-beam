<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" role="img" aria-labelledby="t d">
<title id="t">P, PD, PID 응답 비교</title>
<desc id="d">150 mm에서 200 mm로 가는 스텝에 대한 세 응답(앱 시뮬레이터, 서보 무시 모델, 60 ms 샘플링, 필터 α 0.2). P만(Kp 1)은 진동이 점점 커져 빔 끝에 닿는다. PD(Kp 1, Kd 1.5)는 오버슈트 약 3.8%로 목표에 선다. PID(Ki 0.2 추가)는 이 모델에 수평 오차가 없어 오버슈트만 약 28%로 커진다.</desc>
