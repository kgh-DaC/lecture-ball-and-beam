<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 285" width="660" height="285" role="img" aria-labelledby="t d">
<title id="t">PID 제어기 블록선도</title>
<desc id="d">목표 r과 측정 y의 차이 e가 세 갈래로 나뉜다: Kp·e(현재 오차), Ki·∫e dt(과거 오차 누적), Kd·de/dt(오차 변화 속도, 미래 예측). 세 항을 더한 u가 서보 각 θ가 되어 볼앤빔 K_b/s²를 움직이고, 초음파 센서로 잰 y가 되먹임된다.</desc>
