<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 305" width="640" height="305" role="img" aria-labelledby="t d">
<title id="t">on/off 제어와 비례 제어의 명령 특성</title>
<desc id="d">왼쪽: on/off 제어는 오차의 부호만 보고 명령을 +최대 또는 −최대로 낸다. 오른쪽: 비례 제어는 오차에 비례하는 명령 u = Kp·e를 내고, 오차가 크면 출력 한계에서 포화된다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="639" height="304" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="150" y="30" class="b" text-anchor="middle">on/off 제어</text><line x1="30" y1="150" x2="274" y2="150" class="ln c-m thin"/><polygon points="280,150 271.7,153.5 271.7,146.5" class="f-m"/><line x1="155" y1="270" x2="155" y2="50" class="ln c-m thin"/><polygon points="155,44 158.5,52.3 151.5,52.3" class="f-m"/><text x="278" y="168" class="s" text-anchor="end">오차 e</text><text x="162" y="54" class="s" text-anchor="start">명령 u</text><path d="M40 230L155 230L155 70L270 70" class="ln c-red thick"/><text x="160" y="82" class="xs" text-anchor="start">+최대</text><text x="46" y="222" class="xs" text-anchor="start">−최대</text><text x="150" y="292" class="s" text-anchor="middle">조금만 틀려도 최대로 → 덜컥거림</text><text x="460" y="30" class="b" text-anchor="middle">비례(P) 제어</text><line x1="340" y1="150" x2="584" y2="150" class="ln c-m thin"/><polygon points="590,150 581.7,153.5 581.7,146.5" class="f-m"/><line x1="465" y1="270" x2="465" y2="50" class="ln c-m thin"/><polygon points="465,44 468.5,52.3 461.5,52.3" class="f-m"/><text x="588" y="168" class="s" text-anchor="end">오차 e</text><text x="472" y="54" class="s" text-anchor="start">명령 u</text><path d="M350 230L405 230L525 70L580 70" class="ln c-blue thick"/><text x="490" y="128" class="s b" text-anchor="start">기울기 = Kp</text><text x="530" y="64" class="xs" text-anchor="start">한계(포화)</text><text x="460" y="292" class="s" text-anchor="middle">오차에 비례해서 → 부드럽게</text>
</svg>
