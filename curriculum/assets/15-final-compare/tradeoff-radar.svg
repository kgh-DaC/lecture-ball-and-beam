<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">여섯 기준 레이더 차트 읽는 법</title>
<desc id="d">성능, 제어 노력, 강인성, 모델 의존도, 튜닝 노력, 구현·이해 여섯 축을 상/중/하로 나눈 레이더 차트. 가상의 예로, 제어기 X(주황 점선)는 성능은 높지만 다른 축이 낮고, 제어기 Y(파란 실선)는 고르게 중상이다. 실제 값이 아니라 읽는 법을 보이는 그림이다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="399" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<polygon points="250,165 293.3,190 293.3,240 250,265 206.7,240 206.7,190" class="grid"/><polygon points="250,115 336.6,165 336.6,265 250,315 163.4,265 163.4,165" class="grid"/><polygon points="250,65 379.9,140 379.9,290 250,365 120.1,290 120.1,140" class="grid"/><line x1="250" y1="215" x2="250" y2="65" class="ln c-m thin"/><text x="250" y="44.5" class="s b" text-anchor="middle">성능</text><line x1="250" y1="215" x2="379.9" y2="140" class="ln c-m thin"/><text x="402" y="132.3" class="s b" text-anchor="middle">제어 노력</text><line x1="250" y1="215" x2="379.9" y2="290" class="ln c-m thin"/><text x="402" y="307.8" class="s b" text-anchor="middle">강인성</text><line x1="250" y1="215" x2="250" y2="365" class="ln c-m thin"/><text x="250" y="395.5" class="s b" text-anchor="middle">모델 의존도</text><line x1="250" y1="215" x2="120.1" y2="290" class="ln c-m thin"/><text x="98" y="307.8" class="s b" text-anchor="middle">튜닝 노력</text><line x1="250" y1="215" x2="120.1" y2="140" class="ln c-m thin"/><text x="98" y="132.3" class="s b" text-anchor="middle">구현·이해</text><text x="254" y="169" class="xs f-m" text-anchor="start">하</text><text x="254" y="119" class="xs f-m" text-anchor="start">중</text><text x="254" y="79" class="xs f-m" text-anchor="start">상</text><polygon points="250,80 302,185 315,252.5 250,267.5 172.1,260 191.5,181.3" class="ln c-org f-org" fill-opacity="0.18" stroke-dasharray="7 5"/><polygon points="250,117.5 353.9,155 360.4,278.8 250,327.5 146.1,275 139.6,151.3" class="ln c-blue f-blue" fill-opacity="0.15"/><text x="470" y="80" class="b l" text-anchor="start">읽는 법</text><text x="470" y="108" class="s" text-anchor="start">• 축마다 상/중/하 (바깥 = 유리)</text><text x="470" y="130" class="s" text-anchor="start">• 모델 의존도·튜닝 노력도</text><text x="482" y="148" class="s" text-anchor="start">"적을수록 바깥"으로 맞춘다</text><text x="470" y="170" class="s" text-anchor="start">• 넓이가 아니라 모양을 본다:</text><text x="482" y="188" class="s" text-anchor="start">어디서 강하고 어디서 약한가</text><line x1="470" y1="222" x2="500" y2="222" class="ln c-org thick dash"/><text x="508" y="227" class="s" text-anchor="start">제어기 X (가상의 예)</text><line x1="470" y1="248" x2="500" y2="248" class="ln c-blue thick"/><text x="508" y="253" class="s" text-anchor="start">제어기 Y (가상의 예)</text><text x="470" y="290" class="xs" text-anchor="start">X: 성능은 높지만 노력·모델이 많이 듦</text><text x="470" y="308" class="xs" text-anchor="start">Y: 성능은 중간, 나머지가 고름</text><text x="470" y="360" class="xs f-m" text-anchor="start">[가정] 실제 칸은 2·3절 내 데이터로 채운다</text>
</svg>
