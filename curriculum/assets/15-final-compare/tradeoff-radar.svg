<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t d">
<title id="t">여섯 기준 레이더 읽는 법</title>
<desc id="d">성능, 제어 노력, 강인성, 모델 의존도, 튜닝 노력, 구현·이해 여섯 축의 레이더 차트. 바깥이 좋고 안쪽이 나쁘다(앱 final-compare 레이더와 같은 방향). 가상의 제어기 X는 성능 축만 바깥이고 나머지는 안쪽이며, 가상의 제어기 Y는 고르게 중간~바깥이다. 실제 값이 아니라 읽는 법을 보이는 그림.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="399" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="28" class="b" text-anchor="start">여섯 기준 레이더 읽는 법 (가상의 예) — 앱의 레이더와 같이 바깥이 좋다</text><polygon points="230.0,163.3 270.4,186.7 270.4,233.3 230.0,256.7 189.6,233.3 189.6,186.7" class="grid"/><polygon points="230.0,116.7 310.8,163.3 310.8,256.7 230.0,303.3 149.2,256.7 149.2,163.3" class="grid"/><polygon points="230.0,70.0 351.2,140.0 351.2,280.0 230.0,350.0 108.8,280.0 108.8,140.0" class="grid"/><line x1="230" y1="210" x2="230" y2="70" class="ln c-m thin"/><text x="230" y="51.2" class="s b" text-anchor="middle">성능</text><line x1="230" y1="210" x2="351.2" y2="140" class="ln c-m thin"/><text x="371.9" y="133.1" class="s b" text-anchor="middle">제어 노력</text><line x1="230" y1="210" x2="351.2" y2="280" class="ln c-m thin"/><text x="371.9" y="296.9" class="s b" text-anchor="middle">강인성</text><line x1="230" y1="210" x2="230" y2="350" class="ln c-m thin"/><text x="230" y="378.8" class="s b" text-anchor="middle">모델 의존도</text><line x1="230" y1="210" x2="108.8" y2="280" class="ln c-m thin"/><text x="88.1" y="296.9" class="s b" text-anchor="middle">튜닝 노력</text><line x1="230" y1="210" x2="108.8" y2="140" class="ln c-m thin"/><text x="88.1" y="133.1" class="s b" text-anchor="middle">구현·이해</text><text x="159.4" y="103" class="xs b f-m" text-anchor="end">좋음(바깥)</text><polygon points="230.0,70.0 270.4,186.7 278.5,238.0 230.0,256.7 187.6,234.5 175.4,178.5" class="bx-org" style="fill-opacity:.10;stroke-dasharray:7 5"/><polygon points="230.0,116.7 333.1,150.5 327.0,266.0 230.0,336.0 126.9,269.5 120.9,147.0" class="bx-blue" style="fill-opacity:.15"/><text x="470" y="70" class="l b" text-anchor="start">읽는 법</text><text x="470" y="98" class="s" text-anchor="start">• 축마다 나쁨(안쪽)/보통/좋음(바깥)</text><text x="470" y="120" class="s" text-anchor="start">• 2절 final-compare 레이더도</text><text x="482" y="138" class="s" text-anchor="start">같은 방향(바깥일수록 좋음)이다</text><text x="470" y="160" class="s" text-anchor="start">• 넓이가 아니라 모양을 본다:</text><text x="482" y="178" class="s" text-anchor="start">어디서 강하고 어디서 약한가</text><rect x="470" y="204" width="22" height="12" rx="2" class="bx-org"/><text x="500" y="215" class="s b f-org" text-anchor="start">제어기 X: 성능만 좋음(바깥)</text><rect x="470" y="232" width="22" height="12" rx="2" class="bx-blue"/><text x="500" y="243" class="s b f-blue" text-anchor="start">제어기 Y: 고르게 보통~좋음</text><text x="470" y="290" class="xs f-m" text-anchor="start">[가정] 실제 칸은 2·3절의 내 데이터로</text><text x="470" y="304" class="xs f-m" text-anchor="start">근거를 붙여 채운다</text>
</svg>
