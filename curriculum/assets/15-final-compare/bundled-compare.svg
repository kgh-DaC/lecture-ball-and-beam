<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" width="800" height="366" role="img" aria-labelledby="t d">
<title id="t">번들 슬롯 대표 샘플 비교</title>
<desc id="d">번들 슬롯 대표 샘플 네 개(PD, T-L 오토튜닝, LQR, SMC)의 저장된 지표. PD (1.0, 1.5): 오버슈트 10.0%, 정착 5.6 s, u_tv 15°, ITAE 99; T-L 오토튜닝: 오버슈트 10.0%, 정착 미정착, u_tv 28°, ITAE 200; LQR (r 3.65): 오버슈트 7.6%, 정착 5.0 s, u_tv 73°, ITAE 55; SMC (sat): 오버슈트 2.0%, 정착 6.6 s, u_tv 131°, ITAE 94. 모두 가정 서보 시뮬레이션이다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="799" height="365" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="40" y="28" class="b" text-anchor="start">번들 슬롯 대표 샘플끼리의 비교 (모두 시뮬레이션, 가정 서보, 표준 스텝 P1)</text><text x="40" y="58" class="s b" text-anchor="start">오버슈트 (%)</text><line x1="40" y1="260" x2="200" y2="260" class="ln c-k "/><rect x="48" y="101.7" width="30" height="158.3" rx="3" class="bx-org"/><text x="63" y="96.7" class="xs b" text-anchor="middle">10.0</text><rect x="86" y="100.9" width="30" height="159.1" rx="3" class="bx-pur"/><text x="101" y="95.9" class="xs b" text-anchor="middle">10.0</text><rect x="124" y="139.4" width="30" height="120.6" rx="3" class="bx-blue"/><text x="139" y="134.4" class="xs b" text-anchor="middle">7.6</text><rect x="162" y="228.9" width="30" height="31.1" rx="3" class="bx-grn"/><text x="177" y="223.9" class="xs b" text-anchor="middle">2.0</text><text x="230" y="58" class="s b" text-anchor="start">정착시간 (s)</text><line x1="230" y1="260" x2="390" y2="260" class="ln c-k "/><rect x="238" y="126.1" width="30" height="134" rx="3" class="bx-org"/><text x="253" y="121.1" class="xs b" text-anchor="middle">5.6</text><text x="291" y="252" class="xs b f-red" text-anchor="middle">미정착</text><rect x="314" y="140.3" width="30" height="119.7" rx="3" class="bx-blue"/><text x="329" y="135.3" class="xs b" text-anchor="middle">5.0</text><rect x="352" y="103.3" width="30" height="156.8" rx="3" class="bx-grn"/><text x="367" y="98.3" class="xs b" text-anchor="middle">6.6</text><text x="420" y="58" class="s b" text-anchor="start">u<tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em"> (°)</tspan></text><line x1="420" y1="260" x2="580" y2="260" class="ln c-k "/><rect x="428" y="239.9" width="30" height="20.1" rx="3" class="bx-org"/><text x="443" y="234.9" class="xs b" text-anchor="middle">15</text><rect x="466" y="221.8" width="30" height="38.2" rx="3" class="bx-pur"/><text x="481" y="216.8" class="xs b" text-anchor="middle">28</text><rect x="504" y="161.3" width="30" height="98.7" rx="3" class="bx-blue"/><text x="519" y="156.3" class="xs b" text-anchor="middle">73</text><rect x="542" y="81.8" width="30" height="178.2" rx="3" class="bx-grn"/><text x="557" y="76.8" class="xs b" text-anchor="middle">131</text><text x="610" y="58" class="s b" text-anchor="start">ITAE</text><line x1="610" y1="260" x2="770" y2="260" class="ln c-k "/><rect x="618" y="174.6" width="30" height="85.4" rx="3" class="bx-org"/><text x="633" y="169.6" class="xs b" text-anchor="middle">99</text><rect x="656" y="86.9" width="30" height="173.1" rx="3" class="bx-pur"/><text x="671" y="81.9" class="xs b" text-anchor="middle">200</text><rect x="694" y="212.4" width="30" height="47.6" rx="3" class="bx-blue"/><text x="709" y="207.4" class="xs b" text-anchor="middle">55</text><rect x="732" y="178.7" width="30" height="81.3" rx="3" class="bx-grn"/><text x="747" y="173.7" class="xs b" text-anchor="middle">94</text><rect x="40" y="292" width="18" height="12" rx="2" class="bx-org"/><text x="64" y="303" class="s b" text-anchor="start">PD (1.0, 1.5)</text><text x="64" y="320" class="xs f-m" text-anchor="start">pid-best = sim-pid-p1</text><rect x="230" y="292" width="18" height="12" rx="2" class="bx-pur"/><text x="254" y="303" class="s b" text-anchor="start">T-L 오토튜닝</text><text x="254" y="320" class="xs f-m" text-anchor="start">autotune-best = sim-pid-tl</text><rect x="420" y="292" width="18" height="12" rx="2" class="bx-blue"/><text x="444" y="303" class="s b" text-anchor="start">LQR (r 3.65)</text><text x="444" y="320" class="xs f-m" text-anchor="start">lqr-best = sim-lqr</text><rect x="610" y="292" width="18" height="12" rx="2" class="bx-grn"/><text x="634" y="303" class="s b" text-anchor="start">SMC (sat)</text><text x="634" y="320" class="xs f-m" text-anchor="start">smc-best = sim-smc-sat</text><text x="40" y="350" class="xs f-m" text-anchor="start">주의: T-L의 오버슈트 10%는 8 s 창의 앱 지표다(설정값 기준 21%, 11장). LQR·SMC는 원측정값 + 관측기, PD·T-L은 필터값을 쓴다(14장).</text>
</svg>
