<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 322" width="770" height="322" role="img" aria-labelledby="t d">
<title id="t">제어기 다섯 가지 한눈에 보기</title>
<desc id="d">06 수동 PID(모델 거의 불필요, 시행착오), 11 오토튜닝(모델 불필요, 릴레이 실험과 규칙), 12 적응형 PID(스케줄 규칙 또는 기준 모델, 운전점·공 변화 대응), 13 LQR(상태공간 모델과 관측기, Q·R로 성능-노력 균형), 14 슬라이딩모드(공칭 모델과 오차 상한, 모델 오차에 강인)를 나열하고, 15장에서 같은 조건과 검증 도구로 비교함을 보인다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="769" height="321" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="20" y="50" width="130" height="120" rx="8" class="box"/><text x="85" y="78" class="s b" text-anchor="middle">06 수동 PID</text><line x1="30" y1="90" x2="140" y2="90" class="ln c-m thin"/><text x="85" y="115" class="xs" text-anchor="middle">모델: 거의 불필요</text><text x="85" y="145" class="xs b" text-anchor="middle">시행착오 4~6회</text><line x1="150" y1="110" x2="164" y2="110" class="ln c-k "/><polygon points="170,110 161.7,113.5 161.7,106.5" class="f-k"/><rect x="170" y="50" width="130" height="120" rx="8" class="box"/><text x="235" y="78" class="s b" text-anchor="middle">11 오토튜닝</text><line x1="180" y1="90" x2="290" y2="90" class="ln c-m thin"/><text x="235" y="115" class="xs" text-anchor="middle">모델: 불필요</text><text x="235" y="145" class="xs b" text-anchor="middle">릴레이 실험 + 규칙</text><line x1="300" y1="110" x2="314" y2="110" class="ln c-k "/><polygon points="320,110 311.7,113.5 311.7,106.5" class="f-k"/><rect x="320" y="50" width="130" height="120" rx="8" class="box"/><text x="385" y="78" class="s b" text-anchor="middle">12 적응형 PID</text><line x1="330" y1="90" x2="440" y2="90" class="ln c-m thin"/><text x="385" y="115" class="xs" text-anchor="middle">규칙 또는 기준 모델</text><text x="385" y="145" class="xs b" text-anchor="middle">운전점·공 변화 대응</text><line x1="450" y1="110" x2="464" y2="110" class="ln c-k "/><polygon points="470,110 461.7,113.5 461.7,106.5" class="f-k"/><rect x="470" y="50" width="130" height="120" rx="8" class="box"/><text x="535" y="78" class="s b" text-anchor="middle">13 LQR</text><line x1="480" y1="90" x2="590" y2="90" class="ln c-m thin"/><text x="535" y="115" class="xs" text-anchor="middle">상태공간 모델 + 관측기</text><text x="535" y="145" class="xs b" text-anchor="middle">Q·R로 성능-노력 균형</text><line x1="600" y1="110" x2="614" y2="110" class="ln c-k "/><polygon points="620,110 611.7,113.5 611.7,106.5" class="f-k"/><rect x="620" y="50" width="130" height="120" rx="8" class="box"/><text x="685" y="78" class="s b" text-anchor="middle">14 슬라이딩모드</text><line x1="630" y1="90" x2="740" y2="90" class="ln c-m thin"/><text x="685" y="115" class="xs" text-anchor="middle">공칭 모델 + 상한 η</text><text x="685" y="145" class="xs b" text-anchor="middle">모델 오차에 강인</text><text x="20" y="32" class="b" text-anchor="start">이 교재에서 만난 제어기: 각각 무엇이 필요하고 무엇을 얻나</text><path d="M85 175L85 205L685 205L685 175" class="ln c-m thin"/><line x1="385" y1="205" x2="385" y2="229" class="ln c-k "/><polygon points="385,235 381.5,226.7 388.5,226.7" class="f-k"/><rect x="205" y="235" width="360" height="50" rx="6" class="box"/><text x="385" y="257" class="b" text-anchor="middle">15장: 같은 조건(P1)·검증 도구로 비교</text><text x="385" y="275" class="s" text-anchor="middle">평균 ± 편차, 출처(실측/시뮬레이션) 분리</text><text x="20" y="310" class="xs f-m" text-anchor="start">가운데 줄 = 설계에 필요한 것, 굵은 줄 = 주된 장점(본문 각 장 요약)</text>
</svg>
