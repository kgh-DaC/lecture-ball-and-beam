<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="t d">
<title id="t">설계 사양을 s평면 영역으로</title>
<desc id="d">s평면에서 오버슈트 5% 미만(감쇠비 0.69 이상, 음의 실수축에서 ±46° 안쪽)과 정착시간 3초 미만(실수부 −1 왼쪽)을 동시에 만족하는 영역을 칠했다. 슬라이드 47 PD의 극점 −0.43 ± 0.56j는 영역 밖, ζ = 0.75, ωn = 1.5 극점 −1.13 ± 0.99j는 영역 안에 있다.</desc>
