<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 360" width="790" height="360" role="img" aria-labelledby="t d">
<title id="t">설계 사양을 s평면 영역으로</title>
<desc id="d">s평면에서 오버슈트 5% 미만(감쇠비 0.69 이상, 음의 실수축에서 ±46° 안쪽)과 정착시간 3초 미만(실수부 −1 왼쪽)을 동시에 만족하는 영역을 칠했다. 슬라이드 47 PD의 극점 −0.45 ± 0.56j는 영역 밖, ζ = 0.75, ωn = 1.5 극점 −1.13 ± 0.99j는 영역 안에 있다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="789" height="359" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<polygon points="341.1,85.7 269.2,34 40,34 40,334 269.2,334 341.1,282.3" class="zone"/><line x1="40" y1="184" x2="554" y2="184" class="ln c-k "/><polygon points="560,184 551.7,187.5 551.7,180.5" class="f-k"/><line x1="477.9" y1="334" x2="477.9" y2="34" class="ln c-k "/><polygon points="477.9,28 481.4,36.3 474.4,36.3" class="f-k"/><text x="558" y="202" class="s" text-anchor="end">Re(s)</text><text x="485.9" y="38" class="s" text-anchor="start">Im(s)</text><line x1="477.9" y1="184" x2="269.2" y2="34" class="ln c-grn dash"/><line x1="477.9" y1="184" x2="269.2" y2="334" class="ln c-grn dash"/><line x1="341.1" y1="34" x2="341.1" y2="334" class="ln c-org dash"/><line x1="67.4" y1="180" x2="67.4" y2="188" class="ln c-k "/><text x="62.4" y="202" class="s" text-anchor="end">−3</text><line x1="204.2" y1="180" x2="204.2" y2="188" class="ln c-k "/><text x="199.2" y="202" class="s" text-anchor="end">−2</text><line x1="341.1" y1="180" x2="341.1" y2="188" class="ln c-k "/><text x="336.1" y="202" class="s" text-anchor="end">−1</text><path d="M 402.6 184 A 75.3 75.3 0 0 1 426 146.7" class="ln c-grn "/><text x="393.1" y="165.3" class="s b f-grn" text-anchor="end">46°</text><text x="156.3" y="125.9" class="b f-grn" text-anchor="middle">사양을 만족하는 영역</text><text x="156.3" y="143.9" class="s" text-anchor="middle">(두 조건이 겹치는 곳)</text><line x1="410.7" y1="125.3" x2="422.7" y2="137.3" class="ln c-red thick"/><line x1="410.7" y1="137.3" x2="422.7" y2="125.3" class="ln c-red thick"/><line x1="410.7" y1="230.7" x2="422.7" y2="242.7" class="ln c-red thick"/><line x1="410.7" y1="242.7" x2="422.7" y2="230.7" class="ln c-red thick"/><line x1="317.9" y1="85" x2="329.9" y2="97" class="ln c-blue thick"/><line x1="317.9" y1="97" x2="329.9" y2="85" class="ln c-blue thick"/><line x1="317.9" y1="271" x2="329.9" y2="283" class="ln c-blue thick"/><line x1="317.9" y1="283" x2="329.9" y2="271" class="ln c-blue thick"/><line x1="590" y1="70" x2="612" y2="70" class="ln c-grn dash"/><text x="620" y="67" class="s b f-grn" text-anchor="start">ζ = 0.69 선</text><text x="620" y="83" class="xs" text-anchor="start">P.O. &lt; 5% → 이 선 안쪽</text><line x1="590" y1="122" x2="612" y2="122" class="ln c-org dash"/><text x="620" y="119" class="s b f-org" text-anchor="start">Re(s) = −1</text><text x="620" y="135" class="xs" text-anchor="start">t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em"> &lt; 3 s (±5%) → 왼쪽</tspan></text><line x1="595" y1="168" x2="607" y2="180" class="ln c-red thick"/><line x1="595" y1="180" x2="607" y2="168" class="ln c-red thick"/><text x="620" y="171" class="s b f-red" text-anchor="start">슬라이드 47 PD</text><text x="620" y="187" class="xs" text-anchor="start">−0.45 ± 0.56j : 영역 밖</text><line x1="595" y1="220" x2="607" y2="232" class="ln c-blue thick"/><line x1="595" y1="232" x2="607" y2="220" class="ln c-blue thick"/><text x="620" y="223" class="s b f-blue" text-anchor="start">ζ = 0.75, ω<tspan dy="0.35em" font-size="72%">n</tspan><tspan dy="-0.35em"> = 1.5</tspan></text><text x="620" y="239" class="xs" text-anchor="start">−1.13 ± 0.99j : 영역 안</text><text x="590" y="290" class="xs f-m" text-anchor="start">영점 없는 2차 시스템 기준.</text><text x="590" y="305" class="xs f-m" text-anchor="start">K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em"> = 0.8993</tspan></text>
</svg>
