<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 355" width="740" height="355" role="img" aria-labelledby="t d">
<title id="t">비례 제어와 PD 제어의 근궤적 비교</title>
<desc id="d">왼쪽: 이중 적분기에 비례 제어만 걸면 원점의 두 극점이 허수축을 따라 위아래로만 움직인다. 오른쪽: PD는 영점 −z를 만들고, 두 극점은 영점을 중심으로 하는 원을 따라 왼쪽으로 돌아 −2z에서 실수축에 들어온 뒤 하나는 영점으로, 하나는 왼쪽 무한대로 간다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="739" height="354" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="30" y="30" class="b" text-anchor="start">비례(P)만: 허수축에 갇힘</text><line x1="30" y1="180" x2="324" y2="180" class="ln c-k "/><polygon points="330,180 321.7,183.5 321.7,176.5" class="f-k"/><line x1="255" y1="310" x2="255" y2="56" class="ln c-k "/><polygon points="255,50 258.5,58.3 251.5,58.3" class="f-k"/><text x="328" y="198" class="s" text-anchor="end">Re(s)</text><text x="261" y="60" class="s" text-anchor="start">Im(s)</text><line x1="245" y1="174" x2="257" y2="186" class="ln c-k thick"/><line x1="245" y1="186" x2="257" y2="174" class="ln c-k thick"/><line x1="253" y1="174" x2="265" y2="186" class="ln c-k thick"/><line x1="253" y1="186" x2="265" y2="174" class="ln c-k thick"/><line x1="255" y1="170" x2="255" y2="75.5" class="ln c-blue thick"/><polygon points="255,69.5 258.5,77.8 251.5,77.8" class="f-blue"/><line x1="255" y1="190" x2="255" y2="284.5" class="ln c-blue thick"/><polygon points="255,290.5 251.5,282.2 258.5,282.2" class="f-blue"/><text x="265" y="102" class="s b" text-anchor="start">s = ±j√(K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">K</tspan><tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em">)</tspan></text><text x="265" y="120" class="s" text-anchor="start">K<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em">↑ → 진동만 빨라짐</tspan></text><text x="400" y="30" class="b" text-anchor="start">PD: 영점이 궤적을 왼쪽으로 끌어냄</text><line x1="400" y1="180" x2="714" y2="180" class="ln c-k "/><polygon points="720,180 711.7,183.5 711.7,176.5" class="f-k"/><line x1="666.7" y1="310" x2="666.7" y2="56" class="ln c-k "/><polygon points="666.7,50 670.2,58.3 663.2,58.3" class="f-k"/><text x="718" y="198" class="s" text-anchor="end">Re(s)</text><text x="672.7" y="60" class="s" text-anchor="start">Im(s)</text><line x1="656.7" y1="174" x2="668.7" y2="186" class="ln c-k thick"/><line x1="656.7" y1="186" x2="668.7" y2="174" class="ln c-k thick"/><line x1="664.7" y1="174" x2="676.7" y2="186" class="ln c-k thick"/><line x1="664.7" y1="186" x2="676.7" y2="174" class="ln c-k thick"/><circle cx="577.8" cy="180" r="7" class="ln c-k"/><path d="M 666.7 180 A 88.9 88.9 0 0 0 488.9 180" class="ln c-blue thick"/><path d="M 666.7 180 A 88.9 88.9 0 0 1 488.9 180" class="ln c-blue thick"/><polygon points="631.1,108.9 641.5,112.6 635.7,118.9" class="f-blue"/><polygon points="631.1,251.1 635.7,241.1 641.5,247.4" class="f-blue"/><line x1="488.9" y1="177" x2="561.8" y2="177" class="ln c-org thick"/><polygon points="567.8,177 559.5,180.5 559.5,173.5" class="f-org"/><line x1="488.9" y1="183" x2="410.4" y2="183" class="ln c-org thick"/><polygon points="404.4,183 412.7,179.5 412.7,186.5" class="f-org"/><text x="577.8" y="206" class="s b" text-anchor="middle">영점 −z = −K<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em">/K</tspan><tspan dy="0.35em" font-size="72%">d</tspan></text><text x="484.9" y="168" class="s b" text-anchor="end">−2z</text><text x="577.8" y="85.8" class="s" text-anchor="middle">영점 중심, 반지름 z인 원</text><text x="30" y="340" class="s" text-anchor="start">×: 개루프 극점(원점에 2개)   ○: 영점   화살표: 게인을 키울 때 폐루프 극점이 움직이는 방향</text>
</svg>
