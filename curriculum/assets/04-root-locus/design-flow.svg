<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-labelledby="t d">
<title id="t">극점 배치 설계의 순서</title>
<desc id="d">① 사양(정착시간 3초 미만, 오버슈트 5% 미만) → ② s평면 영역(ζ ≥ 0.69, ζωn ≥ 1) → ③ 영역 안에서 ζ, ωn 한 쌍 고르기 → ④ Kp = ωn²/K_b, Kd = 2ζωn/K_b 계산 → ⑤ 스텝 응답과 미분 위치(d_on)로 확인. 사양을 넘으면 ③으로 돌아가 극점을 다시 고른다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="209" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="15" y="30" class="b" text-anchor="start">극점 배치 설계의 순서</text><rect x="15" y="58" width="128" height="62" rx="6" class="bx-pur"/><text x="79" y="86" class="b" text-anchor="middle">① 사양</text><text x="79" y="104" class="s" text-anchor="middle">t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em"> &lt; 3 s, P.O. &lt; 5%</tspan></text><rect x="167" y="58" width="128" height="62" rx="6" class="bx-grn"/><text x="231" y="86" class="b" text-anchor="middle">② s평면 영역</text><text x="231" y="104" class="s" text-anchor="middle">ζ ≥ 0.69, ζω<tspan dy="0.35em" font-size="72%">n</tspan><tspan dy="-0.35em"> ≥ 1</tspan></text><line x1="145" y1="89" x2="159" y2="89" class="ln c-k "/><polygon points="165,89 156.7,92.5 156.7,85.5" class="f-k"/><rect x="319" y="58" width="128" height="62" rx="6" class="bx-grn"/><text x="383" y="86" class="b" text-anchor="middle">③ 극점 고르기</text><text x="383" y="104" class="s" text-anchor="middle">ζ, ω<tspan dy="0.35em" font-size="72%">n</tspan><tspan dy="-0.35em"> 한 쌍</tspan></text><line x1="297" y1="89" x2="311" y2="89" class="ln c-k "/><polygon points="317,89 308.7,92.5 308.7,85.5" class="f-k"/><rect x="471" y="58" width="128" height="62" rx="6" class="bx-blue"/><text x="535" y="86" class="b" text-anchor="middle">④ 게인 계산</text><text x="535" y="104" class="s" text-anchor="middle">K<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em">, K</tspan><tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em"> (4절 식)</tspan></text><line x1="449" y1="89" x2="463" y2="89" class="ln c-k "/><polygon points="469,89 460.7,92.5 460.7,85.5" class="f-k"/><rect x="623" y="58" width="128" height="62" rx="6" class="bx-org"/><text x="687" y="86" class="b" text-anchor="middle">⑤ 확인</text><text x="687" y="104" class="s" text-anchor="middle">스텝 응답, d_on</text><line x1="601" y1="89" x2="615" y2="89" class="ln c-k "/><polygon points="621,89 612.7,92.5 612.7,85.5" class="f-k"/><text x="79" y="138" class="xs f-m" text-anchor="middle">01장</text><text x="231" y="138" class="xs f-m" text-anchor="middle">6절</text><text x="383" y="138" class="xs f-m" text-anchor="middle">영역 안에서</text><text x="535" y="138" class="xs f-m" text-anchor="middle">ω<tspan dy="0.35em" font-size="72%">n</tspan><tspan dy="-0.80em" font-size="72%">2</tspan><tspan dy="0.45em">/K</tspan><tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">, 2ζω</tspan><tspan dy="0.35em" font-size="72%">n</tspan><tspan dy="-0.35em">/K</tspan><tspan dy="0.35em" font-size="72%">b</tspan></text><text x="687" y="138" class="xs f-m" text-anchor="middle">3·7절 위젯, 9절 가상 장치</text><path d="M687 148L687 172L383 172L383 154" class="ln c-red dash"/><polygon points="383,148 386.5,156.3 379.5,156.3" class="f-red"/><text x="535" y="192" class="s b f-red" text-anchor="middle">사양을 넘으면 극점을 다시 고른다</text>
</svg>
