<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 345" width="790" height="345" role="img" aria-labelledby="t d">
<title id="t">폐루프 영점이 오버슈트를 키우는 모습</title>
<desc id="d">극점이 같은(ζ = 0.75, ωn = 1.5) 두 스텝 응답. 미분을 측정값에 건 응답(파랑)은 오버슈트 2.8%, 미분을 오차에 건 응답(빨강)은 19.4%. 빨간 곡선은 파란 곡선에 그 기울기의 Kd/Kp배(초록 점선)를 더한 것과 같다. 응답이 올라가는 동안 기울기가 양수라서 초반이 밀려 올라간다.</desc>
