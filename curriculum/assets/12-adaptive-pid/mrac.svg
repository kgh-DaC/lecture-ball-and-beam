<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 335" width="740" height="335" role="img" aria-labelledby="t d">
<title id="t">모델 기준 적응 제어(MRAC) 구조</title>
<desc id="d">목표 r이 기준 모델 Gm(s)로 원하는 응답 ym을 만들고, 같은 r로 PD 제어기와 볼앤빔이 실제 출력 y를 만든다. 두 출력의 차 em = y − ym을 적응 법칙(MIT 규칙, 정규화, 투영)이 받아 PD 게인 kp, kd를 조정한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="739" height="334" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="14" y="125" class="b l" text-anchor="start">r</text><path d="M30 120L60 120" class="ln c-k "/><circle cx="60" cy="120" r="4" class="f-k"/><path d="M60 120L60 55L194 55" class="ln c-k "/><polygon points="200,55 191.7,58.5 191.7,51.5" class="f-k"/><rect x="200" y="30" width="170" height="50" rx="6" class="box"/><text x="285" y="52" class="b" text-anchor="middle">G<tspan dy="0.35em" font-size="72%">m</tspan><tspan dy="-0.35em">(s) 기준 모델</tspan></text><text x="285" y="70" class="s" text-anchor="middle">원하는 응답</text><path d="M370 55L660 55L660 101" class="ln c-k "/><polygon points="660,107 656.5,98.7 663.5,98.7" class="f-k"/><text x="480" y="45" class="b it" text-anchor="middle">y<tspan dy="0.35em" font-size="72%">m</tspan></text><line x1="60" y1="120" x2="106" y2="120" class="ln c-k "/><polygon points="112,120 103.7,123.5 103.7,116.5" class="f-k"/><circle cx="125" cy="120" r="13" class="box"/><line x1="118" y1="120" x2="132" y2="120" class="ln c-k "/><line x1="125" y1="113" x2="125" y2="127" class="ln c-k "/><text x="103" y="112" class="b" text-anchor="start">+</text><text x="135" y="146" class="b" text-anchor="start">−</text><line x1="138" y1="120" x2="194" y2="120" class="ln c-k "/><polygon points="200,120 191.7,123.5 191.7,116.5" class="f-k"/><rect x="200" y="95" width="170" height="50" rx="6" class="box"/><text x="285" y="117" class="b" text-anchor="middle">PD 제어기</text><text x="285" y="135" class="s" text-anchor="middle">k<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em">, k</tspan><tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em"> (조정됨)</tspan></text><line x1="370" y1="120" x2="414" y2="120" class="ln c-k "/><polygon points="420,120 411.7,123.5 411.7,116.5" class="f-k"/><text x="395" y="110" class="b it" text-anchor="middle">u</text><rect x="420" y="95" width="140" height="50" rx="6" class="box"/><text x="490" y="117" class="b" text-anchor="middle">볼앤빔</text><text x="490" y="135" class="s" text-anchor="middle">K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em"> 가 바뀔 수 있음</tspan></text><line x1="560" y1="120" x2="641" y2="120" class="ln c-k "/><polygon points="647,120 638.7,123.5 638.7,116.5" class="f-k"/><text x="600" y="110" class="b it" text-anchor="middle">y</text><path d="M580 120L580 190L125 190L125 139" class="ln c-k "/><polygon points="125,133 128.5,141.3 121.5,141.3" class="f-k"/><circle cx="660" cy="120" r="13" class="box"/><line x1="653" y1="120" x2="667" y2="120" class="ln c-k "/><line x1="660" y1="113" x2="660" y2="127" class="ln c-k "/><text x="670" y="104" class="b" text-anchor="start">−</text><text x="638" y="112" class="b" text-anchor="start">+</text><line x1="673" y1="120" x2="714" y2="120" class="ln c-k "/><polygon points="720,120 711.7,123.5 711.7,116.5" class="f-k"/><text x="700" y="110" class="b it" text-anchor="middle">e<tspan dy="0.35em" font-size="72%">m</tspan></text><path d="M710 120L710 260L456 260" class="ln c-k "/><polygon points="450,260 458.3,256.5 458.3,263.5" class="f-k"/><rect x="200" y="235" width="250" height="50" rx="6" class="box"/><text x="325" y="257" class="b" text-anchor="middle">적응 법칙 (MIT 규칙)</text><text x="325" y="275" class="s" text-anchor="middle">정규화 + 투영(k<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em"> 0.2~4, k</tspan><tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em"> 0.5~5)</tspan></text><path d="M320 235L320 205L220.4 157.6" class="ln c-pur "/><polygon points="215,155 224,155.4 221,161.7" class="f-pur"/><text x="330" y="220" class="s b" text-anchor="start">게인 조정</text><text x="20" y="320" class="s" text-anchor="start">e<tspan dy="0.35em" font-size="72%">m</tspan><tspan dy="-0.35em"> = y − y</tspan><tspan dy="0.35em" font-size="72%">m</tspan><tspan dy="-0.35em">: 실제 응답이 기준 모델과 다르면 그 차이를 줄이는 쪽으로 k</tspan><tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em">, k</tspan><tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em">를 고친다</tspan></text>
</svg>
