<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 330" width="830" height="330" role="img" aria-labelledby="t d">
<title id="t">실습 계단에서 멂 영역에 있는 시간</title>
<desc id="d">실습 계단 P3(120 → 170 → 270 → 170 mm)을 슬라이드 50 게인 스케줄로 돌린 시뮬레이션의 오차 크기. 주황 영역(0.10 m 이상)에 있는 시간은 모두 1.1 s다. 가장 큰 스텝 100 mm가 경계와 같아 스텝 순간에만 닿기 때문이다. 120 → 270 mm 스텝이면 2.9 s 동안 멂 영역에 있다.</desc>
