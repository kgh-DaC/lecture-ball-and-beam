<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 340" width="830" height="340" role="img" aria-labelledby="t d">
<title id="t">경계 통과와 bumpless 전환의 서보 명령</title>
<desc id="d">120 mm에서 270 mm로 가는 스텝에서 슬라이드 50 게인 스케줄의 서보 명령. switch는 스텝 순간 5.8°, 경계를 지나 가까움 영역으로 들어갈 때 13.1° 튄다. sigmoid는 경계 근처에서 매끄럽다. switch + bumpless는 스텝 순간은 switch와 같은 5.8°이고 경계 통과의 튐만 1.2°로 줄인다.</desc>
