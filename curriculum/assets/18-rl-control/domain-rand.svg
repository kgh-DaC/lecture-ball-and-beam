<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-labelledby="t d">
<title id="t">도메인 랜덤화</title>
<desc id="d">두 그래프 모두 가로축은 K_b 배율, 세로축은 서보 시정수. 왼쪽: 공칭 모델 한 점에서만 학습하면 실제 장치(다른 점)는 처음 보는 모델이다. 오른쪽: K_b 0.8~1.2배, 시정수 0.04~0.10 s 사각형 안의 여러 점에서 학습하면 그 안에 있는 실제 장치에서는 통할 가능성이 크지만, 범위 밖(시정수 0.15 s)은 보장하지 않는다.</desc>
