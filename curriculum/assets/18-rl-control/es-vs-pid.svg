<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 410" width="810" height="410" role="img" aria-labelledby="t d">
<title id="t">번들 ES 정책과 PID의 표준 스텝</title>
<desc id="d">번들 샘플 sim-ai-es(ES 정책)와 sim-pid-p1(PID 1.0, 1.5)의 표준 스텝 응답과 서보 명령. 공 위치 응답은 오버슈트 11.7%와 10%로 비슷하지만, ES 정책의 명령은 매 샘플 크게 오가 총변동 u_tv가 751°로 PID(15°)의 약 50배다.</desc>
