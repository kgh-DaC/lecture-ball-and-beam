 stroke-width=".8" stroke-opacity=".5"/><line x1="246" y1="225" x2="349" y2="240" class="c-m" stroke-width=".8" stroke-opacity=".5"/><line x1="246" y1="225" x2="349" y2="270" class="c-m" stroke-width=".8" stroke-opacity=".5"/><line x1="371" y1="60" x2="489" y2="165" class="c-m" stroke-width=".8" stroke-opacity=".5"/><line x1="371" y1="90" x2="489" y2="165" class="c-m" stroke-width=".8" stroke-opacity=".5"/><line x1="371" y1="120" x2="489" y2="165" class="c-m" stroke-width=".8" stroke-opacity=".5"/><line x1="371" y1="150" x2="489" y2="165" class="c-m" stroke-width=".8" stroke-opacity=".5"/><line x1="371" y1="180" x2="489" y2="165" class="c-m" stroke-width=".8" stroke-opacity=".5"/><line x1="371" y1="210" x2="489" y2="165" class="c-m" stroke-width=".8" stroke-opacity=".5"/><line x1="371" y1="240" x2="489" y2="165" class="c-m" stroke-width=".8" stroke-opacity=".5"/><line x1="371" y1="270" x2="489" y2="165" class="c-m" stroke-width=".8" stroke-opacity=".5"/><text x="70" y="110" class="b" text-anchor="end">e</text><line x1="76" y1="105" x2="148" y2="105" class="ln c-k "/><polygon points="154,105 145.7,108.5 145.7,101.5" class="f-k"/><rect x="154" y="91" width="92" height="28" rx="4" class="box"/><text x="200" y="110" class="xs" text-anchor="middle">/0.10 m</text><text x="70" y="170" class="b" text-anchor="end">v</text><line x1="76" y1="165" x2="148" y2="165" class="ln c-k "/><polygon points="154,165 145.7,168.5 145.7,161.5" class="f-k"/><rect x="154" y="151" width="92" height="28" rx="4" class="box"/><text x="200" y="170" class="xs" text-anchor="middle">/0.30 m/s</text><text x="70" y="230" class="b" text-anchor="end">u<tspan dy="0.35em" font-size="72%">prev</tspan></text><line x1="76" y1="225" x2="148" y2="225" class="ln c-k "/><polygon points="154,225 145.7,228.5 145.7,221.5" class="f-k"/><rect x="154" y="211" width="92" height="28" rx="4" class="box"/><text x="200" y="230" class="xs" text-anchor="middle">/0.524 rad</text><circle cx="360" cy="60" r="10" class="box"/><circle cx="360" cy="90" r="10" class="box"/><circle cx="360" cy="120" r="10" class="box"/><circle cx="360" cy="150" r="10" class="box"/><circle cx="360" cy="180" r="10" class="box"/><circle cx="360" cy="210" r="10" class="box"/><circle cx="360" cy="240" r="10" class="box"/><circle cx="360" cy="270" r="10" class="box"/><circle cx="500" cy="165" r="12" class="box"/><text x="200" y="34" class="s b" text-anchor="middle">정규화</text><text x="360" y="34" class="s b" text-anchor="middle">은닉 8 (tanh)</text><text x="500" y="34" class="s b" text-anchor="middle">출력 1</text><line x1="512" y1="165" x2="554" y2="165" class="ln c-k "/><polygon points="560,165 551.7,168.5 551.7,161.5" class="f-k"/><rect x="560" y="143" width="120" height="44" rx="6" class="box"/><text x="620" y="170" class="b" text-anchor="middle">u<tspan dy="0.35em" font-size="72%">lim</tspan><tspan dy="-0.35em">·tanh(·)</tspan></text><line x1="680" y1="165" x2="724" y2="165" class="ln c-org "/><polygon points="730,165 721.7,168.5 721.7,161.5" class="f-org"/><text x="738" y="170" class="b f-org" text-anchor="start">u</text><text x="380" y="300" class="s" text-anchor="middle">파라미터 (3×8 + 8) + (8×1 + 1) = 41개. 출력은 구조적으로 ±u<tspan dy="0.35em" font-size="72%">lim</tspan><tspan dy="-0.35em">을 넘지 않는다</tspan></text><text x="20" y="342" class="s b" text-anchor="start">같은 입력을 쓰는 08장 PD = 은닉층 없는 선형 정책 (가중치 2개)</text><text x="70" y="373" class="b" text-anchor="end">e</text><text x="70" y="423" class="b" text-anchor="end">v</text><line x1="76" y1="368" x2="294" y2="392.3" class="ln c-blue "/><polygon points="300,393 291.4,395.6 292.2,388.6" class="f-blue"/><line x1="76" y1="418" x2="294" y2="393.7" class="ln c-blue "/><polygon points="300,393 292.2,397.4 291.4,390.4" class="f-blue"/><text x="180" y="370" class="s f-blue" text-anchor="start">× K<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em"> (0.5)</tspan></text><text x="180" y="432" class="s f-blue" text-anchor="start">× (−K<tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em">) (−1.25)</tspan></text><circle cx="312" cy="393" r="13" class="box"/><text x="312" y="398" class="b" text-anchor="middle">Σ</text><line x1="325" y1="393" x2="394" y2="393" class="ln c-org "/><polygon points="400,393 391.7,396.5 391.7,389.5" class="f-org"/><text x="408" y="398" class="b" text-anchor="start">u = K<tspan dy="0.35em" font-size="72%">p</tspan><tspan dy="-0.35em">e − K</tspan><tspan dy="0.35em" font-size="72%">d</tspan><tspan dy="-0.35em">v</tspan></text><text x="760" y="448" class="xs f-m" text-anchor="end">개념도: 모양을 설명하기 위한 그림이며 측정·학습 결과가 아니다</text>
</svg>
