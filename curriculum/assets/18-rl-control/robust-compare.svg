<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d">
<title id="t">ES 정책과 PID의 강인성 비교</title>
<desc id="d">위젯 기본 설정으로 학습한 ES 정책 두 개(랜덤화 없이, 랜덤화)와 PID(1.0, 1.5)를 공칭 모델과 무작위 모델 8개에서 비교. ES, 랜덤화 없이: 무작위 8개 성공 0/8, 평균 ITAE 0.236, 공칭 오버슈트 16.8%, u_tv 6.1 rad; ES, 랜덤화: 무작위 8개 성공 5/8, 평균 ITAE 0.152, 공칭 오버슈트 5.4%, u_tv 14.2 rad; PID (1.0, 1.5): 무작위 8개 성공 8/8, 평균 ITAE 0.125, 공칭 오버슈트 7.3%, u_tv 0.3 rad.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="799" height="339" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="40" y="28" class="b" text-anchor="start">ES 정책(랜덤화 유무)과 PID: 공칭 모델과 무작위 모델 8개 [시뮬레이션]</text><text x="40" y="62" class="s b" text-anchor="start">무작위 모델 8개 성공률</text><line x1="40" y1="246" x2="200" y2="246" class="ln c-k "/><rect x="50" y="244" width="36" height="2" rx="3" class="bx-red"/><text x="68" y="239" class="xs b" text-anchor="middle">0/8</text><rect x="98" y="153.6" width="36" height="92.4" rx="3" class="bx-blue"/><text x="116" y="148.6" class="xs b" text-anchor="middle">5/8</text><rect x="146" y="98.2" width="36" height="147.8" rx="3" class="bx-org"/><text x="164" y="93.2" class="xs b" text-anchor="middle">8/8</text><text x="230" y="62" class="s b" text-anchor="start">무작위 8개 평균 ITAE (m·s²)</text><line x1="230" y1="246" x2="390" y2="246" class="ln c-k "/><rect x="240" y="112.2" width="36" height="133.8" rx="3" class="bx-red"/><text x="258" y="107.2" class="xs b" text-anchor="middle">0.236</text><rect x="288" y="159.9" width="36" height="86.1" rx="3" class="bx-blue"/><text x="306" y="154.9" class="xs b" text-anchor="middle">0.152</text><rect x="336" y="175.1" width="36" height="70.9" rx="3" class="bx-org"/><text x="354" y="170.1" class="xs b" text-anchor="middle">0.125</text><text x="420" y="62" class="s b" text-anchor="start">공칭 모델 오버슈트 (%)</text><line x1="420" y1="246" x2="580" y2="246" class="ln c-k "/><rect x="430" y="151.1" width="36" height="94.9" rx="3" class="bx-red"/><text x="448" y="146.1" class="xs b" text-anchor="middle">16.8</text><rect x="478" y="215.1" width="36" height="30.9" rx="3" class="bx-blue"/><text x="496" y="210.1" class="xs b" text-anchor="middle">5.4</text><rect x="526" y="204.4" width="36" height="41.6" rx="3" class="bx-org"/><text x="544" y="199.4" class="xs b" text-anchor="middle">7.3</text><text x="610" y="62" class="s b" text-anchor="start">무작위 8개 평균 u<tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em"> (rad)</tspan></text><line x1="610" y1="246" x2="770" y2="246" class="ln c-k "/><rect x="620" y="181.5" width="36" height="64.5" rx="3" class="bx-red"/><text x="638" y="176.5" class="xs b" text-anchor="middle">6.1</text><rect x="668" y="94.8" width="36" height="151.2" rx="3" class="bx-blue"/><text x="686" y="89.8" class="xs b" text-anchor="middle">14.2</text><rect x="716" y="242.4" width="36" height="3.6" rx="3" class="bx-org"/><text x="734" y="237.4" class="xs b" text-anchor="middle">0.3</text><rect x="40" y="284" width="18" height="12" rx="2" class="bx-red"/><text x="64" y="295" class="s b" text-anchor="start">ES, 랜덤화 없이</text><rect x="270" y="284" width="18" height="12" rx="2" class="bx-blue"/><text x="294" y="295" class="s b" text-anchor="start">ES, 랜덤화</text><rect x="500" y="284" width="18" height="12" rx="2" class="bx-org"/><text x="524" y="295" class="s b" text-anchor="start">PID (1.0, 1.5)</text><text x="40" y="324" class="xs f-m" text-anchor="start">위젯 기본(120세대, 시드 1)으로 학습. 성공 = 끝 충돌 없이 정착. 랜덤화 없이 학습한 정책은 공칭 모델에서도 정착하지 못했다.</text>
</svg>
