<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 372" width="850" height="372" role="img" aria-labelledby="t d">
<title id="t">안전 장치의 구조</title>
<desc id="d">측정값이 신경망 정책과 폴백 PD에 동시에 들어가고, 폴백 PD는 매 주기 그림자로 계산된다. 감시기가 오차 크기, 공 위치 범위, 측정 유실 3회 연속, 출력 이상값을 검사해 스위치를 정책 또는 PD 쪽으로 돌린다. 스위치 뒤에는 각도 포화와 변화율 제한이 있고(실제 장치 모드에서만 강제), 그 뒤가 서보다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="849" height="371" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="135" class="b" text-anchor="start">측정</text><text x="20" y="152" class="xs" text-anchor="start">y<tspan dy="0.35em" font-size="72%">filt</tspan><tspan dy="-0.35em">, 유실</tspan></text><line x1="70" y1="140" x2="110" y2="140" class="ln c-k "/><path d="M110 140L110 80L144 80" class="ln c-k "/><polygon points="150,80 141.7,83.5 141.7,76.5" class="f-k"/><path d="M110 140L110 200L144 200" class="ln c-k "/><polygon points="150,200 141.7,203.5 141.7,196.5" class="f-k"/><rect x="150" y="55" width="170" height="50" rx="6" class="box"/><text x="235" y="77" class="b" text-anchor="middle">신경망 정책</text><text x="235" y="95" class="s" text-anchor="middle">u<tspan dy="0.35em" font-size="72%">nn</tspan></text><rect x="150" y="175" width="170" height="50" rx="6" class="box"/><text x="235" y="197" class="b" text-anchor="middle">폴백 PD (그림자)</text><text x="235" y="215" class="s" text-anchor="middle">u<tspan dy="0.35em" font-size="72%">pd</tspan><tspan dy="-0.35em">: 매 주기 계산</tspan></text><path d="M320 80L380 80L380 114" class="ln c-blue "/><polygon points="380,120 376.5,111.7 383.5,111.7" class="f-blue"/><path d="M320 200L380 200L380 166" class="ln c-m "/><polygon points="380,160 383.5,168.3 376.5,168.3" class="f-m"/><circle cx="380" cy="140" r="18" class="box"/><text x="380" y="145" class="xs b" text-anchor="middle">SW</text><rect x="250" y="260" width="270" height="78" rx="6" class="box"/><text x="385" y="281" class="b" text-anchor="middle">감시기</text><text x="266" y="304" class="xs" text-anchor="start">• |e| &gt; e_max</text><text x="396" y="304" class="xs" text-anchor="start">• 공이 y_lo~y_hi 밖</text><text x="266" y="324" class="xs" text-anchor="start">• 유실 3회 연속</text><text x="396" y="324" class="xs" text-anchor="start">• 출력이 숫자 아님</text><path d="M380 260L380 164" class="ln c-red dash"/><polygon points="380,158 383.5,166.3 376.5,166.3" class="f-red"/><text x="388" y="236" class="xs f-red b" text-anchor="start">폴백 전환 (최소 hold_s 유지)</text><line x1="398" y1="140" x2="444" y2="140" class="ln c-k "/><polygon points="450,140 441.7,143.5 441.7,136.5" class="f-k"/><rect x="450" y="115" width="130" height="50" rx="6" class="box"/><text x="515" y="137" class="b" text-anchor="middle">포화</text><text x="515" y="155" class="s" text-anchor="middle">angle_limit</text><line x1="580" y1="140" x2="614" y2="140" class="ln c-k "/><polygon points="620,140 611.7,143.5 611.7,136.5" class="f-k"/><rect x="620" y="115" width="130" height="50" rx="6" class="box"/><text x="685" y="137" class="b" text-anchor="middle">변화율 제한</text><text x="685" y="155" class="s" text-anchor="middle">rate_limit</text><line x1="750" y1="140" x2="784" y2="140" class="ln c-org "/><polygon points="790,140 781.7,143.5 781.7,136.5" class="f-org"/><text x="796" y="145" class="b f-org" text-anchor="start">서보</text><rect x="440" y="100" width="320" height="80" rx="8" class="boxd"/><text x="600" y="96" class="xs b" text-anchor="middle">실제 장치 모드에서만 강제</text><text x="450" y="210" class="xs f-m" text-anchor="start">폴백 중에도 u<tspan dy="0.35em" font-size="72%">lim</tspan><tspan dy="-0.35em"> 포화는 항상 적용</tspan></text><text x="830" y="362" class="xs f-m" text-anchor="end">개념도: 모양을 설명하기 위한 그림이며 측정·학습 결과가 아니다</text>
</svg>
