<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">나이키스트 선도에서 위상여유와 지연</title>
<desc id="d">복소평면에 개루프 L(jω) 곡선(파란 실선)과 단위원, −1 점을 그렸다. 곡선이 단위원과 만나는 점에서 −1까지의 각도(초록 호)가 위상여유이다. 지연 0.2 s를 더한 곡선(주황 점선)은 크기는 같고 위상이 돌아가 −1에 더 가까워진다.</desc>
