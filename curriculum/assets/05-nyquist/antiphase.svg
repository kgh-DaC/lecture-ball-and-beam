<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 300" width="790" height="300" role="img" aria-labelledby="t d">
<title id="t">빔과 공의 정반대 박자</title>
<desc id="d">빔 각을 사인파로 흔들 때(주황) 공 위치(초록)는 같은 주파수의 사인파이지만 부호가 반대다. 빔이 +쪽으로 가장 기운 순간 공은 −쪽 끝에 있다. 크기는 K_b/ω²라서 주파수가 10배가 되면 진폭이 1/100이 되고, 위상은 모든 주파수에서 −180°다.</desc>
