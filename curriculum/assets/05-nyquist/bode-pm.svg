<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 446" width="790" height="446" role="img" aria-labelledby="t d">
<title id="t">보드 선도에서 위상여유 읽기</title>
<desc id="d">개루프 L의 크기 곡선이 0 dB를 지나는 이득교차주파수(약 2.05 rad/s)에서 위상 곡선을 읽고, −180°까지 남은 각도가 위상여유(약 21.2°)이다. 슬라이드 48 PD(D 필터 N = 8)에 센서 필터 α = 0.2와 지연 0.03 s를 넣은 경우. 회색 점선은 늦음이 없을 때의 위상으로, 위상여유가 51.7°였다.</desc>
