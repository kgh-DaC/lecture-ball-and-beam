<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="680" height="452" role="img" aria-labelledby="t d">
<title id="t">보드 선도에서 위상여유 읽기</title>
<desc id="d">개루프 L의 크기 곡선이 0 dB를 지나는 이득교차주파수(약 1.91 rad/s)에서 위상 곡선을 읽고, −180°까지 남은 각도가 위상여유(약 34°)이다. 슬라이드 48 PD에 센서 필터 α = 0.2를 넣은 경우.</desc>
