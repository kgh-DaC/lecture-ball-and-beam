<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d">
<title id="t">교차주파수에서의 위상 예산</title>
<desc id="d">이득교차주파수 약 2.05 rad/s에서 PD가 위상을 63.4° 끌어올리고, D 필터가 12.5°, 센서 필터(α = 0.2)가 26.2°, 샘플링 지연 0.03 s가 3.5°를 깎아 위상여유 21.2°가 남는다. 가장 큰 몫은 센서 필터다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="799" height="339" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="80" y="28" class="b" text-anchor="start">위상 예산: ω<tspan dy="0.35em" font-size="72%">gc</tspan><tspan dy="-0.35em"> ≈ 2.05 rad/s에서 −180° 위로 얼마가 남나</tspan></text><line x1="80" y1="294" x2="600" y2="294" class="ln c-m thin dot"/><line x1="80" y1="228.3" x2="600" y2="228.3" class="ln c-m thin dot"/><line x1="80" y1="162.6" x2="600" y2="162.6" class="ln c-m thin dot"/><line x1="80" y1="96.9" x2="600" y2="96.9" class="ln c-m thin dot"/><line x1="80" y1="294" x2="608" y2="294" class="ln c-k "/><polygon points="614,294 605.7,297.5 605.7,290.5" class="f-k"/><line x1="80" y1="294" x2="80" y2="58" class="ln c-k "/><polygon points="80,52 83.5,60.3 76.5,60.3" class="f-k"/><line x1="75" y1="294" x2="80" y2="294" class="ln c-k "/><text x="72" y="298" class="s" text-anchor="end">0</text><line x1="75" y1="228.3" x2="80" y2="228.3" class="ln c-k "/><text x="72" y="232.3" class="s" text-anchor="end">20</text><line x1="75" y1="162.6" x2="80" y2="162.6" class="ln c-k "/><text x="72" y="166.6" class="s" text-anchor="end">40</text><line x1="75" y1="96.9" x2="80" y2="96.9" class="ln c-k "/><text x="72" y="100.9" class="s" text-anchor="end">60</text><text x="604" y="330" class="s" text-anchor="end"></text><text x="86" y="48" class="s" text-anchor="start">−180°에서 위로 (°)</text><rect x="100.8" y="85.7" width="62.4" height="208.3" rx="4" class="bx-blue"/><text x="132" y="78.7" class="s b f-blue" text-anchor="middle">+63.4°</text><text x="132" y="314" class="s b" text-anchor="middle">PD가 올림</text><line x1="163.2" y1="85.7" x2="204.8" y2="85.7" class="ln c-m thin dot"/><rect x="204.8" y="85.7" width="62.4" height="41.1" rx="4" class="bx-org"/><text x="236" y="78.7" class="s b f-org" text-anchor="middle">−12.5°</text><text x="236" y="314" class="s b" text-anchor="middle">D 필터</text><line x1="267.2" y1="126.8" x2="308.8" y2="126.8" class="ln c-m thin dot"/><rect x="308.8" y="126.8" width="62.4" height="86.1" rx="4" class="bx-pur"/><text x="340" y="119.8" class="s b f-pur" text-anchor="middle">−26.2°</text><text x="340" y="314" class="s b" text-anchor="middle">센서 필터</text><line x1="371.2" y1="212.9" x2="412.8" y2="212.9" class="ln c-m thin dot"/><rect x="412.8" y="212.9" width="62.4" height="11.6" rx="4" class="bx-red"/><text x="444" y="205.9" class="s b f-red" text-anchor="middle">−3.5°</text><text x="444" y="314" class="s b" text-anchor="middle">샘플링 지연</text><line x1="475.2" y1="224.4" x2="516.8" y2="224.4" class="ln c-m thin dot"/><rect x="516.8" y="224.4" width="62.4" height="69.6" rx="4" class="bx-grn"/><text x="548" y="217.4" class="s b f-grn" text-anchor="middle">21.2°</text><text x="548" y="314" class="s b f-grn" text-anchor="middle">남은 PM</text><text x="132" y="330" class="xs f-m" text-anchor="middle">tan<tspan dy="-0.45em" font-size="72%">−1</tspan><tspan dy="0.45em"> 식(2절)</tspan></text><text x="236" y="330" class="xs f-m" text-anchor="middle">T<tspan dy="0.35em" font-size="72%">f</tspan><tspan dy="-0.35em"> 0.108 s</tspan></text><text x="340" y="330" class="xs f-m" text-anchor="middle">T<tspan dy="0.35em" font-size="72%">f</tspan><tspan dy="-0.35em"> 0.24 s</tspan></text><text x="444" y="330" class="xs f-m" text-anchor="middle">0.03 s</text><text x="640" y="110" class="s" text-anchor="start">기구부 K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">/s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan><tspan dy="0.45em">의 위상은</tspan></text><text x="640" y="128" class="s" text-anchor="start">−180°. PD가 끌어올린</text><text x="640" y="146" class="s" text-anchor="start">각도를 늦음 세 가지가</text><text x="640" y="164" class="s" text-anchor="start">나눠 먹는다.</text><text x="640" y="200" class="s" text-anchor="start">가장 큰 몫은</text><text x="640" y="218" class="s b f-pur" text-anchor="start">센서 필터다.</text><text x="640" y="280" class="xs f-m" text-anchor="start">슬라이드 48 PD, N = 8,</text><text x="640" y="294" class="xs f-m" text-anchor="start">α 0.2, 서보 무시</text>
</svg>
