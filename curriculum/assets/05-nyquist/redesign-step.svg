<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" width="800" height="336" role="img" aria-labelledby="t d">
<title id="t">재설계 전후의 스텝 응답</title>
<desc id="d">150 mm에서 200 mm로 가는 스텝(60 ms 샘플링, 센서 필터 α 0.2 포함 시뮬레이터). 슬라이드 48 PD(위상여유 21.2°)는 오버슈트 24.9%, 95% 도달 1.2 s. 게인을 낮춘 재설계 예(Kp 0.5, Kd 1.0, 위상여유 36.5°)는 오버슈트 3.3%, 95% 도달 3.0 s로 차분하지만 느리다.</desc>
