<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 368" width="870" height="368" role="img" aria-labelledby="t d">
<title id="t">최고 사례 점수의 자격 검사 흐름</title>
<desc id="d">세션이 최고 사례 점수에 들어가기까지 앱이 검사하는 순서. 같은 묶음(제어기·설정값 프로파일)인지, 스텝이 15 mm 이상인지(아니면 지표 계산 불가), 센서 유실 5% 이하인지, 포화 10% 이하인지(아니면 자격 미달로 순위 제외). 포화 비율을 알 수 없으면(제어 입력 기록 없음) 확인 불가로 표시하고 후보에 남긴다. 슬롯 대표는 출처 계층이 먼저이고, 비교 화면의 조건 검사는 점수와 따로 우열 기호 표시 여부를 정한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="869" height="367" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="28" class="b" text-anchor="start">세션이 최고 사례 점수에 들어가기까지 (store/best.js, metrics.js)</text><rect x="20" y="52" width="124" height="56" rx="6" class="bx-blue"/><text x="82" y="77" class="b" text-anchor="middle">세션</text><text x="82" y="95" class="s" text-anchor="middle">실측·시뮬레이션</text><line x1="144" y1="80" x2="164" y2="80" class="ln c-k "/><polygon points="170,80 161.7,83.5 161.7,76.5" class="f-k"/><rect x="170" y="52" width="124" height="56" rx="6" class="bx-pur"/><text x="232" y="77" class="b" text-anchor="middle">같은 묶음?</text><text x="232" y="95" class="s" text-anchor="middle">제어기·프로파일</text><line x1="294" y1="80" x2="314" y2="80" class="ln c-k "/><polygon points="320,80 311.7,83.5 311.7,76.5" class="f-k"/><text x="307" y="72" class="xs b" text-anchor="middle">예</text><line x1="232" y1="108" x2="232" y2="144" class="ln c-red "/><polygon points="232,150 228.5,141.7 235.5,141.7" class="f-red"/><text x="239" y="134" class="xs b f-red" text-anchor="start">아니오</text><rect x="170" y="150" width="124" height="48" rx="6" class="bx-red"/><text x="232" y="171" class="b" text-anchor="middle">다른 묶음</text><text x="232" y="189" class="s" text-anchor="middle">점수에서 빠짐</text><rect x="320" y="52" width="124" height="56" rx="6" class="bx-pur"/><text x="382" y="77" class="b" text-anchor="middle">스텝 ≥ 15 mm?</text><text x="382" y="95" class="s" text-anchor="middle">|목표 − 시작|</text><line x1="444" y1="80" x2="464" y2="80" class="ln c-k "/><polygon points="470,80 461.7,83.5 461.7,76.5" class="f-k"/><text x="457" y="72" class="xs b" text-anchor="middle">예</text><line x1="382" y1="108" x2="382" y2="144" class="ln c-red "/><polygon points="382,150 378.5,141.7 385.5,141.7" class="f-red"/><text x="389" y="134" class="xs b f-red" text-anchor="start">아니오</text><rect x="320" y="150" width="124" height="48" rx="6" class="bx-red"/><text x="382" y="171" class="b" text-anchor="middle">지표 계산 불가</text><text x="382" y="189" class="s" text-anchor="middle">small_step</text><rect x="470" y="52" width="124" height="56" rx="6" class="bx-pur"/><text x="532" y="77" class="b" text-anchor="middle">유실 ≤ 5%?</text><text x="532" y="95" class="s" text-anchor="middle">lost_ratio</text><line x1="594" y1="80" x2="614" y2="80" class="ln c-k "/><polygon points="620,80 611.7,83.5 611.7,76.5" class="f-k"/><text x="607" y="72" class="xs b" text-anchor="middle">예</text><line x1="532" y1="108" x2="532" y2="144" class="ln c-red "/><polygon points="532,150 528.5,141.7 535.5,141.7" class="f-red"/><text x="539" y="134" class="xs b f-red" text-anchor="start">아니오</text><rect x="470" y="150" width="124" height="48" rx="6" class="bx-red"/><text x="532" y="171" class="b" text-anchor="middle">자격 미달</text><text x="532" y="189" class="s" text-anchor="middle">순위 제외</text><rect x="620" y="52" width="124" height="56" rx="6" class="bx-pur"/><text x="682" y="77" class="b" text-anchor="middle">포화 ≤ 10%?</text><text x="682" y="95" class="s" text-anchor="middle">u_sat_ratio</text><line x1="682" y1="108" x2="682" y2="144" class="ln c-red "/><polygon points="682,150 678.5,141.7 685.5,141.7" class="f-red"/><text x="689" y="134" class="xs b f-red" text-anchor="start">아니오</text><rect x="620" y="150" width="124" height="48" rx="6" class="bx-red"/><text x="682" y="171" class="b" text-anchor="middle">자격 미달</text><text x="682" y="189" class="s" text-anchor="middle">순위 제외</text><line x1="744" y1="80" x2="764" y2="80" class="ln c-k "/><polygon points="770,80 761.7,83.5 761.7,76.5" class="f-k"/><line x1="770" y1="80" x2="770" y2="246" class="ln c-k "/><polygon points="770,252 766.5,243.7 773.5,243.7" class="f-k"/><text x="778" y="132" class="xs b" text-anchor="start">예</text><text x="778" y="160" class="xs b f-org" text-anchor="start">기록이 없어도</text><text x="778" y="176" class="xs b f-org" text-anchor="start">여기로</text><text x="778" y="192" class="xs f-org" text-anchor="start">(확인 불가 표시)</text><rect x="690" y="252" width="160" height="56" rx="6" class="bx-grn"/><text x="770" y="277" class="b" text-anchor="middle">정규화 점수</text><text x="770" y="295" class="s" text-anchor="middle">낮을수록 1등</text><rect x="20" y="232" width="560" height="120" rx="8" class="panel"/><text x="34" y="254" class="s b" text-anchor="start">점수와 따로 보는 것</text><text x="34" y="276" class="xs" text-anchor="start">• 슬롯 대표: 계층이 먼저(내 실측 &gt; 실측 &gt; 내 시뮬레이션 &gt; 시뮬레이션),</text><text x="46" y="292" class="xs" text-anchor="start">같은 계층 안에서만 점수 순</text><text x="34" y="314" class="xs" text-anchor="start">• 비교 화면의 조건 검사(출처·제어기·프로파일·서보·주기·모델 종류):</text><text x="46" y="330" class="xs" text-anchor="start">다르거나 모르면 ▲▼ 기호를 숨기고 "우열 판단 보류"</text>
</svg>
