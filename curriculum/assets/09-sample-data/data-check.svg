<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
<title id="t">샘플 데이터 자격 검사 흐름</title>
<desc id="d">세션이 순위 비교에 들어가기까지의 검사 순서: 조건이 기록되었는지(아니면 조건 불명, 우열 비교 제외), 센서 유실 5% 이하인지, 포화 10% 이하인지(아니면 자격 미달), 스텝이 15 mm 이상인지(아니면 지표 계산 불가). 모두 통과하면 같은 묶음 안에서 정규화 점수로 비교한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="299" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="20" y="40" width="115" height="56" rx="6" class="box"/><text x="77.5" y="65" class="b" text-anchor="middle">세션</text><text x="77.5" y="83" class="s" text-anchor="middle">실측·시뮬레이션</text><line x1="135" y1="68" x2="159" y2="68" class="ln c-k "/><polygon points="165,68 156.7,71.5 156.7,64.5" class="f-k"/><rect x="165" y="40" width="115" height="56" rx="6" class="boxd"/><text x="222.5" y="65" class="b" text-anchor="middle">조건이</text><text x="222.5" y="83" class="s" text-anchor="middle">기록됐나?</text><line x1="280" y1="68" x2="304" y2="68" class="ln c-k "/><polygon points="310,68 301.7,71.5 301.7,64.5" class="f-k"/><text x="295" y="60" class="xs b" text-anchor="middle">예</text><line x1="222" y1="96" x2="222" y2="134" class="ln c-red "/><polygon points="222,140 218.5,131.7 225.5,131.7" class="f-red"/><text x="229" y="122" class="xs b" text-anchor="start">아니오</text><rect x="165" y="140" width="115" height="50" rx="6" class="box"/><text x="222.5" y="162" class="b" text-anchor="middle">조건 불명 배지</text><text x="222.5" y="180" class="s" text-anchor="middle">우열 비교 제외</text><rect x="310" y="40" width="115" height="56" rx="6" class="boxd"/><text x="367.5" y="65" class="b" text-anchor="middle">유실</text><text x="367.5" y="83" class="s" text-anchor="middle">≤ 5%?</text><line x1="425" y1="68" x2="449" y2="68" class="ln c-k "/><polygon points="455,68 446.7,71.5 446.7,64.5" class="f-k"/><text x="440" y="60" class="xs b" text-anchor="middle">예</text><line x1="367" y1="96" x2="367" y2="134" class="ln c-red "/><polygon points="367,140 363.5,131.7 370.5,131.7" class="f-red"/><text x="374" y="122" class="xs b" text-anchor="start">아니오</text><rect x="310" y="140" width="115" height="50" rx="6" class="box"/><text x="367.5" y="162" class="b" text-anchor="middle">자격 미달</text><text x="367.5" y="180" class="s" text-anchor="middle">순위 제외</text><rect x="455" y="40" width="115" height="56" rx="6" class="boxd"/><text x="512.5" y="65" class="b" text-anchor="middle">포화</text><text x="512.5" y="83" class="s" text-anchor="middle">≤ 10%?</text><line x1="570" y1="68" x2="594" y2="68" class="ln c-k "/><polygon points="600,68 591.7,71.5 591.7,64.5" class="f-k"/><text x="585" y="60" class="xs b" text-anchor="middle">예</text><line x1="512" y1="96" x2="512" y2="134" class="ln c-red "/><polygon points="512,140 508.5,131.7 515.5,131.7" class="f-red"/><text x="519" y="122" class="xs b" text-anchor="start">아니오</text><rect x="455" y="140" width="115" height="50" rx="6" class="box"/><text x="512.5" y="162" class="b" text-anchor="middle">자격 미달</text><text x="512.5" y="180" class="s" text-anchor="middle">순위 제외</text><rect x="600" y="40" width="115" height="56" rx="6" class="boxd"/><text x="657.5" y="65" class="b" text-anchor="middle">스텝</text><text x="657.5" y="83" class="s" text-anchor="middle">≥ 15 mm?</text><line x1="657" y1="96" x2="657" y2="134" class="ln c-red "/><polygon points="657,140 653.5,131.7 660.5,131.7" class="f-red"/><text x="664" y="122" class="xs b" text-anchor="start">아니오</text><rect x="600" y="140" width="115" height="50" rx="6" class="box"/><text x="657.5" y="162" class="b" text-anchor="middle">지표</text><text x="657.5" y="180" class="s" text-anchor="middle">계산 불가</text><line x1="715" y1="68" x2="715" y2="224" class="ln c-k "/><polygon points="715,230 711.5,221.7 718.5,221.7" class="f-k"/><text x="722" y="160" class="xs b" text-anchor="start">예</text><rect x="380" y="230" width="360" height="56" rx="6" class="box"/><text x="560" y="255" class="b" text-anchor="middle">같은 묶음(제어기·프로파일)에서</text><text x="560" y="273" class="s" text-anchor="middle">정규화 점수 비교 → 최고 사례 후보</text><text x="20" y="250" class="s b" text-anchor="start">출처 배지를 함께 본다:</text><text x="20" y="270" class="s" text-anchor="start">시뮬레이션은 언제나 실측보다 뒤에 놓인다</text>
</svg>
