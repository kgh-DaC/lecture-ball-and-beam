<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-labelledby="t d">
<title id="t">후보 추가에 따른 순위 변화</title>
<desc id="d">왼쪽은 4.1절의 후보 A, B, C 점수(A 0.34 1등, B 0.60, C 0.40). 오른쪽은 모든 지표가 나쁜 후보 D를 더한 경우로, 정규화 범위가 넓어져 A 0.20, B 0.19가 되어 B가 1등이 된다. 막대는 지표별 기여를 색으로 쌓았다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="899" height="349" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="30" class="b" text-anchor="start">후보가 하나 늘면 기존 점수가 바뀐다: 꼴찌 D가 A와 B의 순위를 뒤집는다 [가정]</text><text x="90" y="68" class="s b" text-anchor="start">후보 A, B, C (4.1절 표)</text><text x="80" y="101" class="s b" text-anchor="end">후보 A</text><rect x="90" y="82" width="40" height="26" rx="2" class="bx-blue"/><rect x="130" y="82" width="30" height="26" rx="2" class="bx-grn"/><rect x="160" y="82" width="20" height="26" rx="2" class="bx-org"/><rect x="180" y="82" width="12" height="26" rx="2" class="bx-pur"/><text x="200" y="100" class="s b f-grn" text-anchor="start">0.34  (1등)</text><text x="80" y="141" class="s b" text-anchor="end">후보 B</text><rect x="90" y="122" width="90" height="26" rx="2" class="bx-grn"/><rect x="180" y="122" width="60" height="26" rx="2" class="bx-org"/><rect x="240" y="122" width="30" height="26" rx="2" class="bx-pur"/><text x="278" y="140" class="s b" text-anchor="start">0.60  (3등)</text><text x="80" y="181" class="s b" text-anchor="end">후보 C</text><rect x="90" y="162" width="120" height="26" rx="2" class="bx-blue"/><text x="218" y="180" class="s b" text-anchor="start">0.40  (2등)</text><text x="520" y="68" class="s b" text-anchor="start">같은 세 후보 + D</text><text x="510" y="101" class="s b" text-anchor="end">후보 A</text><rect x="520" y="82" width="40" height="26" rx="2" class="bx-blue"/><rect x="560" y="82" width="6" height="26" rx="2" class="bx-grn"/><rect x="566" y="82" width="8.6" height="26" rx="2" class="bx-org"/><rect x="574.6" y="82" width="5" height="26" rx="2" class="bx-pur"/><text x="587.6" y="100" class="s b" text-anchor="start">0.20  (2등)</text><text x="510" y="141" class="s b" text-anchor="end">후보 B</text><rect x="520" y="122" width="18" height="26" rx="2" class="bx-grn"/><rect x="538" y="122" width="25.7" height="26" rx="2" class="bx-org"/><rect x="563.7" y="122" width="12.5" height="26" rx="2" class="bx-pur"/><text x="584.2" y="140" class="s b f-grn" text-anchor="start">0.19  (1등)</text><text x="510" y="181" class="s b" text-anchor="end">후보 C</text><rect x="520" y="162" width="120" height="26" rx="2" class="bx-blue"/><text x="648" y="180" class="s b" text-anchor="start">0.40  (3등)</text><text x="510" y="221" class="s b" text-anchor="end">후보 D</text><rect x="520" y="202" width="40" height="26" rx="2" class="bx-blue"/><rect x="560" y="202" width="90" height="26" rx="2" class="bx-grn"/><rect x="650" y="202" width="60" height="26" rx="2" class="bx-org"/><rect x="710" y="202" width="30" height="26" rx="2" class="bx-pur"/><text x="748" y="220" class="s b" text-anchor="start">0.73  (4등)</text><line x1="470" y1="56" x2="470" y2="250" class="ln c-m thin dot"/><rect x="90" y="247" width="14" height="14" rx="2" class="bx-blue"/><text x="110" y="258" class="xs b" text-anchor="start">ITAE × 가중치</text><rect x="220" y="247" width="14" height="14" rx="2" class="bx-grn"/><text x="240" y="258" class="xs b" text-anchor="start">t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em"> × 가중치</tspan></text><rect x="350" y="247" width="14" height="14" rx="2" class="bx-org"/><text x="370" y="258" class="xs b" text-anchor="start">P.O. × 가중치</text><rect x="480" y="247" width="14" height="14" rx="2" class="bx-pur"/><text x="500" y="258" class="xs b" text-anchor="start">u<tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em"> × 가중치</tspan></text><text x="20" y="290" class="s" text-anchor="start">D = ITAE 200, t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em"> 10 s, P.O. 40%, u</tspan><tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em"> 15°: 모든 지표가 나쁘거나 중간이라 꼴찌다.</tspan></text><text x="20" y="310" class="s" text-anchor="start">그런데 D가 t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em">·P.O.·u</tspan><tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em">의 최댓값을 늘리자 A·B 사이의 정규화 간격이 줄어, ITAE가 가장 좋은 B가 1등이 되었다.</tspan></text><text x="20" y="334" class="xs f-m" text-anchor="start">기본 가중치 0.4/0.3/0.2/0.1, min-max 정규화는 후보 안에서만 한다 (store/best.score).</text>
</svg>
