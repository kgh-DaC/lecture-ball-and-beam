<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="t d">
<title id="t">가중합 점수 쌓아 보기</title>
<desc id="d">4.1절 예의 후보 A 점수 0.34를 지표별 기여로 쌓은 막대: ITAE 0.4×0.333, 정착시간 0.3×0.333, 오버슈트 0.2×0.333, 제어 총변동 0.1×0.4. 후보 B와 C는 빈 막대로 두어 워크시트에서 직접 계산하게 했다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="719" height="351" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="130" y="70" width="99" height="34" class="f-blue" fill-opacity="0.6"/><rect x="130" y="70" width="99" height="34" fill="none" class="ln c-k thin"/><rect x="229" y="70" width="74.3" height="34" class="f-grn" fill-opacity="0.55"/><rect x="229" y="70" width="74.3" height="34" fill="none" class="ln c-k thin"/><rect x="303.3" y="70" width="49.5" height="34" class="f-org" fill-opacity="0.55"/><rect x="303.3" y="70" width="49.5" height="34" fill="none" class="ln c-k thin"/><rect x="352.9" y="70" width="29.7" height="34" class="f-pur" fill-opacity="0.55"/><rect x="352.9" y="70" width="29.7" height="34" fill="none" class="ln c-k thin"/><text x="390.6" y="92" class="b" text-anchor="start">= 0.34</text><rect x="130" y="300" width="14" height="14" class="f-blue" fill-opacity="0.6"/><text x="150" y="312" class="xs b" text-anchor="start">ITAE 0.4×0.333</text><rect x="270" y="300" width="14" height="14" class="f-grn" fill-opacity="0.55"/><text x="290" y="312" class="xs b" text-anchor="start">t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em"> 0.3×0.333</tspan></text><rect x="410" y="300" width="14" height="14" class="f-org" fill-opacity="0.55"/><text x="430" y="312" class="xs b" text-anchor="start">P.O. 0.2×0.333</text><rect x="550" y="300" width="14" height="14" class="f-pur" fill-opacity="0.55"/><text x="570" y="312" class="xs b" text-anchor="start">u<tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em"> 0.1×0.4</tspan></text><text x="118" y="92" class="b" text-anchor="end">후보 A</text><rect x="130" y="122" width="445.7" height="34" rx="3" class="boxd"/><text x="352.9" y="144" class="s" text-anchor="middle">? — 워크시트에서 직접 계산</text><text x="118" y="144" class="b" text-anchor="end">후보 B</text><rect x="130" y="174" width="445.7" height="34" rx="3" class="boxd"/><text x="352.9" y="196" class="s" text-anchor="middle">? — 워크시트에서 직접 계산</text><text x="118" y="196" class="b" text-anchor="end">후보 C</text><line x1="130" y1="250" x2="644" y2="250" class="ln c-k "/><polygon points="650,250 641.7,253.5 641.7,246.5" class="f-k"/><line x1="130" y1="246" x2="130" y2="254" class="ln c-k "/><text x="130" y="268" class="xs" text-anchor="middle">0.0</text><line x1="278.6" y1="246" x2="278.6" y2="254" class="ln c-k "/><text x="278.6" y="268" class="xs" text-anchor="middle">0.2</text><line x1="427.1" y1="246" x2="427.1" y2="254" class="ln c-k "/><text x="427.1" y="268" class="xs" text-anchor="middle">0.4</text><line x1="575.7" y1="246" x2="575.7" y2="254" class="ln c-k "/><text x="575.7" y="268" class="xs" text-anchor="middle">0.6</text><text x="650" y="284" class="s" text-anchor="end">가중합 점수 (낮을수록 좋음)</text><text x="20" y="30" class="b" text-anchor="start">점수 = 0.4·norm(ITAE) + 0.3·norm(t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em">) + 0.2·norm(P.O.) + 0.1·norm(u</tspan><tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em">)</tspan></text><text x="20" y="340" class="xs f-m" text-anchor="start">norm = (x − x<tspan dy="0.35em" font-size="72%">min</tspan><tspan dy="-0.35em">) / (x</tspan><tspan dy="0.35em" font-size="72%">max</tspan><tspan dy="-0.35em"> − x</tspan><tspan dy="0.35em" font-size="72%">min</tspan><tspan dy="-0.35em">): 후보 중 가장 좋은 값 0, 가장 나쁜 값 1   [가정: 4.1절 계산 연습용 숫자]</tspan></text>
</svg>
