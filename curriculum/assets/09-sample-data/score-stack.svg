<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="t d">
<title id="t">가중합 점수 쌓아 보기</title>
<desc id="d">4.1절 예의 후보 A 점수 0.34를 지표별 기여로 쌓은 막대: ITAE 0.4×0.333, 정착시간 0.3×0.333, 오버슈트 0.2×0.333, 제어 총변동 0.1×0.4. 후보 B와 C는 빈 막대로 두어 워크시트에서 직접 계산하게 했다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="719" height="351" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="30" class="b" text-anchor="start">점수 = 0.4·norm(ITAE) + 0.3·norm(t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em">) + 0.2·norm(P.O.) + 0.1·norm(u</tspan><tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em">)</tspan></text><text x="130" y="62" class="s b" text-anchor="start">4.1절 예 (기본 가중치)</text><text x="120" y="95" class="s b" text-anchor="end">후보 A</text><rect x="130" y="76" width="69.3" height="26" rx="2" class="bx-blue"/><rect x="199.3" y="76" width="52" height="26" rx="2" class="bx-grn"/><rect x="251.3" y="76" width="34.7" height="26" rx="2" class="bx-org"/><rect x="286" y="76" width="20.8" height="26" rx="2" class="bx-pur"/><text x="314.8" y="94" class="s b f-grn" text-anchor="start">0.34  (1등)</text><text x="120" y="135" class="s b" text-anchor="end">후보 B</text><rect x="130" y="116" width="312" height="26" rx="3" class="boxd"/><text x="286" y="134" class="xs" text-anchor="middle">? — 워크시트에서 직접 계산</text><text x="120" y="175" class="s b" text-anchor="end">후보 C</text><rect x="130" y="156" width="312" height="26" rx="3" class="boxd"/><text x="286" y="174" class="xs" text-anchor="middle">? — 워크시트에서 직접 계산</text><line x1="130" y1="214" x2="488" y2="214" class="ln c-k "/><polygon points="494,214 485.7,217.5 485.7,210.5" class="f-k"/><line x1="130" y1="210" x2="130" y2="218" class="ln c-k "/><text x="130" y="232" class="xs" text-anchor="middle">0.0</text><line x1="234" y1="210" x2="234" y2="218" class="ln c-k "/><text x="234" y="232" class="xs" text-anchor="middle">0.2</text><line x1="338" y1="210" x2="338" y2="218" class="ln c-k "/><text x="338" y="232" class="xs" text-anchor="middle">0.4</text><line x1="442" y1="210" x2="442" y2="218" class="ln c-k "/><text x="442" y="232" class="xs" text-anchor="middle">0.6</text><text x="494" y="250" class="s" text-anchor="end">가중합 점수 (낮을수록 좋음)</text><rect x="130" y="271" width="14" height="14" rx="2" class="bx-blue"/><text x="150" y="282" class="xs b" text-anchor="start">ITAE × 가중치</text><rect x="260" y="271" width="14" height="14" rx="2" class="bx-grn"/><text x="280" y="282" class="xs b" text-anchor="start">t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em"> × 가중치</tspan></text><rect x="390" y="271" width="14" height="14" rx="2" class="bx-org"/><text x="410" y="282" class="xs b" text-anchor="start">P.O. × 가중치</text><rect x="520" y="271" width="14" height="14" rx="2" class="bx-pur"/><text x="540" y="282" class="xs b" text-anchor="start">u<tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em"> × 가중치</tspan></text><text x="20" y="316" class="xs" text-anchor="start">A: ITAE 0.4×0.333, t<tspan dy="0.35em" font-size="72%">s</tspan><tspan dy="-0.35em"> 0.3×0.333, P.O. 0.2×0.333, u</tspan><tspan dy="0.35em" font-size="72%">tv</tspan><tspan dy="-0.35em"> 0.1×0.4</tspan></text><text x="20" y="336" class="xs f-m" text-anchor="start">norm = (x − x<tspan dy="0.35em" font-size="72%">min</tspan><tspan dy="-0.35em">) / (x</tspan><tspan dy="0.35em" font-size="72%">max</tspan><tspan dy="-0.35em"> − x</tspan><tspan dy="0.35em" font-size="72%">min</tspan><tspan dy="-0.35em">): 후보 중 가장 좋은 값 0, 가장 나쁜 값 1   [가정: 4.1절 계산 연습용 숫자, store/best.score]</tspan></text>
</svg>
