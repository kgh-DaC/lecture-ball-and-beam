<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" width="780" height="310" role="img" aria-labelledby="t d">
<title id="t">볼앤빔 폐루프 블록선도</title>
<desc id="d">목표 r에서 측정 y를 뺀 오차 e가 제어기 C(s)로 들어가 명령각 θcmd를 만들고, 서보 Gservo(s)를 거쳐 실제 각 θ가 되며, 빔·공 Kb/s²가 공 위치 y를 만든다. y는 초음파 센서(H = 1)로 되먹임된다. 서보 블록은 점선으로, 04–06장에서는 무시한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="309" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="14" y="115" class="b l" text-anchor="start">r</text><text x="10" y="135" class="s" text-anchor="start">목표</text><line x1="30" y1="110" x2="86" y2="110" class="ln c-k "/><polygon points="92,110 83.7,113.5 83.7,106.5" class="f-k"/><circle cx="105" cy="110" r="13" class="box"/><line x1="98" y1="110" x2="112" y2="110" class="ln c-k "/><line x1="105" y1="103" x2="105" y2="117" class="ln c-k "/><text x="83" y="102" class="b" text-anchor="start">+</text><text x="115" y="136" class="b" text-anchor="start">−</text><line x1="118" y1="110" x2="164" y2="110" class="ln c-k "/><polygon points="170,110 161.7,113.5 161.7,106.5" class="f-k"/><text x="144" y="100" class="b it" text-anchor="middle">e</text><rect x="195" y="52" width="70" height="20" rx="10" class="pill-blue"/><text x="230" y="66" class="xs b w" text-anchor="middle">브라우저</text><rect x="170" y="80" width="120" height="60" rx="6" class="bx-blue"/><text x="230" y="107" class="b" text-anchor="middle">C(s)</text><text x="230" y="125" class="s" text-anchor="middle">제어기</text><line x1="290" y1="110" x2="344" y2="110" class="ln c-k "/><polygon points="350,110 341.7,113.5 341.7,106.5" class="f-k"/><text x="320" y="98" class="b it" text-anchor="middle">θ<tspan dy="0.35em" font-size="72%">cmd</tspan></text><rect x="360" y="52" width="100" height="20" rx="10" class="pill-org"/><text x="410" y="66" class="xs b w" text-anchor="middle">07장에서 채움</text><rect x="350" y="80" width="120" height="60" rx="6" class="boxd"/><text x="410" y="107" class="b" text-anchor="middle">G<tspan dy="0.35em" font-size="72%">servo</tspan><tspan dy="-0.35em">(s)</tspan></text><text x="410" y="125" class="s" text-anchor="middle">서보</text><line x1="470" y1="110" x2="524" y2="110" class="ln c-k "/><polygon points="530,110 521.7,113.5 521.7,106.5" class="f-k"/><text x="500" y="98" class="b it" text-anchor="middle">θ</text><rect x="565" y="52" width="50" height="20" rx="10" class="pill-grn"/><text x="590" y="66" class="xs b w" text-anchor="middle">03장</text><rect x="530" y="80" width="120" height="60" rx="6" class="bx-grn"/><text x="590" y="107" class="b" text-anchor="middle">K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">/s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan></text><text x="590" y="125" class="s" text-anchor="middle">빔·공</text><line x1="650" y1="110" x2="744" y2="110" class="ln c-k "/><polygon points="750,110 741.7,113.5 741.7,106.5" class="f-k"/><text x="756" y="115" class="b l" text-anchor="start">y</text><text x="748" y="135" class="s" text-anchor="middle">공 위치</text><circle cx="700" cy="110" r="4" class="f-pur"/><path d="M700 110L700 205L486 205" class="ln c-pur "/><polygon points="480,205 488.3,201.5 488.3,208.5" class="f-pur"/><rect x="340" y="180" width="140" height="50" rx="6" class="bx-pur"/><text x="410" y="202" class="b" text-anchor="middle">H = 1</text><text x="410" y="220" class="s" text-anchor="middle">초음파 센서 (02장)</text><path d="M340 205L105 205L105 129" class="ln c-pur "/><polygon points="105,123 108.5,131.3 101.5,131.3" class="f-pur"/><text x="390" y="268" class="s" text-anchor="middle">점선 상자: 04–06장에서는 θ = θ<tspan dy="0.35em" font-size="72%">cmd</tspan><tspan dy="-0.35em"> (서보 무시)로 두고, 07–08장에서 실험으로 채운다</tspan></text><text x="390" y="292" class="s b" text-anchor="middle">폐루프 전달함수  T(s) = CP / (1 + CP),   P(s) = G<tspan dy="0.35em" font-size="72%">servo</tspan><tspan dy="-0.35em">(s)·K</tspan><tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">/s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan></text>
</svg>
