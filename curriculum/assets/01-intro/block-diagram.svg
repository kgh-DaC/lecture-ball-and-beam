<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-labelledby="t d">
<title id="t">볼앤빔 폐루프 블록선도</title>
<desc id="d">목표 r에서 측정 y를 뺀 오차 e가 제어기 C(s)로 들어가 명령각 θcmd를 만들고, 서보 Gservo(s)를 거쳐 실제 각 θ가 되며, 빔·공 Kb/s²가 공 위치 y를 만든다. y는 초음파 센서(H = 1)로 되먹임된다. 서보 블록은 점선으로, 04–06장에서는 무시한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="299" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="14" y="105" class="b l" text-anchor="start">r</text><text x="10" y="125" class="s" text-anchor="start">목표</text><line x1="30" y1="100" x2="86" y2="100" class="ln c-k "/><polygon points="92,100 83.7,103.5 83.7,96.5" class="f-k"/><circle cx="105" cy="100" r="13" class="box"/><line x1="98" y1="100" x2="112" y2="100" class="ln c-k "/><line x1="105" y1="93" x2="105" y2="107" class="ln c-k "/><text x="83" y="92" class="b" text-anchor="start">+</text><text x="115" y="126" class="b" text-anchor="start">−</text><line x1="118" y1="100" x2="164" y2="100" class="ln c-k "/><polygon points="170,100 161.7,103.5 161.7,96.5" class="f-k"/><text x="144" y="90" class="b it" text-anchor="middle">e</text><rect x="170" y="70" width="120" height="60" rx="6" class="box"/><text x="230" y="97" class="b" text-anchor="middle">C(s)</text><text x="230" y="115" class="s" text-anchor="middle">제어기 (브라우저)</text><line x1="290" y1="100" x2="344" y2="100" class="ln c-k "/><polygon points="350,100 341.7,103.5 341.7,96.5" class="f-k"/><text x="320" y="88" class="b it" text-anchor="middle">θ<tspan dy="0.35em" font-size="72%">cmd</tspan></text><rect x="350" y="70" width="120" height="60" rx="6" class="boxd"/><text x="410" y="97" class="b" text-anchor="middle">G<tspan dy="0.35em" font-size="72%">servo</tspan><tspan dy="-0.35em">(s)</tspan></text><text x="410" y="115" class="s" text-anchor="middle">서보 (07장)</text><line x1="470" y1="100" x2="524" y2="100" class="ln c-k "/><polygon points="530,100 521.7,103.5 521.7,96.5" class="f-k"/><text x="500" y="88" class="b it" text-anchor="middle">θ</text><rect x="530" y="70" width="120" height="60" rx="6" class="box"/><text x="590" y="97" class="b" text-anchor="middle">K<tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">/s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan></text><text x="590" y="115" class="s" text-anchor="middle">빔·공 (03장)</text><line x1="650" y1="100" x2="744" y2="100" class="ln c-k "/><polygon points="750,100 741.7,103.5 741.7,96.5" class="f-k"/><text x="756" y="105" class="b l" text-anchor="start">y</text><path d="M700 100L700 195L486 195" class="ln c-k "/><polygon points="480,195 488.3,191.5 488.3,198.5" class="f-k"/><rect x="340" y="170" width="140" height="50" rx="6" class="box"/><text x="410" y="192" class="b" text-anchor="middle">H = 1</text><text x="410" y="210" class="s" text-anchor="middle">초음파 센서 (02장)</text><path d="M340 195L105 195L105 119" class="ln c-k "/><polygon points="105,113 108.5,121.3 101.5,121.3" class="f-k"/><text x="380" y="258" class="s" text-anchor="middle">점선 상자: 04–06장에서는 θ = θ<tspan dy="0.35em" font-size="72%">cmd</tspan><tspan dy="-0.35em"> (서보 무시)로 두고, 07–08장에서 실험으로 채운다</tspan></text><text x="380" y="282" class="s b" text-anchor="middle">폐루프 전달함수  T(s) = CP / (1 + CP),   P(s) = G<tspan dy="0.35em" font-size="72%">servo</tspan><tspan dy="-0.35em">(s)·K</tspan><tspan dy="0.35em" font-size="72%">b</tspan><tspan dy="-0.35em">/s</tspan><tspan dy="-0.45em" font-size="72%">2</tspan></text>
</svg>
