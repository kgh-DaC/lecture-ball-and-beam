<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d">
<title id="t">극점 위치와 응답의 관계</title>
<desc id="d">왼쪽은 s 평면이다. 허수축 왼쪽은 안정 영역, 오른쪽은 불안정 영역으로 칠했고, 극점 세 종류를 표시했다: ① 왼쪽의 켤레 극점 −1 ± j2, ② 원점의 이중 극점(볼앤빔 기구부), ③ 오른쪽의 극점 +1. 오른쪽은 각 경우의 응답이다: ①은 진동이 줄어들며 최종값에 수렴하고, ②는 포물선처럼 멈추지 않고 커지며, ③은 지수적으로 급격히 커진다.</desc>
