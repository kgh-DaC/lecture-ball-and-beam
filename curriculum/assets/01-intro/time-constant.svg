<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d">
<title id="t">시정수 읽는 법</title>
<desc id="d">1차 시스템 스텝 응답 곡선. 가로축은 시정수 τ 단위의 시간이다. t = τ에서 최종값의 63.2%, 2τ에서 86.5%, 3τ에서 95.0%, 4τ에서 98.2%에 도달한다. 원점에서 그린 접선은 t = τ에서 최종값에 닿는다. ±5% 띠에 들어가는 정착시간은 약 3τ, 10%에서 90%까지의 상승시간은 약 2.2τ이다.</desc>
