<title id="t">스텝 응답 지표 읽는 법</title>
<desc id="d">감쇠비 0.5, 고유진동수 2 rad/s인 2차 시스템의 스텝 응답 곡선에 상승시간(10%에서 90%까지, 약 0.82 s), 첨두시간(약 1.81 s), 퍼센트 오버슈트(약 16.3%), ±5% 띠 기준 정착시간(약 2.64 s)을 표시한 그림.</desc>
