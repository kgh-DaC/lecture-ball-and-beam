<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" role="img" aria-labelledby="t d">
<title id="t">음의 되먹임 등가변환</title>
<desc id="d">왼쪽은 목표 X에서 되먹임 신호 B를 뺀 오차 E가 앞먹임 블록 G를 지나 출력 Y가 되고, Y가 되먹임 블록 H를 거쳐 B로 가합점에 돌아오는 루프이다. 오른쪽은 이것을 하나의 블록 G/(1+GH)로 줄인 모양이다. 아래에 세 관계식 E = X − B, B = HY, Y = GE를 적었고, 이 식에서 E와 B를 지우면 Y/X = G/(1+GH)가 된다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="349" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="28" class="b s" text-anchor="start">원래 블록선도 (음의 되먹임)</text><line x1="24" y1="100" x2="71" y2="100" class="ln c-k "/><polygon points="77,100 68.7,103.5 68.7,96.5" class="f-k"/><text x="24" y="90" class="b l" text-anchor="start">X</text><circle cx="90" cy="100" r="13" class="box"/><line x1="83" y1="100" x2="97" y2="100" class="ln c-k "/><line x1="90" y1="93" x2="90" y2="107" class="ln c-k "/><text x="68" y="92" class="b" text-anchor="start">+</text><text x="100" y="126" class="b" text-anchor="start">−</text><line x1="103" y1="100" x2="144" y2="100" class="ln c-k "/><polygon points="150,100 141.7,103.5 141.7,96.5" class="f-k"/><text x="118" y="90" class="b l" text-anchor="start">E</text><rect x="150" y="72" width="110" height="56" rx="6" class="box"/><text x="205" y="97" class="b" text-anchor="middle">G</text><text x="205" y="115" class="s" text-anchor="middle">앞먹임</text><line x1="260" y1="100" x2="400" y2="100" class="ln c-k "/><line x1="330" y1="100" x2="394" y2="100" class="ln c-k "/><polygon points="400,100 391.7,103.5 391.7,96.5" class="f-k"/><text x="380" y="90" class="b l" text-anchor="start">Y</text><circle cx="330" cy="100" r="4" class="f-k"/><line x1="330" y1="100" x2="330" y2="210" class="ln c-org "/><line x1="330" y1="210" x2="306" y2="210" class="ln c-org "/><polygon points="300,210 308.3,206.5 308.3,213.5" class="f-org"/><rect x="190" y="182" width="110" height="56" rx="6" class="box"/><text x="245" y="207" class="b" text-anchor="middle">H</text><text x="245" y="225" class="s" text-anchor="middle">되먹임</text><path d="M190 210L90 210L90 119" class="ln c-org "/><polygon points="90,113 93.5,121.3 86.5,121.3" class="f-org"/><text x="142" y="202" class="b l" text-anchor="start">B</text><line x1="425" y1="100" x2="499" y2="100" class="ln c-m "/><polygon points="505,100 496.7,103.5 496.7,96.5" class="f-m"/><text x="465" y="86" class="s" text-anchor="middle">하나로</text><text x="465" y="120" class="s" text-anchor="middle">줄이면</text><text x="560" y="28" class="b s" text-anchor="start">등가 블록선도</text><line x1="530" y1="100" x2="569" y2="100" class="ln c-k "/><polygon points="575,100 566.7,103.5 566.7,96.5" class="f-k"/><text x="534" y="90" class="b l" text-anchor="start">X</text><rect x="575" y="72" width="130" height="56" rx="6" class="box"/><text x="640" y="105" class="b" text-anchor="middle">G / (1 + GH)</text><line x1="705" y1="100" x2="754" y2="100" class="ln c-k "/><polygon points="760,100 751.7,103.5 751.7,96.5" class="f-k"/><text x="742" y="90" class="b l" text-anchor="start">Y</text><rect x="20" y="258" width="740" height="74" rx="8" class="boxd"/><text x="40" y="282" class="s b" text-anchor="start">① 가합점: E = X − B</text><text x="300" y="282" class="s b" text-anchor="start">② 되먹임 블록: B = H·Y</text><text x="560" y="282" class="s b" text-anchor="start">③ 앞먹임 블록: Y = G·E</text><text x="390" y="314" class="b" text-anchor="middle">세 식에서 E와 B를 지우면  Y / X = G / (1 + GH)</text>
</svg>
