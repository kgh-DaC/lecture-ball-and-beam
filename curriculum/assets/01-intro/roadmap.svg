<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 245" width="780" height="245" role="img" aria-labelledby="t d">
<title id="t">교재 로드맵</title>
<desc id="d">교재의 여섯 파트를 순서대로 나열한 그림. 파트 A 기초(01, A1, 02, 03, A2장): 말과 장치, 모델 익히기. 파트 B 고전 설계(04–06장): PID 설계와 실기 확인. 파트 C 서보·평가(07–10장): 예측과 실측의 차이 줄이기. 파트 D 고급 제어(11–15장): 더 나은 제어기 비교. 파트 E AI 제어(16–20장): 학습으로 제어하기. 파트 F 가상 실험실(21장): 디지털 트윈 강건성 시험.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="779" height="244" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="390" y="30" class="b l" text-anchor="middle">이 교재가 가는 길</text><rect x="14" y="50" width="112" height="140" rx="10" class="bx-blue"/><rect x="39" y="60" width="62" height="20" rx="10" class="pill-blue"/><text x="70" y="74" class="xs b w" text-anchor="middle">파트 A</text><text x="70" y="104" class="b" text-anchor="middle">기초</text><text x="70" y="124" class="xs f-m" text-anchor="middle">01·A1·02·03·A2</text><line x1="28" y1="136" x2="112" y2="136" class="ln c-m thin dot"/><text x="70" y="156" class="s" text-anchor="middle">말과 장치,</text><text x="70" y="174" class="s" text-anchor="middle">모델 익히기</text><line x1="127" y1="120" x2="135" y2="120" class="ln c-m "/><polygon points="141,120 132.7,123.5 132.7,116.5" class="f-m"/><rect x="142" y="50" width="112" height="140" rx="10" class="bx-grn"/><rect x="167" y="60" width="62" height="20" rx="10" class="pill-grn"/><text x="198" y="74" class="xs b w" text-anchor="middle">파트 B</text><text x="198" y="104" class="b" text-anchor="middle">고전 설계</text><text x="198" y="124" class="xs f-m" text-anchor="middle">04–06</text><line x1="156" y1="136" x2="240" y2="136" class="ln c-m thin dot"/><text x="198" y="156" class="s" text-anchor="middle">PID 설계와</text><text x="198" y="174" class="s" text-anchor="middle">실기 확인</text><line x1="255" y1="120" x2="263" y2="120" class="ln c-m "/><polygon points="269,120 260.7,123.5 260.7,116.5" class="f-m"/><rect x="270" y="50" width="112" height="140" rx="10" class="bx-org"/><rect x="295" y="60" width="62" height="20" rx="10" class="pill-org"/><text x="326" y="74" class="xs b w" text-anchor="middle">파트 C</text><text x="326" y="104" class="b" text-anchor="middle">서보·평가</text><text x="326" y="124" class="xs f-m" text-anchor="middle">07–10</text><line x1="284" y1="136" x2="368" y2="136" class="ln c-m thin dot"/><text x="326" y="156" class="s" text-anchor="middle">예측과 실측의</text><text x="326" y="174" class="s" text-anchor="middle">차이 줄이기</text><line x1="383" y1="120" x2="391" y2="120" class="ln c-m "/><polygon points="397,120 388.7,123.5 388.7,116.5" class="f-m"/><rect x="398" y="50" width="112" height="140" rx="10" class="bx-pur"/><rect x="423" y="60" width="62" height="20" rx="10" class="pill-pur"/><text x="454" y="74" class="xs b w" text-anchor="middle">파트 D</text><text x="454" y="104" class="b" text-anchor="middle">고급 제어</text><text x="454" y="124" class="xs f-m" text-anchor="middle">11–15</text><line x1="412" y1="136" x2="496" y2="136" class="ln c-m thin dot"/><text x="454" y="156" class="s" text-anchor="middle">더 나은</text><text x="454" y="174" class="s" text-anchor="middle">제어기 비교</text><line x1="511" y1="120" x2="519" y2="120" class="ln c-m "/><polygon points="525,120 516.7,123.5 516.7,116.5" class="f-m"/><rect x="526" y="50" width="112" height="140" rx="10" class="bx-red"/><rect x="551" y="60" width="62" height="20" rx="10" class="pill-red"/><text x="582" y="74" class="xs b w" text-anchor="middle">파트 E</text><text x="582" y="104" class="b" text-anchor="middle">AI 제어</text><text x="582" y="124" class="xs f-m" text-anchor="middle">16–20</text><line x1="540" y1="136" x2="624" y2="136" class="ln c-m thin dot"/><text x="582" y="156" class="s" text-anchor="middle">학습으로</text><text x="582" y="174" class="s" text-anchor="middle">제어하기</text><line x1="639" y1="120" x2="647" y2="120" class="ln c-m "/><polygon points="653,120 644.7,123.5 644.7,116.5" class="f-m"/><rect x="654" y="50" width="112" height="140" rx="10" class="bx-m"/><rect x="679" y="60" width="62" height="20" rx="10" class="pill-m"/><text x="710" y="74" class="xs b w" text-anchor="middle">파트 F</text><text x="710" y="104" class="b" text-anchor="middle">가상 실험실</text><text x="710" y="124" class="xs f-m" text-anchor="middle">21</text><line x1="668" y1="136" x2="752" y2="136" class="ln c-m thin dot"/><text x="710" y="156" class="s" text-anchor="middle">디지털 트윈</text><text x="710" y="174" class="s" text-anchor="middle">강건성 시험</text><text x="390" y="222" class="s" text-anchor="middle">단순 모델로 설계 → 실측과 다름을 체험 → 서보 식별로 해소 → 공정하게 평가 → 고급·AI 제어 비교</text>
</svg>
