<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
<title id="t">개루프와 폐루프 비교</title>
<desc id="d">위: 개루프. 정해진 각도 명령이 서보와 빔·공을 거쳐 출력 y가 되며 되먹임이 없어 공이 끝까지 굴러간다. 아래: 폐루프. 목표 r과 센서로 잰 y의 차이 e로 제어기가 명령을 정한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="719" height="299" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<text x="20" y="30" class="b l" text-anchor="start">개루프: 결과를 보지 않는다</text><text x="20" y="72" class="b" text-anchor="start">θ = 2°</text><text x="20" y="90" class="s" text-anchor="start">(정해진 명령)</text><line x1="110" y1="70" x2="154" y2="70" class="ln c-k "/><polygon points="160,70 151.7,73.5 151.7,66.5" class="f-k"/><rect x="160" y="45" width="120" height="50" rx="6" class="box"/><text x="220" y="75" class="b" text-anchor="middle">서보</text><line x1="280" y1="70" x2="324" y2="70" class="ln c-k "/><polygon points="330,70 321.7,73.5 321.7,66.5" class="f-k"/><rect x="330" y="45" width="130" height="50" rx="6" class="box"/><text x="395" y="75" class="b" text-anchor="middle">빔·공</text><line x1="460" y1="70" x2="514" y2="70" class="ln c-k "/><polygon points="520,70 511.7,73.5 511.7,66.5" class="f-k"/><text x="528" y="66" class="s" text-anchor="start">y: 공은 멈추지 않고</text><text x="528" y="82" class="s" text-anchor="start">끝까지 굴러간다</text><line x1="20" y1="125" x2="700" y2="125" class="ln c-m thin dash"/><text x="20" y="155" class="b l" text-anchor="start">폐루프: 측정해서 오차로 명령을 고친다</text><text x="20" y="205" class="b" text-anchor="start">r</text><line x1="34" y1="200" x2="76" y2="200" class="ln c-k "/><polygon points="82,200 73.7,203.5 73.7,196.5" class="f-k"/><circle cx="95" cy="200" r="13" class="box"/><line x1="88" y1="200" x2="102" y2="200" class="ln c-k "/><line x1="95" y1="193" x2="95" y2="207" class="ln c-k "/><text x="73" y="192" class="b" text-anchor="start">+</text><text x="105" y="226" class="b" text-anchor="start">−</text><line x1="108" y1="200" x2="154" y2="200" class="ln c-k "/><polygon points="160,200 151.7,203.5 151.7,196.5" class="f-k"/><text x="130" y="192" class="s it" text-anchor="middle">e</text><rect x="160" y="175" width="120" height="50" rx="6" class="box"/><text x="220" y="205" class="b" text-anchor="middle">제어기</text><line x1="280" y1="200" x2="324" y2="200" class="ln c-k "/><polygon points="330,200 321.7,203.5 321.7,196.5" class="f-k"/><rect x="330" y="175" width="130" height="50" rx="6" class="box"/><text x="395" y="205" class="b" text-anchor="middle">서보·빔·공</text><line x1="460" y1="200" x2="554" y2="200" class="ln c-k "/><polygon points="560,200 551.7,203.5 551.7,196.5" class="f-k"/><text x="568" y="205" class="b" text-anchor="start">y</text><path d="M520 200L520 265L436 265" class="ln c-k "/><polygon points="430,265 438.3,261.5 438.3,268.5" class="f-k"/><rect x="330" y="245" width="100" height="40" rx="6" class="box"/><text x="380" y="270" class="b" text-anchor="middle">센서</text><path d="M330 265L95 265L95 219" class="ln c-k "/><polygon points="95,213 98.5,221.3 91.5,221.3" class="f-k"/><text x="600" y="235" class="s" text-anchor="start">되먹임 경로</text><text x="600" y="251" class="s" text-anchor="start">(초음파로 y 측정)</text>
</svg>
