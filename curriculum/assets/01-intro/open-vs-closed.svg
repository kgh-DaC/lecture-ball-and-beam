<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">개루프와 폐루프 비교</title>
<desc id="d">위: 개루프. 정해진 각도 명령이 서보와 빔·공을 거쳐 출력 y가 되며 센서와 되먹임이 없어 공이 끝까지 굴러간다. 아래: 폐루프. 목표 r과 센서로 잰 y의 차이 e로 제어기가 명령을 정하고, 공이 목표 자리에 선다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;fill:#2f3640}
.s{font-size:12px}.xs{font-size:11px}.l{font-size:16px}.b{font-weight:700}.it{font-style:italic}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.2}.thick{stroke-width:3}
.dash{stroke-dasharray:7 5}.dot{stroke-dasharray:2 4}
.box{fill:#7f8c99;fill-opacity:.10;stroke:#2f3640;stroke-width:1.6}
.boxd{fill:none;stroke:#2f3640;stroke-width:1.6;stroke-dasharray:6 4}
.grid{stroke:#8a949f;stroke-opacity:.35;stroke-width:1;fill:none}
.zone{fill:#1f8a55;fill-opacity:.15}.zone2{fill:#d0611a;fill-opacity:.13}.zone3{fill:#2276c9;fill-opacity:.13}
.solid{fill:#7f8c99;fill-opacity:.35}
.panel{fill:#7f8c99;fill-opacity:.06;stroke:#c9d0d8;stroke-width:1}
.zoneR{fill:#c8323f;fill-opacity:.10}
.bx-k{fill:#2f3640;fill-opacity:.13;stroke:#2f3640;stroke-width:1.8}.pill-k{fill:#2f3640}.bx-m{fill:#66707c;fill-opacity:.13;stroke:#66707c;stroke-width:1.8}.pill-m{fill:#66707c}.bx-blue{fill:#2276c9;fill-opacity:.13;stroke:#2276c9;stroke-width:1.8}.pill-blue{fill:#2276c9}.bx-org{fill:#d0611a;fill-opacity:.13;stroke:#d0611a;stroke-width:1.8}.pill-org{fill:#d0611a}.bx-grn{fill:#1f8a55;fill-opacity:.13;stroke:#1f8a55;stroke-width:1.8}.pill-grn{fill:#1f8a55}.bx-red{fill:#c8323f;fill-opacity:.13;stroke:#c8323f;stroke-width:1.8}.pill-red{fill:#c8323f}.bx-pur{fill:#8050c0;fill-opacity:.13;stroke:#8050c0;stroke-width:1.8}.pill-pur{fill:#8050c0}
text.w{fill:#fff}
.c-k{stroke:#2f3640}.f-k{fill:#2f3640}.c-m{stroke:#66707c}.f-m{fill:#66707c}.c-blue{stroke:#2276c9}.f-blue{fill:#2276c9}.c-org{stroke:#d0611a}.f-org{fill:#d0611a}.c-grn{stroke:#1f8a55}.f-grn{fill:#1f8a55}.c-red{stroke:#c8323f}.f-red{fill:#c8323f}.c-pur{stroke:#8050c0}.f-pur{fill:#8050c0}
text.f-k{fill:#2f3640}text.f-m{fill:#66707c}</style>
<rect x="0.5" y="0.5" width="759" height="379" rx="10" fill="#fbfcfd" stroke="#c9d0d8"/>
<rect x="12" y="12" width="736" height="160" rx="10" class="panel"/><rect x="24" y="24" width="56" height="20" rx="10" class="pill-red"/><text x="52" y="38" class="xs b w" text-anchor="middle">개루프</text><text x="90" y="39" class="b l" text-anchor="start">결과를 보지 않는다</text><text x="28" y="92" class="b" text-anchor="start">θ = 2°</text><text x="28" y="110" class="s f-m" text-anchor="start">(정해진 명령)</text><line x1="112" y1="95" x2="154" y2="95" class="ln c-k "/><polygon points="160,95 151.7,98.5 151.7,91.5" class="f-k"/><rect x="160" y="70" width="110" height="50" rx="6" class="bx-org"/><text x="215" y="100" class="b" text-anchor="middle">서보</text><line x1="270" y1="95" x2="314" y2="95" class="ln c-k "/><polygon points="320,95 311.7,98.5 311.7,91.5" class="f-k"/><rect x="320" y="70" width="120" height="50" rx="6" class="bx-grn"/><text x="380" y="100" class="b" text-anchor="middle">빔·공</text><line x1="440" y1="95" x2="494" y2="95" class="ln c-k "/><polygon points="500,95 491.7,98.5 491.7,91.5" class="f-k"/><text x="470" y="86" class="b it" text-anchor="middle">y</text><text x="300" y="150" class="s f-m" text-anchor="middle">센서 없음 · 되먹임 없음</text><g transform="rotate(9 600 88)"><line x1="555" y1="88" x2="645" y2="88" class="ln c-k thick"/><circle cx="633.8" cy="78" r="8" class="bx-blue"/></g><polygon points="600,91 591,108 609,108" class="box"/><line x1="628" y1="70" x2="654.1" y2="74.9" class="ln c-red "/><polygon points="660,76 651.2,77.9 652.5,71" class="f-red"/><text x="600" y="140" class="s b f-red" text-anchor="middle">공이 끝까지 굴러간다</text><rect x="12" y="184" width="736" height="184" rx="10" class="panel"/><rect x="24" y="196" width="56" height="20" rx="10" class="pill-grn"/><text x="52" y="210" class="xs b w" text-anchor="middle">폐루프</text><text x="90" y="211" class="b l" text-anchor="start">측정해서, 오차로 명령을 고친다</text><text x="26" y="267" class="b l" text-anchor="start">r</text><line x1="40" y1="262" x2="80" y2="262" class="ln c-k "/><polygon points="86,262 77.7,265.5 77.7,258.5" class="f-k"/><circle cx="100" cy="262" r="13" class="box"/><line x1="93" y1="262" x2="107" y2="262" class="ln c-k "/><line x1="100" y1="255" x2="100" y2="269" class="ln c-k "/><text x="78" y="254" class="b" text-anchor="start">+</text><text x="110" y="288" class="b" text-anchor="start">−</text><line x1="113" y1="262" x2="154" y2="262" class="ln c-k "/><polygon points="160,262 151.7,265.5 151.7,258.5" class="f-k"/><text x="137" y="252" class="b it" text-anchor="middle">e</text><rect x="160" y="237" width="110" height="50" rx="6" class="bx-blue"/><text x="215" y="267" class="b" text-anchor="middle">제어기</text><line x1="270" y1="262" x2="304" y2="262" class="ln c-k "/><polygon points="310,262 301.7,265.5 301.7,258.5" class="f-k"/><rect x="310" y="237" width="100" height="50" rx="6" class="bx-org"/><text x="360" y="267" class="b" text-anchor="middle">서보</text><line x1="410" y1="262" x2="444" y2="262" class="ln c-k "/><polygon points="450,262 441.7,265.5 441.7,258.5" class="f-k"/><rect x="450" y="237" width="110" height="50" rx="6" class="bx-grn"/><text x="505" y="267" class="b" text-anchor="middle">빔·공</text><line x1="560" y1="262" x2="634" y2="262" class="ln c-k "/><polygon points="640,262 631.7,265.5 631.7,258.5" class="f-k"/><text x="648" y="267" class="b l" text-anchor="start">y</text><circle cx="600" cy="262" r="4" class="f-pur"/><path d="M600 262L600 330L446 330" class="ln c-pur "/><polygon points="440,330 448.3,326.5 448.3,333.5" class="f-pur"/><rect x="330" y="310" width="110" height="40" rx="6" class="bx-pur"/><text x="385" y="335" class="b" text-anchor="middle">센서</text><path d="M330 330L100 330L100 281" class="ln c-pur "/><polygon points="100,275 103.5,283.3 96.5,283.3" class="f-pur"/><text x="215" y="322" class="s f-pur" text-anchor="middle">되먹임 경로 (초음파로 y 측정)</text><g transform="rotate(0 685 312)"><line x1="645" y1="312" x2="725" y2="312" class="ln c-k thick"/><circle cx="689" cy="302" r="8" class="bx-blue"/></g><polygon points="685,315 676,332 694,332" class="box"/><line x1="689" y1="286" x2="689" y2="296" class="ln c-grn thin"/><text x="689" y="282" class="xs f-grn" text-anchor="middle">목표</text><text x="685" y="352" class="s b f-grn" text-anchor="middle">목표 자리에 선다</text>
</svg>
